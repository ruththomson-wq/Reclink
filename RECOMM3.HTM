/* Reclink design tokens — aligned to the myKaarma Design System.
   Neutral gray ladder (no beige); brand teal-blue as the single primary. */

:root {
  /* surface — myKaarma grays */
  --bg-canvas: #F5F5F5;       /* gray-100 */
  --bg-cream: #F5F5F5;        /* gray-100 (legacy name, now gray) */
  --bg-cream-soft: #FAFAFA;   /* gray-50 */
  --bg-white: #FFFFFF;        /* surface */
  --bg-gray: #F5F5F5;         /* gray-100 */

  /* text — myKaarma gray ladder */
  --t-1: #101828;  /* gray-900 */
  --t-2: #414651;  /* gray-700 */
  --t-3: #535862;  /* gray-600 */
  --t-4: #717680;  /* gray-500 */
  --t-5: #A4A7AE;  /* gray-400 */

  /* borders — myKaarma grays */
  --b-1: #E9EAEB;  /* gray-200 */
  --b-2: #D5D7DA;  /* gray-300 */
  --b-3: #A4A7AE;  /* gray-400 */

  /* primary — myKaarma brand teal-blue (#02679B) */
  --blue-700: #01476E;  /* brand-800 */
  --blue-600: #02679B;  /* brand-600 — THE primary */
  --blue-500: #0377B3;  /* brand-500 */
  --blue-200: #BDD6EA;  /* brand-200 */
  --blue-100: #D3E4F1;  /* brand-100 */
  --blue-50:  #E9F1F8;  /* brand-50 */
  --blue-25:  #F4F8FC;  /* brand-25 */

  /* concern types */
  --occ-text: #1F6F4B;
  --occ-bg:   #DCEEDD;
  --occ-strong:#1F8A4C;

  --custom-text: #B0480A;
  --custom-bg:   #FBE0CB;

  --form-text: #1F6F4B;
  --form-bg:   #DCEEDD;

  --asc-cos-text: #1E5BBE;
  --asc-cos-bg:   #DDE9F8;

  /* status */
  --red-700: #9C2222;
  --red-600: #BE2C2C;
  --red-500: #D33B3B;
  --red-100: #FAE0E0;
  --red-50:  #FCEDED;

  --green-700: #1F6E2A;
  --green-600: #2A8736;
  --green-100: #DDEFDD;
  --green-50:  #ECF6EC;

  --yellow-700: #8A6D00;
  --yellow-600: #B68B00;
  --yellow-100: #FBEAB0;
  --yellow-50:  #FCF3D6;
  --yellow-25:  #FBF7E5;

  /* shadows — myKaarma neutral */
  --shadow-card: 0px 1px 2px 0px rgba(10, 13, 18, 0.05);
  --shadow-modal: 0px 12px 16px -4px rgba(16, 24, 40, 0.10), 0px 4px 6px -2px rgba(16, 24, 40, 0.05);

  /* type — myKaarma uses Lato as the sole UI face */
  --font-sans: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", ui-monospace, "Menlo", "Consolas", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font-sans); color: var(--t-1); }
button { font-family: inherit; }
input, select, textarea { font-family: inherit; color: inherit; }

/* shared utilities */
.caps { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t-3); }
.caps-strong { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  padding: 2px 7px; border-radius: 4px; line-height: 1.45;
}
.pill.occ    { background: var(--occ-bg);    color: var(--occ-text); }
.pill.custom { background: var(--custom-bg); color: var(--custom-text); }
.pill.form   { background: var(--form-bg);   color: var(--form-text); }
.pill.asc-cos{ background: var(--asc-cos-bg);color: var(--asc-cos-text); }
.pill.ungrouped { background: #F0F1F3; color: #535862; }
.pill.inspection { background: #EBECEE; color: #535862; }
.pill.preapproved { background: var(--green-100); color: var(--green-700); text-transform: none; letter-spacing: 0.01em; font-weight: 600; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
.pill.urgent { background: var(--red-100); color: var(--red-700); text-transform: none; letter-spacing: 0.01em; font-weight: 600; font-size: 11px; padding: 3px 8px; border-radius: 999px; }

/* form input */
.input, .select {
  width: 100%;
  height: 34px;
  background: var(--bg-white);
  border: 1px solid var(--b-2);
  border-radius: 5px;
  padding: 0 10px;
  font-size: 13.5px;
  color: var(--t-1);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input:focus, .select:focus {
  border-color: var(--blue-500);
  box-shadow: 0 0 0 4px rgba(2, 103, 155, 0.20);
}
.input.compact, .select.compact { height: 28px; padding: 0 8px; font-size: 12.5px; border-radius: 4px; }

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--t-3);
  margin-bottom: 3px;
}

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 14px;
  border-radius: 6px;
  font-size: 14px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: background 100ms, border-color 100ms, color 100ms, transform 80ms;
  user-select: none;
}
.btn-link { text-transform: none; letter-spacing: 0; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--blue-600); color: #fff; border-color: var(--blue-600); }
.btn-primary:hover { background: var(--blue-700); border-color: var(--blue-700); }
.btn-secondary { background: var(--bg-white); color: var(--t-1); border-color: var(--b-2); }
.btn-secondary:hover { background: var(--bg-cream); border-color: var(--b-3); }
.btn-danger-outline { background: var(--bg-white); color: var(--red-600); border-color: var(--red-500); }
.btn-danger-outline:hover { background: var(--red-50); }
.btn-ghost { background: transparent; color: var(--t-2); }
.btn-ghost:hover { background: var(--bg-gray); }
.btn-link { background: transparent; color: var(--blue-600); height: auto; padding: 0; border: none; outline: none; }
.btn-link:hover { text-decoration: underline; }
.btn-link:focus, .btn-link:focus-visible { outline: none; box-shadow: none; }

.checkbox {
  appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid var(--b-3);
  border-radius: 4px;
  background: var(--bg-white);
  display: inline-grid; place-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 100ms, border-color 100ms;
}
.checkbox:checked {
  background: var(--blue-600);
  border-color: var(--blue-600);
}
.checkbox:checked::after {
  content: "";
  width: 10px; height: 6px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

.radio {
  appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid var(--b-3);
  border-radius: 999px;
  background: var(--bg-white);
  display: inline-grid; place-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color 100ms;
}
.radio:checked { border-color: var(--blue-600); border-width: 5px; }

/* scrollbars (subtle) */
.scrollable::-webkit-scrollbar { width: 10px; height: 10px; }
.scrollable::-webkit-scrollbar-thumb { background: var(--b-2); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
.scrollable::-webkit-scrollbar-thumb:hover { background: var(--b-3); border: 2px solid transparent; background-clip: padding-box; }
    html, body { height: 100%; background: var(--bg-cream-soft); }

  d.textContent = 'JS ERROR:\n' + e.message + '\n\nFile: ' + e.filename + '\nLine: ' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? '\n\nStack:\n' + e.error.stack : '');
});
window.addEventListener('unhandledrejection', function(e) {
  document.body.style.background = '#fff';
  var d = document.getElementById('__dbg');

  d.textContent = 'UNHANDLED REJECTION:\n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + (e.reason && e.reason.stack ? '\n\nStack:\n' + e.reason.stack : '');
});
</script>

const InfoTooltip = ({ tip, size = 13, style = {} }) => {
  const [visible, setVisible] = React.useState(false);
  const [below, setBelow] = React.useState(false);
  const ref = React.useRef(null);
  const handleEnter = () => {
    if (ref.current) {
      const rect = ref.current.getBoundingClientRect();
      setBelow(rect.top < window.innerHeight / 2);
    }
    setVisible(true);
  };
  return (
    <span ref={ref} style={{ position: "relative", display: "inline-flex", alignItems: "center", flexShrink: 0, ...style }}
      onMouseEnter={handleEnter} onMouseLeave={() => setVisible(false)}>
      <IconInfoFilled size={size} style={{ color: "var(--t-4)" }} />
      {visible && (
        <span style={{
          position: "absolute",
          ...(below
            ? { top: "calc(100% + 6px)", bottom: "auto" }
            : { bottom: "calc(100% + 6px)", top: "auto" }),
          left: "50%", transform: "translateX(-50%)",
          background: "#101828", color: "#fff",
          fontSize: 12.5, lineHeight: 1.5, fontWeight: 400,
          padding: "7px 10px", borderRadius: 6,
          boxShadow: "0 4px 16px rgba(0,0,0,0.22)",
          width: 230, whiteSpace: "normal",
          zIndex: 9999, pointerEvents: "none",
        }}>
          {tip}
          {/* Arrow pointing toward the icon */}
          <span style={{
            position: "absolute",
            ...(below
              ? { bottom: "100%", top: "auto", borderBottom: "5px solid #101828", borderTop: "none" }
              : { top: "100%", bottom: "auto", borderTop: "5px solid #101828", borderBottom: "none" }),
            left: "50%", transform: "translateX(-50%)",
            width: 0, height: 0,
            borderLeft: "5px solid transparent", borderRight: "5px solid transparent",
          }} />
        </span>
      )}
    </span>
  );
};

// Cell that morphs between previous/new amount with a soft strike-through transition
const PriceCell = ({ amount, positive, negative }) => {
  const prevRef = React.useRef(amount);
  const [showPrev, setShowPrev] = React.useState(false);
  const [prev, setPrev] = React.useState(amount);

  React.useEffect(() => {
    if (amount !== prevRef.current) {
      setPrev(prevRef.current);
      setShowPrev(true);
      const t = setTimeout(() => setShowPrev(false), 380);
      prevRef.current = amount;
      return () => clearTimeout(t);
    }
  }, [amount]);

  const color = amount === 0
    ? "var(--t-4)"
    : positive
      ? "var(--t-1)"
      : "var(--green-700)";

  const sign = negative && amount > 0 ? "−" : "";

  return (
    <div style={{ textAlign: "right", fontVariantNumeric: "tabular-nums", position: "relative" }}>
      {showPrev && (
        <span style={{
          position: "absolute",
          right: 0, top: -14,
          fontSize: 14,
          color: "var(--t-4)",
          textDecoration: "line-through",
          opacity: 0.7,
          animation: "tfFadeOut 380ms forwards",
        }}>
          {prev > 0 ? `${negative ? "−" : ""}$${prev.toFixed(2)}` : "—"}
        </span>
      )}
      <span style={{ fontSize: 14, fontWeight: amount > 0 ? 600 : 500, color }}>
        {amount > 0 ? `${sign}$${amount.toFixed(2)}` : "—"}
      </span>
    </div>
  );
};

// ── Auto-growing textarea that also keeps a manual drag-resize handle.
// Grows to fit content; if the user drags the corner handle taller, that
// height is respected as a floor on subsequent edits.
const AutoGrowTextarea = ({ value, onChange, minHeight = 34, ...rest }) => {
  const ref = React.useRef(null);
  const manualH = React.useRef(0);

  const grow = React.useCallback(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight, manualH.current, minHeight) + "px";
  }, [minHeight]);

  React.useLayoutEffect(() => { grow(); }, [value, grow]);

  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { onChange(e); grow(); }}
      onInput={grow}
      onMouseUp={(e) => {
        // capture a manual drag-resize as the new floor
        const h = e.currentTarget.offsetHeight;
        if (h > manualH.current) manualH.current = h;
      }}
      rows={1}
      style={{
        width: "100%", minHeight, boxSizing: "border-box",
        border: "1px solid var(--b-2)", borderRadius: 5,
        padding: "7px 8px", fontSize: 14, fontFamily: "inherit", lineHeight: 1.4,
        resize: "vertical", overflow: "hidden", outline: "none",
        background: "var(--bg-white)",
        ...rest.style,
      }}
      {...(() => { const { style, ...r } = rest; return r; })()}
    />
  );
};

// Default grade mapping (matches the tire-tread example: 0–3 fail, 4 caution, 5+ pass)
const defaultGradeOf = (n) => (n == null ? null : n <= 3 ? "fail" : n === 4 ? "caution" : "pass");

const NumericGradeScale = ({ value, onPick, max = 10, gradeOf = defaultGradeOf }) => {
  const nums = [...Array(max).keys()]; // 0..max-1
  const cell = (n, label) => {
    const g = gradeOf(n);
    const p = gradePalette[g] || gradePalette.na;
    const active = value === n;
    return (
      <button
        key={n}
        onClick={() => onPick(n)}
        style={{
          height: 30, padding: "0 6px",
          background: active ? p.activeBg : p.idleBg,
          color: active ? p.activeC : p.idleC,
          border: `1.5px solid ${active ? p.activeBg : p.border}`,
          borderRadius: 5, fontSize: 14, fontWeight: 700,
          fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums",
          cursor: "pointer", transition: "background 100ms, color 100ms, border-color 100ms",
        }}
      >{label}</button>
    );
  };
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(38px, 1fr))", gap: 6 }}>
      {nums.map((n) => cell(n, String(n)))}
      {cell(max, `${max}+`)}

  const grades = TIRE_POSITIONS
    .map((p) => readings[p.key])

  if (!grades.length) return null;
  if (grades.includes("fail")) return "fail";

  // own search bar (distinct from the inline name-input matching).
  const [viaButton, setViaButton] = React.useState(false);

  const ref = React.useRef(null);

  React.useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  const groups = customGroups || [

      label: null,

  const inputMode = selected.type === "ungrouped" && !!onNameChange;
  // Search state — while searching, show matches at the top, hide "Create new", highlight hits.
  const q = search.trim().toLowerCase();

  const matches = searching
    ? all.filter((i) => i.type !== "ungrouped" && i.title.toLowerCase().includes(q))
        .sort((a, b) => (b.title.toLowerCase().startsWith(q) ? 1 : 0) - (a.title.toLowerCase().startsWith(q) ? 1 : 0))

  const hl = (title) => {
    if (!searching) return title;
    const idx = title.toLowerCase().indexOf(q);

    return [title.slice(0, idx), React.createElement("mark", { key: "h", style: { background: "var(--blue-100)", color: "var(--blue-700)", padding: "0 1px", borderRadius: 2 } }, title.slice(idx, idx + q.length)), title.slice(idx + q.length)];

      {open && (

              <input
                autoFocus
                value={search}
                onChange={(e) => setSearch(e.target.value)}

                placeholder="Search concerns…"
                style={{ width: "100%", height: 32, padding: "0 10px", border: "1px solid var(--b-2)", borderRadius: 6, fontSize: 14, outline: "none", fontFamily: "inherit", background: "var(--bg-cream-soft)", boxSizing: "border-box" }}
              />

          {!viaButton ? (
            matches.length ? (
            <React.Fragment>
              <div style={{ padding: "10px 14px 4px 14px", fontSize: 11, fontWeight: 600, letterSpacing: 0.08, textTransform: "uppercase", color: "var(--t-4)" }}>Select an existing concern</div>
              {matches.map((item) => (

                style={{ width: "100%", display: "flex", gap: 10, padding: "9px 14px", alignItems: "flex-start", background: item.id === value ? "var(--blue-50)" : "transparent", border: "none", cursor: "pointer", textAlign: "left" }}
                onMouseEnter={(e) => { if (item.id !== value) e.currentTarget.style.background = "var(--bg-cream)"; }}
                onMouseLeave={(e) => { if (item.id !== value) e.currentTarget.style.background = "transparent"; }}

                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>

            filteredGroups.map((g, gi) => (

                <div style={{

              )}
              {g.items.map((item) => (
                <button
                  key={item.id}

                    width: "100%", display: "flex", gap: 10,
                    padding: "9px 14px", alignItems: "flex-start",
                    background: item.id === value ? "var(--blue-50)" : "transparent",
                    border: "none", cursor: "pointer", textAlign: "left",
                  }}
                  onMouseEnter={(e) => { if (item.id !== value) e.currentTarget.style.background = "var(--bg-cream)"; }}
                  onMouseLeave={(e) => { if (item.id !== value) e.currentTarget.style.background = "transparent"; }}
                >
                  {item.type !== "ungrouped" && <span className={`pill ${item.type}`} style={{ marginTop: 2 }}>{item.typeLabel}</span>}
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                      <span style={{ fontSize: 14, color: "var(--t-1)", fontWeight: 500 }}>{item.title}</span>
                      <span style={{ fontSize: 14, color: "var(--t-4)" }}>{item.count} rec{item.count !== 1 ? "s" : ""}</span>
                    </div>
                    <div style={{ fontSize: 14, color: "var(--t-3)", marginTop: 2 }}>{item.consequence}</div>
                  </div>
                </button>
              ))}
              {gi < filteredGroups.length - 1 && (
                <div style={{ borderTop: "1px solid var(--b-1)", margin: "6px 0" }} />
              )}
            </div>
          )))}

        </div>
      )}
    </div>
  );
};

// ── Search field that queries form/inspection items by name.
// Shows full list on focus; filters as you type; highlights matching letters.
// linkedLabel: if provided, shows a "Use linked concern" shortcut at the top.
const FormItemSearchField = ({ value = "", onChange, formItems = [], placeholder = "Search for a concern", linkedLabel = "", autoOpen = false }) => {
  const [query, setQuery] = React.useState(value);
  const [open, setOpen] = React.useState(autoOpen);
  const wrapRef = React.useRef(null);
  const inputRef = React.useRef(null);
  React.useEffect(() => { if (autoOpen) inputRef.current?.focus(); }, []);

  React.useEffect(() => { setQuery(value); }, [value]);

  React.useEffect(() => {
    const handler = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const filtered = React.useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return formItems;
    return formItems.filter(item => item.name.toLowerCase().includes(q));
  }, [query, formItems]);

  // Wrap matching substring in a highlight span
  const highlight = (text, q) => {
    if (!q.trim()) return <span>{text}</span>;
    const idx = text.toLowerCase().indexOf(q.toLowerCase().trim());
    if (idx === -1) return <span>{text}</span>;
    const len = q.trim().length;
    return (
      <span>
        {text.slice(0, idx)}
        <mark style={{ background: "var(--yellow-100)", color: "var(--yellow-700)", borderRadius: 2, padding: "0 1px", fontWeight: 700 }}>{text.slice(idx, idx + len)}</mark>
        {text.slice(idx + len)}
      </span>
    );
  };

  const statusColors = {
    fail:    { bg: "var(--red-100)",    t: "var(--red-700)",    label: "Fail" },
    caution: { bg: "var(--yellow-100)", t: "var(--yellow-700)", label: "Caution" },
    pass:    { bg: "var(--green-100)",  t: "var(--green-700)",  label: "Pass" },
  };

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <div style={{ position: "relative" }}>
        <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--t-4)", pointerEvents: "none", display: "flex" }}>
          <IconSearch size={14} />
        </span>
        <input
          ref={inputRef}
          className="input"
          value={query}
          placeholder={placeholder}
          onFocus={() => setOpen(true)}
          onChange={e => { setQuery(e.target.value); onChange && onChange(e.target.value, null); }}
          style={{ paddingLeft: 32, height: 36 }}
        />
      </div>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 400,
          background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 7,
          boxShadow: "var(--shadow-modal)", display: "flex", flexDirection: "column",
        }}>
          {/* Scrollable inspection items */}
          <div style={{ maxHeight: 200, overflowY: "auto" }} className="scrollable">
            {filtered.length === 0 ? (
              <div style={{ padding: "12px 14px", fontSize: 13.5, color: "var(--t-4)" }}>No matches</div>
            ) : filtered.map(item => (
              <div
                key={item.id}
                onMouseDown={e => { e.preventDefault(); setQuery(item.name); onChange && onChange(item.name, item); setOpen(false); }}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "9px 12px", cursor: "pointer", borderBottom: "1px solid var(--b-1)" }}
                onMouseEnter={e => e.currentTarget.style.background = "var(--bg-cream)"}
                onMouseLeave={e => e.currentTarget.style.background = ""}
              >
                <span style={{ fontSize: 13.5, color: "var(--t-1)" }}>{highlight(item.name, query)}</span>
                {item.status && statusColors[item.status] && (
                  <span className="pill" style={{ background: statusColors[item.status].bg, color: statusColors[item.status].t, textTransform: "none", letterSpacing: 0.02, flexShrink: 0 }}>{statusColors[item.status].label}</span>
                )}
              </div>
            ))}
          </div>
          {/* "Keep custom" — always pinned at bottom */}
          <div
            onMouseDown={e => { e.preventDefault(); setQuery(""); onChange && onChange("", { id: "__custom__", name: "" }); setOpen(false); }}
            style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", cursor: "pointer", borderTop: "1px solid var(--b-2)", background: "var(--blue-25)", flexShrink: 0 }}
            onMouseEnter={e => e.currentTarget.style.background = "var(--blue-50)"}
            onMouseLeave={e => e.currentTarget.style.background = "var(--blue-25)"}
          >
            <IconX size={13} style={{ color: "var(--blue-500)", flexShrink: 0 }} />
            <span style={{ fontSize: 13.5, fontWeight: 600, color: "var(--blue-600)" }}>Keep custom — not an inspection question</span>
          </div>
        </div>
      )}
    </div>
  );
};

const RecEditorModal = ({

  isNewRec = false,
  sourceType = null,
  sourceConcernTitle = "",
  allConcerns = [],
  formItems = [],

  onPreviewChange,
}) => {

  React.useEffect(() => {
    if (isNewRec && concernStepDone) {
      setTimeout(() => { document.getElementById("rec-whatneedsdone")?.focus(); }, 80);
    }
  }, [concernStepDone]);

  // ── New placement-section state (used when preLinked || lockedConcern)
  const [newBannerDismissed, setNewBannerDismissed] = React.useState(false);
  const [userPickedConcern, setUserPickedConcern] = React.useState(preLinked);

    : (lockedConcern && inspectionPoint) ? inspectionPoint

  const [formSearchKey, setFormSearchKey] = React.useState(0);

  const placementTitle = placementConcernObj ? placementConcernObj.title : (sourceConcernTitle || inspectionPoint || "");

  // When preLinked: show search bar (inputMode) + AddedToTag below with UNLINK
  const [concern, setConcern] = React.useState(preLinked ? "new-form-concern" : defaultConcern);
  const [concernManuallyLinked, setConcernManuallyLinked] = React.useState(preLinked);
  const [linkedConcernId, setLinkedConcernId] = React.useState(preLinked ? defaultConcern : null);
  const [showLinkPicker, setShowLinkPicker] = React.useState(false);

  const [tireReadings, setTireReadings] = React.useState(tire?.readings ?? {});

              <div style={{ display: "flex" }}>
                {/* Left: Inspection result — hidden when a form item is committed OR when in "change" mode (formSearchKey > 0) */}
                {!formItemCommitted && (formSearchKey === 0 || keepCustom) && (
                <div style={{ padding: "10px 12px", flexShrink: 0, borderRight: "1px solid var(--b-1)", borderRadius: "8px 0 0 8px" }}>

                {currentPlacementId === "__unlinked__" ? "ASC" : placementTypeLabel}
              </span>

                onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; e.currentTarget.style.color = "var(--t-1)"; }}
                onMouseLeave={e => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--t-3)"; }}

                <span style={{ color: "var(--t-1)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{placementTitle}</span>

                  onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; e.currentTarget.style.color = "var(--t-1)"; }}

                >

                {/* └─ subdirectory indicator */}
                <div style={{ width: 16, flexShrink: 0, display: "flex", flexDirection: "column" }}>
                  <div style={{ flex: "0 0 20px", borderLeft: "1.5px solid var(--b-3)", borderBottom: "1.5px solid var(--b-3)", borderBottomLeftRadius: 3 }} />
                </div>
                <div style={{ flex: 1, paddingTop: 4 }}>

                    <span style={{ fontSize: 15, lineHeight: 1, color: "var(--yellow-600)" }}>✦</span>
                    <span style={{ flex: 1, fontSize: 13.5, color: "var(--t-2)", lineHeight: 1.5 }}><strong>New:</strong> You can now group this recommendation under an existing concern or keep it standalone.</span>
                    <button onClick={() => setNewBannerDismissed(true)} style={{ flexShrink: 0, background: "none", border: "none", fontWeight: 700, fontSize: 13.5, color: "var(--blue-600)", cursor: "pointer", padding: 0, whiteSpace: "nowrap" }} onMouseEnter={e => e.currentTarget.style.textDecoration = "underline"} onMouseLeave={e => e.currentTarget.style.textDecoration = "none"}>Got it</button>

                  className="btn btn-primary"
                  style={{ height: 32, fontSize: 13.5, padding: "0 18px", opacity: (currentPlacementId !== "__unlinked__" || customConcernName.trim().length > 0) ? 1 : 0.45, cursor: (currentPlacementId !== "__unlinked__" || customConcernName.trim().length > 0) ? "pointer" : "not-allowed", borderRadius: 6 }}
                  disabled={currentPlacementId === "__unlinked__" && !customConcernName.trim()}

        {decline && (!isNewRec || concernStepDone) && (

            onDismiss={() => setDecline(false)}

              setLabor("200"); setParts("110"); setMisc("0");
              setWhatNeedsDone("Replace front brake pads (previously declined 03/14)");

        )}

        {/* Bundle removed — bundling hidden per design */}

        {/* Accordions — hidden until concern step is complete */}
        {(!isNewRec || concernStepDone) && <div style={{ display: "flex", flexDirection: "column", marginTop: 6 }}>

              {[1,2,3].map((i) => (
                <div key={i} style={{
                  aspectRatio: "1/1",
                  borderRadius: 5,
                  background: i === 3 ? "linear-gradient(135deg, #2A2A2A 0%, #1A1A1A 100%)" : `repeating-linear-gradient(45deg, var(--bg-cream-soft), var(--bg-cream-soft) 6px, var(--bg-cream) 6px, var(--bg-cream) 12px)`,
                  border: "1px solid var(--b-1)",
                  position: "relative",
                  display: "grid", placeItems: "center",

                  fontSize: 14, fontFamily: "var(--font-mono)",
                }}>
                  {i === 3 ? <IconPlay size={20} /> : `pad-${i}`}
                </div>
              ))}
              <button style={{
                aspectRatio: "1/1", borderRadius: 5,
                border: "1.5px dashed var(--b-2)",
                background: "transparent",
                color: "var(--t-3)",
                fontSize: 14, fontWeight: 600,
                cursor: "pointer",
                display: "grid", placeItems: "center",
              }}>
                <IconPlus size={16} />
              </button>
            </div>
          </RecAccordion>
          <RecAccordion icon={IconDollar}  title="Tax & fee overrides"   badge="1 override active" defaultOpen={false}>
            <TaxFeeTable baseLabor={Number(labor)} baseParts={Number(parts)} baseMisc={Number(misc)} onHidePriceChange={setHidePrice} />
          </RecAccordion>
        </div>}
      </div>

      {/* Footer — step 1 for isNewRec: just Cancel (Done is inline above); step 2: normal Save */}
      {isNewRec && !concernStepDone ? (
        <div style={{
          flexShrink: 0,
          display: "flex", alignItems: "center", justifyContent: "flex-end",
          padding: "18px 24px",
          background: "var(--bg-cream-soft)",
          borderTop: "1px solid var(--b-1)",
          gap: 8,
        }}>
          <button className="btn btn-secondary" style={{ height: 30, fontSize: 14, padding: "0 11px" }} onClick={handleClose}>Cancel</button>
          <button className="btn btn-primary" style={{ height: 30, fontSize: 14, padding: "0 13px" }} onClick={() => setConcernStepDone(true)}>Continue →</button>
        </div>
      ) : (
      <div style={{
        flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "18px 24px",
        background: "var(--bg-cream-soft)",
        borderTop: "1px solid var(--b-1)",
      }}>
        <div>
          <div className="caps" style={{ color: "var(--t-3)", marginBottom: 0, fontSize: 10 }}>Total · shown to customer</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
            <div style={{ fontSize: 18, fontWeight: 700, color: "var(--t-1)", fontVariantNumeric: "tabular-nums", lineHeight: 1.1 }}>
              ${total.toFixed(2)}
            </div>
            <div style={{ fontSize: 14, color: "var(--t-3)" }}>
              Labor ${labor || 0} · Parts ${parts || 0} · Misc ${misc || 0}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="btn btn-secondary" style={{ height: 30, fontSize: 14, padding: "0 11px" }} onClick={handleClose}>Cancel</button>
          <button className="btn btn-primary" style={{ height: 30, fontSize: 14, padding: "0 13px" }} onClick={() => {
            onSave && onSave({ concern: (preLinked || lockedConcern || isNewRec) ? currentPlacementId : ((concernManuallyLinked && linkedConcernId) ? linkedConcernId : concern), customConcernName, whatNeedsDone, opCode, laborType, hours, labor, parts, misc, total, hidePrice, tireReadings: (isTire || copyFieldsIsTire) ? tireReadings : null,
              status,
              media: inspectionMedia,
              formItemPointId: formItemCommittedId,
              partsList: itemized.map((r) => ({ name: r.desc || r.partNo || "Part", qty: Number(r.qty) || 1, price: Number(r.sell) || 0 })),
              partsRows: itemized });
          }}>Save</button>
        </div>
      </div>
      )}

      {/* Unsaved changes confirmation */}
      {confirmClose && (
        <div style={{
          position: "absolute", inset: 0,
          background: "rgba(16,24,40,0.45)",
          zIndex: 20,
          display: "flex", alignItems: "center", justifyContent: "center",
          borderRadius: isPanel ? 0 : 12,
        }}>
          <div style={{
            background: "var(--bg-white)",
            border: "1px solid var(--b-1)",
            borderRadius: 10,
            boxShadow: "var(--shadow-modal)",
            padding: "24px 24px 20px",
            width: 340,
            display: "flex", flexDirection: "column", gap: 14,
          }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)", marginBottom: 6 }}>Discard changes?</div>
              <div style={{ fontSize: 14, color: "var(--t-3)", lineHeight: 1.5 }}>You have unsaved changes to this recommendation. If you close now, they'll be lost.</div>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button className="btn btn-secondary" style={{ height: 30, fontSize: 14, padding: "0 12px" }} onClick={() => setConfirmClose(false)}>Keep editing</button>
              <button className="btn btn-danger-outline" style={{ height: 30, fontSize: 14, padding: "0 12px" }} onClick={() => { setConfirmClose(false); onClose(); }}>Discard</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const StatusBtn = ({ kind, active, onClick, dim, narrow }) => {
  // kind: fail | caution | pass | na | ni | done | not-done | not-inspected (mpi-tire)
  const palette = {
    fail:    { activeBg: "#D33B3B", activeC: "#fff",         idleBg: "var(--bg-white)", idleC: "#B82828", border: "#F0B6B6" },
    caution: { activeBg: "#F2B91A", activeC: "#3D2A00",      idleBg: "var(--bg-white)", idleC: "#8A6D00", border: "#F3DDA1" },
    pass:    { activeBg: "#2A8736", activeC: "#fff",         idleBg: "var(--bg-white)", idleC: "#1F6E2A", border: "#BDD9BD" },
    na:      { activeBg: "var(--t-3)", activeC: "#fff",      idleBg: "var(--bg-white)", idleC: "var(--t-3)", border: "var(--b-2)" },
    ni:      { activeBg: "var(--t-3)", activeC: "#fff",      idleBg: "var(--bg-white)", idleC: "var(--t-4)", border: "var(--b-2)" },
    done:    { activeBg: "#2A8736", activeC: "#fff",         idleBg: "var(--bg-white)", idleC: "#1F6E2A", border: "#BDD9BD" },
  }[kind] || { activeBg: "var(--t-3)", activeC: "#fff", idleBg: "var(--bg-white)", idleC: "var(--t-3)", border: "var(--b-2)" };

  return (
    <button
      onClick={onClick}
      style={{
        height: 28,
        padding: narrow ? "0 8px" : "0 10px",
        minWidth: narrow ? 0 : 64,
        background: active ? palette.activeBg : palette.idleBg,
        color: active ? palette.activeC : palette.idleC,
        border: `1px solid ${active ? palette.activeBg : palette.border}`,
        borderRadius: 5,
        fontSize: 14,
        fontWeight: 700,
        letterSpacing: 0.05,
        textTransform: "uppercase",
        cursor: "pointer",
        opacity: dim ? 0.4 : 1,
        transition: "background 100ms, color 100ms, border-color 100ms",
        whiteSpace: "nowrap",
      }}
    >
      {{
        fail: "FAIL", caution: "CAUTION", pass: "PASS",
        na: "N/A", ni: "NOT INSPECTED", done: "DONE", "not-done": "NOT DONE",
      }[kind] || kind.toUpperCase()}
    </button>
  );
};

const InspectionStatusGroup = ({ point, onStatus, includeCaution = true, includeNi = true, includeNa = true }) => (
  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
    <StatusBtn kind="fail"    active={point.status === "fail"}    onClick={() => onStatus("fail")} />
    {includeCaution && <StatusBtn kind="caution" active={point.status === "caution"} onClick={() => onStatus("caution")} />}
    <StatusBtn kind="pass"    active={point.status === "pass"}    onClick={() => onStatus("pass")} />
    {includeNa && <StatusBtn kind="na"   active={point.status === "na"} onClick={() => onStatus("na")} dim={point.status && point.status !== "na"} />}
    {includeNi && <StatusBtn kind="ni"   active={point.status === "ni"} onClick={() => onStatus("ni")} dim={point.status && point.status !== "ni"} />}

);

      <span style={{

        background: "var(--red-50)", color: "var(--red-600)",

        textTransform: "uppercase",

  if (kind === "caution") {

// Click-to-open "move" menu — replaces the old drag handle. Lists every other
// concern as a destination, plus an option to spin up a new concern.
const MoveMenu = ({ concerns, currentConcernId, onSelect, onCreateNew, onDragStart, onDragEnd, onDropAtRec, arrow }) => {
  const [open, setOpen] = React.useState(false);
  const [menuPos, setMenuPos] = React.useState({ top: 0, left: 0 });
  const ref = React.useRef(null);
  const btnRef = React.useRef(null);
  // Custom pointer-drag: a click (no movement) opens the menu; a press-and-drag
  // past a small threshold picks the item up and drops it on another concern card.
  // We avoid native HTML5 DnD because it's unreliable here; instead we hit-test
  // with elementFromPoint against [data-concern-drop] cards and reuse onSelect to
  // perform the actual move.
  const dragRef = React.useRef(null);
  const justDraggedRef = React.useRef(false);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const targets = concerns.filter((c) => c.id !== currentConcernId);
  const isDraggable = !!onDragStart;

  const clearHot = (st) => {
    if (!st) return;
    if (st.hotEl) {
      st.hotEl.style.outline = "";
      st.hotEl.style.outlineOffset = "";
      st.hotEl.style.background = st.hotPrevBg || "";
      st.hotEl = null; st.hotPrevBg = null;
    }
    if (st.line) { st.line.remove(); st.line = null; }
    st.mode = null; st.dropConcernId = null; st.dropRecId = null; st.dropBefore = false;
  };

  const onPointerDown = (e) => {
    if (!isDraggable || e.button !== 0) return;
    justDraggedRef.current = false;
    const st = { startX: e.clientX, startY: e.clientY, dragging: false, ghost: null, line: null, hotEl: null, hotPrevBg: null, mode: null, dropConcernId: null, dropRecId: null, dropBefore: false };
    dragRef.current = st;

    const move = (ev) => {
      const dx = ev.clientX - st.startX, dy = ev.clientY - st.startY;
      if (!st.dragging) {
        if (Math.hypot(dx, dy) < 5) return;
        st.dragging = true;
        setOpen(false);
        onDragStart && onDragStart();
        const g = document.createElement("div");
        g.textContent = onDropAtRec ? "Drag to reorder or move" : "Drop on a concern to move";
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:6px 10px;border-radius:6px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:nowrap;";
        document.body.appendChild(g);
        st.ghost = g;
        document.body.style.cursor = "grabbing";
        document.body.style.userSelect = "none";
      }
      st.ghost.style.transform = `translate(${ev.clientX + 14}px, ${ev.clientY + 14}px)`;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "block";
      const closest = (sel) => (under && under.closest ? under.closest(sel) : null);
      const newZone = closest("[data-concern-new]");
      const recRow = (!newZone && onDropAtRec) ? closest("[data-rec-id]") : null;
      const card = (!newZone && !recRow) ? closest("[data-concern-drop]") : null;
      clearHot(st);
      if (newZone) {
        st.mode = "new";
        st.hotEl = newZone; st.hotPrevBg = newZone.style.background;
        newZone.style.outline = "2px solid var(--blue-500)"; newZone.style.outlineOffset = "-2px";
      } else if (recRow) {
        const rect = recRow.getBoundingClientRect();
        const before = ev.clientY < rect.top + rect.height / 2;
        st.mode = "rec";
        st.dropConcernId = recRow.getAttribute("data-rec-concern");
        st.dropRecId = recRow.getAttribute("data-rec-id");
        st.dropBefore = before;
        const line = document.createElement("div");
        line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:2.5px;border-radius:2px;background:#02679B;box-shadow:0 0 0 1px rgba(2,103,155,.2);";
        line.style.left = rect.left + "px";
        line.style.width = rect.width + "px";
        line.style.top = ((before ? rect.top : rect.bottom) - 1) + "px";
        document.body.appendChild(line);
        st.line = line;
      } else if (card) {
        const cid = card.getAttribute("data-concern-drop");
        if (cid !== currentConcernId) {
          st.mode = "card"; st.dropConcernId = cid;
          st.hotEl = card; st.hotPrevBg = card.style.background;
          card.style.outline = "2px solid var(--blue-500)"; card.style.outlineOffset = "-2px";
          card.style.background = "var(--blue-50)";
        }
      }
    };

    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      const mode = st.mode, dc = st.dropConcernId, dr = st.dropRecId, db = st.dropBefore;
      clearHot(st);
      if (st.dragging) {
        justDraggedRef.current = true;
        onDragEnd && onDragEnd();
        if (mode === "new") onCreateNew && onCreateNew();
        else if (mode === "rec" && onDropAtRec) onDropAtRec(dc, dr, db);
        else if (mode === "card" && dc) onSelect(dc);
      }
      dragRef.current = null;
    };

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div ref={ref} style={{ position: "relative", flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
      {/* Press-and-drag to move between concerns; plain click opens the menu. */}
      <div
        role="button"
        tabIndex={0}
        ref={btnRef}
        onPointerDown={isDraggable ? onPointerDown : undefined}
        onClick={(e) => { e.stopPropagation(); if (justDraggedRef.current) { justDraggedRef.current = false; return; } if (!open && btnRef.current) { const r = btnRef.current.getBoundingClientRect(); setMenuPos({ top: r.bottom + 6, left: r.left }); } setOpen((o) => !o); }}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen((o) => !o); } }}
        title={arrow ? "Move to a concern" : (isDraggable ? "Click to pick a concern, or drag to another concern" : "Move to another concern")}
        style={{
          width: 24, height: 24, borderRadius: 5,
          background: open ? "var(--bg-cream)" : "transparent",
          border: `1px solid ${open ? "var(--b-3)" : arrow ? "var(--blue-500)" : "var(--b-2)"}`,
          boxShadow: !open && arrow ? "0 0 0 3px rgba(2,103,155,0.12)" : "none",
          color: arrow ? "var(--blue-500)" : "var(--t-3)", cursor: isDraggable ? "grab" : "pointer",
          display: "grid", placeItems: "center", touchAction: "none",
        }}
        onMouseEnter={(e) => { if (!open) { e.currentTarget.style.background = "var(--bg-cream)"; e.currentTarget.style.borderColor = arrow ? "var(--blue-500)" : "var(--b-3)"; } }}
        onMouseLeave={(e) => { if (!open) { e.currentTarget.style.background = "transparent"; e.currentTarget.style.borderColor = arrow ? "var(--blue-400)" : "var(--b-2)"; } }}
      >
        {arrow ? <IconLink size={15} /> : <IconMove size={15} />}
      </div>

      {open && (
        <div style={{
          position: "fixed", left: menuPos.left, top: menuPos.top,
          width: 300,
          background: "var(--bg-white)",
          border: "1px solid var(--b-2)",
          borderRadius: 8,
          boxShadow: "var(--shadow-modal)",
          zIndex: 9999,
          padding: "6px 0", maxHeight: 340, overflowY: "auto",
          animation: "menuIn 140ms cubic-bezier(.2,.8,.2,1)",
        }} className="scrollable">
          <div style={{ padding: "8px 14px 4px", fontSize: 11, fontWeight: 600, letterSpacing: 0.08, textTransform: "uppercase", color: "var(--t-4)" }}>
            Link to a concern
          </div>
          {targets.map((c) => {
            const cp = concernPalette[c.type];
            const count = c.recs.length + c.points.length;
            return (
              <button
                key={c.id}
                onClick={(e) => { e.stopPropagation(); setOpen(false); onSelect(c.id); }}
                style={{
                  width: "100%", display: "flex", gap: 10, alignItems: "flex-start",
                  padding: "9px 14px", background: "transparent",
                  border: "none", cursor: "pointer", textAlign: "left",
                }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--bg-cream)"}
                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
              >
                <span className="pill" style={{ background: cp.pillFill, color: cp.pillT, marginTop: 2 }}>{cp.label}</span>
                <div style={{ flex: 1, minWidth: 0, display: "flex", justifyContent: "space-between", gap: 10 }}>
                  <span style={{ fontSize: 14, color: "var(--t-1)", fontWeight: 500 }}>{c.title}</span>
                  <span style={{ fontSize: 14, color: "var(--t-4)", whiteSpace: "nowrap" }}>{count} item{count !== 1 ? "s" : ""}</span>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
};


// Drag handle for reordering ASC concern cards. Only rendered for ASC concerns
// when 2+ are present; OCC cards never get one, so they can't be reordered.
const CardDragHandle = ({ selfConcernId, onReorder, onDragStart, onDragEnd }) => {
  const dragRef = React.useRef(null);

  const onPointerDown = (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    const st = { sx: e.clientX, sy: e.clientY, dragging: false, ghost: null, line: null, target: null, before: false };
    dragRef.current = st;
    const clearLine = () => { if (st.line) { st.line.remove(); st.line = null; } st.target = null; };
    const move = (ev) => {
      if (!st.dragging) {
        if (Math.hypot(ev.clientX - st.sx, ev.clientY - st.sy) < 5) return;
        st.dragging = true;
        onDragStart && onDragStart();
        const g = document.createElement("div");
        g.textContent = "Drag to reorder concern";
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:6px 10px;border-radius:6px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:nowrap;";
        document.body.appendChild(g); st.ghost = g;
        document.body.style.cursor = "grabbing"; document.body.style.userSelect = "none";
      }
      st.ghost.style.transform = `translate(${ev.clientX + 14}px, ${ev.clientY + 14}px)`;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "block";
      const card = under && under.closest ? under.closest("[data-concern-reorderable]") : null;
      clearLine();
      if (card) {
        const cid = card.getAttribute("data-concern-drop");
        if (cid !== selfConcernId) {
          const rect = card.getBoundingClientRect();
          const before = ev.clientY < rect.top + rect.height / 2;
          st.target = cid; st.before = before;
          const line = document.createElement("div");
          line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:3px;border-radius:2px;background:#02679B;box-shadow:0 0 0 1px rgba(2,103,155,.2);";
          line.style.left = rect.left + "px"; line.style.width = rect.width + "px";
          line.style.top = ((before ? rect.top : rect.bottom) - 1.5) + "px";
          document.body.appendChild(line); st.line = line;
        }
      }
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = ""; document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      const t = st.target, b = st.before;
      clearLine();
      if (st.dragging) { onDragEnd && onDragEnd(); if (t) onReorder(t, b); }
      dragRef.current = null;
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div
      role="button"
      tabIndex={0}
      onPointerDown={onPointerDown}
      onClick={(e) => e.stopPropagation()}
      title="Drag to reorder this concern"
      style={{
        width: 20, height: 22, borderRadius: 5, flexShrink: 0, marginRight: -6,
        background: "transparent", border: "none",
        color: "var(--t-3)", cursor: "grab",
        display: "grid", placeItems: "center", touchAction: "none",
      }}
      onMouseEnter={(e) => { e.currentTarget.style.color = "var(--t-1)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.color = "var(--t-3)"; }}
    >
      <IconMove size={14} />
    </div>
  );
};


const AddRecDropdown = ({ onAddRec, onAddCustomRec, large, label = "REC" }) => {

  const ref = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const h = large ? 34 : 24;
  const fs = large ? 12 : 11.5;
  const btnBase = {
    height: h,
    background: "var(--bg-white)", border: "1px solid var(--blue-200)",
    color: "var(--blue-600)", cursor: "pointer",
    display: "inline-flex", alignItems: "center",
    fontFamily: "inherit", fontSize: fs, fontWeight: 700,
    whiteSpace: "nowrap", letterSpacing: large ? 0.04 : 0, textTransform: large ? "uppercase" : "none",
  };

  return (
    <div ref={ref} style={{ position: "relative", display: "inline-flex", flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
      <button
        onClick={() => { onAddRec(); setOpen(false); }}
        style={{ ...btnBase, padding: large ? "0 10px" : "0 8px", borderRight: "none", borderRadius: large ? "6px 0 0 6px" : "5px 0 0 5px", gap: 4 }}
        onMouseEnter={(e) => e.currentTarget.style.background = "var(--blue-50)"}
        onMouseLeave={(e) => e.currentTarget.style.background = "var(--bg-white)"}
      >
        <IconPlus size={11} /> {label}

// ── Preview panel shown to the left of the rec-editor modal.
const ModalContextPreview = ({ concerns, recConcerns = [], targetConcernId, liveState, panel, onReorderRec }) => {
  // Pointer-based drag handler for preview rec rows (reorder within concern)
  const makeRecDrag = (recId, concernId) => (e) => {
    if (e.button !== 0 || !onReorderRec) return;
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_) {}
    const st = { sx: e.clientX, sy: e.clientY, dragging: false, ghost: null, line: null, dropId: null, dropBefore: false };
    const move = (ev) => {
      ev.preventDefault();
      const dx = ev.clientX - st.sx, dy = ev.clientY - st.sy;
      if (!st.dragging) {
        if (Math.hypot(dx, dy) < 4) return;
        st.dragging = true;
        const g = document.createElement("div");
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:4px 10px;border-radius:5px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap;";
        g.textContent = "Reorder";
        document.body.appendChild(g); st.ghost = g;
        document.body.style.cursor = "grabbing"; document.body.style.userSelect = "none";
      }
      if (st.ghost) st.ghost.style.transform = `translate(${ev.clientX + 12}px,${ev.clientY + 12}px)`;
      if (st.line) { st.line.remove(); st.line = null; }
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "block";
      const row = under && under.closest ? under.closest("[data-pvw-rec]") : null;
      if (row && row.getAttribute("data-pvw-concern") === concernId && row.getAttribute("data-pvw-rec") !== recId) {
        const rect = row.getBoundingClientRect();
        const before = ev.clientY < rect.top + rect.height / 2;
        st.dropId = row.getAttribute("data-pvw-rec"); st.dropBefore = before;
        const line = document.createElement("div");
        line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:2px;border-radius:2px;background:#02679B;";
        line.style.left = rect.left + "px"; line.style.width = rect.width + "px";
        line.style.top = ((before ? rect.top : rect.bottom) - 1) + "px";
        document.body.appendChild(line); st.line = line;
      } else { st.dropId = null; }
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = ""; document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      if (st.line) st.line.remove();
      if (st.dragging && st.dropId) onReorderRec(concernId, recId, st.dropId, st.dropBefore);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };
  // Use concerns (MPI tab) as the sole source of truth — recs are populated when the user saves
  const occs = concerns.filter(c => c.type === "occ");
  const ascs = concerns.filter(c => c.type !== "occ");

  // liveState: { concernId, customName, recText } from RecEditorModal
  const liveId = liveState?.concernId;
  const liveName = liveState?.customName || "";
  const liveText = liveState?.recText || "";

  // Helper: resolve an ID (which may be from recConcerns with different IDs) to a concern in concerns[].
  // Tries direct match first, then title-match for OCCs (since OCC IDs differ between concerns/recConcerns).
  const resolveId = (id) => {
    if (!id) return null;
    const direct = concerns.find(c => c.id === id);
    if (direct) return direct;
    const rc = (recConcerns || []).find(r => r.id === id);
    if (rc?.type === "occ") {
      return concerns.find(c => c.type === "occ" && c.title?.trim().toLowerCase() === rc.title?.trim().toLowerCase()) || null;
    }
    return null;
  };

  const targetInConcerns = resolveId(targetConcernId);
  const liveConcernInMpi = (liveId && liveId !== "__new_custom__" && liveId !== "__unlinked__") ? resolveId(liveId) : null;
  const liveIsKnown = !!liveConcernInMpi;

  // Show a synthetic entry for custom/unlinked/ASC-from-recConcerns concerns
  // When linking to an existing recConcerns ASC (not in concerns yet), use its real title+type
  const rcForSynthetic = (liveId && !liveIsKnown) ? (recConcerns || []).find(r => r.id === liveId) : null;
  const syntheticConcern = (liveState && !liveIsKnown && liveId && liveId !== "new-form-concern")
    ? { id: "__live__", type: rcForSynthetic?.type || "asc_m", title: rcForSynthetic?.title || liveName || "New concern", recs: [], _liveTarget: true }
    : null;

  const all = [...occs, ...ascs, ...(syntheticConcern ? [syntheticConcern] : [])];
  if (all.length === 0) return null;
  return (
    <div style={{
      width: 330, flexShrink: 0,
      background: "var(--bg-cream-soft)",
      borderRadius: panel ? 0 : 12,
      borderRight: panel ? "1px solid var(--b-2)" : undefined,
      border: panel ? undefined : "1px solid var(--b-2)",
      boxShadow: panel ? "none" : "0 8px 32px rgba(0,0,0,0.14)",
      overflow: "hidden",
      height: panel ? "100%" : undefined,
      maxHeight: panel ? undefined : "80vh",
      overflowY: "auto",
      alignSelf: panel ? "stretch" : "flex-start",
      animation: "modalIn 220ms cubic-bezier(.2,.8,.2,1)",
    }} className="scrollable">
      <div style={{ padding: "9px 12px 8px", borderBottom: "1px solid var(--b-1)", background: "var(--bg-white)" }}>
        <span style={{ fontSize: 11, fontWeight: 700, color: "var(--t-4)", textTransform: "uppercase", letterSpacing: 0.07 }}>Preview Recommendations</span>
      </div>
      <div style={{ padding: 8, display: "flex", flexDirection: "column", gap: 6 }}>
      {all.map((c, idx) => {
        const p = concernPalette[c.type] || concernPalette.asc_m;
        const isOcc = c.type === "occ";
        // isTarget: liveIsKnown takes exclusive priority so linking to a different concern
        // removes "Current rec" from the original. Fall back to targetInConcerns only when
        // liveState hasn't resolved yet (null = first render before useEffect fires).
        const isTarget = c._liveTarget
          || (liveIsKnown
            ? c === liveConcernInMpi
            : (!liveState && targetInConcerns && c === targetInConcerns));
        const occIdx = isOcc ? occs.indexOf(c) : -1;
        const letter = occIdx >= 0 ? String.fromCharCode(65 + occIdx) : null;
        return (
          <div key={c.id} style={{ borderRadius: 7, overflow: "hidden", border: `1px solid ${p.headBd}`, background: "var(--bg-white)" }}>
            {/* Concern header */}
            <div style={{ display: "flex", alignItems: "flex-start", gap: 7, padding: "7px 12px", background: p.headBg }}>
              <ConcernTypePill label={p.label} bg={p.pillBg} color={p.pillT} />
              {letter && (
                <span style={{ background: "var(--occ-strong)", color: "#fff", fontSize: 10, fontWeight: 700, width: 16, height: 16, borderRadius: 999, flexShrink: 0, display: "inline-grid", placeItems: "center" }}>{letter}</span>
              )}
              <span style={{ flex: 1, minWidth: 0, fontSize: 12, fontWeight: 700, color: "var(--t-1)", textTransform: "uppercase", lineHeight: 1.35, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{c.title}</span>
            </div>
            {/* Sub-items */}
            <>
              {/* OCC: Pre-approved row styled to match Edit MPI view */}
              {isOcc && (
                <div style={{
                  display: "flex", alignItems: "center", gap: 8,
                  padding: "6px 12px",
                  borderBottom: c.recs.length > 0 || isTarget ? "1px solid var(--b-1)" : "none",
                }}>
                  <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 12, fontWeight: 700, color: "var(--green-700)", letterSpacing: 0.02, whiteSpace: "nowrap" }}>Pre-Approved</span>
                    {c.preApproved && (
                      <span style={{ fontSize: 11.5, color: "var(--t-4)" }}>
                        {"Labor $" + (Number(c.preApproved.labor)||0).toFixed(0)}
                        {Number(c.preApproved.parts) > 0 ? " · Parts $" + Number(c.preApproved.parts).toFixed(0) : ""}
                        {Number(c.preApproved.misc) > 0 ? " · Misc $" + Number(c.preApproved.misc).toFixed(0) : ""}
                      </span>
                    )}
                  </div>
                  {c.preApproved && (() => {
                    const t = (Number(c.preApproved.labor)||0) + (Number(c.preApproved.parts)||0) + (Number(c.preApproved.misc)||0);
                    return t > 0 ? <span style={{ flexShrink: 0, fontSize: 13, fontWeight: 700, color: "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>${t.toFixed(0)}</span> : null;
                  })()}
                </div>
              )}
              {/* All recs (OCC or ASC) */}
              {(c.recs || []).map((r, ri) => (
                <div key={r.id}
                  data-pvw-rec={r.id}
                  data-pvw-concern={c.id}
                  style={{
                    display: "flex", alignItems: "center", gap: 7,
                    padding: "7px 12px 7px 10px",
                    background: "transparent",
                    borderBottom: ri < c.recs.length - 1 || isTarget ? "1px solid var(--b-1)" : "none",
                  }}>
                  <span onPointerDown={makeRecDrag(r.id, c.id)} style={{ display: "flex", alignItems: "center", flexShrink: 0, cursor: onReorderRec ? "grab" : "default", touchAction: "none", userSelect: "none", padding: "2px 2px" }}>
                    <IconMove size={13} style={{ color: "var(--t-4)", pointerEvents: "none" }} />
                  </span>
                  <span style={{ fontSize: 13, color: "var(--t-1)", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.text || r.recommendation}</span>
                  {r.fresh && <span style={{ fontSize: 11, fontWeight: 700, color: "var(--blue-600)", background: "var(--blue-100)", borderRadius: 4, padding: "1px 6px", flexShrink: 0, whiteSpace: "nowrap" }}>Just added</span>}
                </div>
              ))}
              {/* Current rec being created — shows live text as user types */}
              {isTarget && (
                <div style={{
                  display: "flex", alignItems: "center", gap: 7,
                  padding: "7px 12px 7px 18px",
                  background: "transparent",
                }}>
                  <IconMove size={13} style={{ color: "var(--blue-400)", flexShrink: 0 }} />
                  <span style={{ fontSize: 13, color: liveText ? "var(--t-1)" : "var(--t-4)", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontStyle: liveText ? "normal" : "italic" }}>
                    {liveText || "New recommendation"}
                  </span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "var(--blue-600)", background: "var(--blue-100)", borderRadius: 4, padding: "1px 6px", flexShrink: 0, whiteSpace: "nowrap" }}>Current rec</span>
                </div>
              )}
            </>
          </div>
        );
      })}
    </div>
  </div>
  );
};

const ConcernCard = ({ concern, onPointStatusChange, onAddRec, onAddCustomRec, onRemoveConcern, onDeleteRec, onRecClick, onTitleChange,
  dragActive, isDragSource, isDragOver, draggingRecId, draggingPointId,
  onRecDragStart, onRecDragEnd, onPointDragStart, onPointDragEnd, onCardDragOver, onCardDragLeave, onCardDrop,
  isFirst, isLast, concerns, onMoveRecTo, onMoveRecRelative, onMovePointTo, onMoveRecToNew, onMovePointToNew,
  canReorder, onReorderConcern, letter }) => {
  const p = concernPalette[concern.type];
  const concernTotal = concern.recs.reduce((s, r) => s + (Number(r.total) || 0), 0);
  const concernLabor = concern.recs.reduce((s, r) => s + (Number(r.labor) || 0), 0);
  const concernParts = concern.recs.reduce((s, r) => s + (Number(r.parts) || 0), 0);
  const concernMisc  = concern.recs.reduce((s, r) => s + (Number(r.misc)  || 0), 0);
  // For OCC cards, use preApproved amounts if set, otherwise fall back to rec totals
  const displayLabor = concern.preApproved ? concern.preApproved.labor : concernLabor;
  const displayParts = concern.preApproved ? concern.preApproved.parts : concernParts;
  const displayMisc  = concern.preApproved ? concern.preApproved.misc  : concernMisc;
  const displayTotal = concern.preApproved ? (concern.preApproved.labor + concern.preApproved.parts + concern.preApproved.misc) : concernTotal;
  const hasRecs = concern.recs.length > 0;
  const showDropBanner = dragActive && !isDragSource;

  return (
    <div
      data-concern-drop={concern.id}
      data-concern-reorderable={canReorder ? "1" : undefined}
      onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (!isDragSource) onCardDragOver && onCardDragOver(); }}
      onDragLeave={(e) => { if (e.currentTarget.contains(e.relatedTarget)) return; onCardDragLeave && onCardDragLeave(); }}
      onDrop={(e) => { e.preventDefault(); if (!isDragSource) onCardDrop && onCardDrop(); }}
      style={{
        marginBottom: 8,
        border: `1.5px solid ${isDragOver ? "var(--blue-500)" : p.headBd}`,
        borderRadius: 8,
        background: isDragOver ? "var(--blue-50)" : "transparent",
        boxShadow: isDragOver ? "0 0 0 3px rgba(2,103,155,0.16)" : "none",
        transition: "box-shadow 140ms, background 140ms, border-color 140ms",
    }}>
      {showDropBanner && (
        <div style={{
          padding: "6px 14px",
          background: isDragOver ? "var(--blue-100)" : "var(--bg-cream-soft)",
          borderBottom: "1px dashed var(--blue-200)",
          borderRadius: "7px 7px 0 0",
          fontSize: 14, fontWeight: 600, color: "var(--blue-700)",
          display: "flex", alignItems: "center", gap: 6,
        }}>
          <IconPlus size={12} /> Drop here to move into this concern
        </div>
      )}
      <ConcernCardHeader
        concern={concern}
        palette={p}
        letter={letter}
        reorderable={canReorder}
        onReorder={(targetId, before) => onReorderConcern && onReorderConcern(targetId, before)}
        onTitleChange={onTitleChange}
        onAddRec={onAddRec}
        total={displayTotal}
        showTotal={hasRecs || !!concern.preApproved}
        hasZeroShown={false}
        style={{
          borderRadius: showDropBanner ? 0 : (hasRecs ? "8px 8px 0 0" : 8),
          borderBottom: (hasRecs && !showDropBanner) ? `1px solid ${p.headBd}` : "none",
        }}
      />

      {concern.type === "occ" && concern.preApproved && (() => {
        const pa = concern.preApproved;
        const paTotal = pa.labor + pa.parts + pa.misc;
        const hasMore = concern.recs.length > 0;
        return (
          <div key="preapproved" style={{
            display: "flex", alignItems: "center", gap: 8,
            padding: "8px 0 8px 14px",
            borderBottom: hasMore ? "1px solid var(--b-1)" : "none",
            borderRadius: hasMore ? 0 : "0 0 7px 7px",
            background: "var(--bg-white)",
          }}>
            <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: "var(--green-700)", letterSpacing: 0.02 }}>Pre-Approved</span>
              <span style={{ fontSize: 12.5, color: "var(--t-4)" }}>Labor ${pa.labor.toFixed(0)}{pa.parts > 0 ? ` · Parts $${pa.parts.toFixed(0)}` : ""}{pa.misc > 0 ? ` · Misc $${pa.misc.toFixed(0)}` : ""}</span>
            </div>
            {/* Price column — matches rec row */}
            <div style={{ width: 76, flexShrink: 0, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>
              <span style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)" }}>${paTotal.toFixed(0)}</span>
            </div>
            {/* Blank action column — matches header action column width */}
            <div style={{ width: 84, flexShrink: 0 }} />
          </div>
        );
      })()}

      {concern.recs.map((rec, ri) => {
        const isLastRec = ri === concern.recs.length - 1;
        const mediaPresent = rec.media && (rec.media.photos || rec.media.videos);
        // Badges only (no price) — price gets its own column
        const badgeItems = [
          mediaPresent && <MediaTag key="m" media={rec.media} />,
          (rec.partsList?.length || Number(rec.parts) > 0) && <PartsTag key="p" parts={rec.partsList} amount={rec.parts} />,
          rec.status && <RecStatusBadge key="s" status={rec.status} />,
        ].filter(Boolean);
        const priceEl = rec.total != null && (rec.shownToCustomer === 0 && rec.total > 0
          ? <span style={{ display: "inline-flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: "var(--t-4)", textDecoration: "line-through" }}>${Number(rec.total).toFixed(0)}</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: "var(--red-600)" }}>$0</span>
            </span>
          : <span style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)", whiteSpace: "nowrap" }}>${Number(rec.total).toFixed(0)}</span>
        );
        return (
        <div key={rec.id}
          data-rec-id={rec.id}
          data-rec-concern={concern.id}
          style={{
          display: "flex", alignItems: "stretch",
          borderBottom: isLastRec ? "none" : "1px solid var(--b-1)",
          borderRadius: isLastRec ? "0 0 7px 7px" : 0,
          background: "var(--bg-white)",
          cursor: "pointer",
          opacity: draggingRecId === rec.id ? 0.4 : 1,
          transition: "opacity 140ms, background 100ms",
        }}
          onClick={() => onRecClick && onRecClick(concern.id, rec)}
          onMouseEnter={(e) => { e.currentTarget.style.background = "var(--bg-cream)"; }}
          onMouseLeave={(e) => { e.currentTarget.style.background = "var(--bg-white)"; }}
        >
          {/* Drag handle — stretched, trash-centered */}
          <div style={{ flexShrink: 0, display: "flex", alignItems: "center", paddingLeft: 8 }}
            onClick={(e) => e.stopPropagation()}>
            <MoveMenu
              concerns={concerns}
              currentConcernId={concern.id}
              onSelect={(toId) => onMoveRecTo(rec.id, toId)}
              onDropAtRec={(toId, targetRecId, before) => onMoveRecRelative && onMoveRecRelative(rec.id, toId, targetRecId, before)}
              onCreateNew={() => onMoveRecToNew(rec.id)}
              onDragStart={() => onRecDragStart && onRecDragStart(rec.id)}
              onDragEnd={() => onRecDragEnd && onRecDragEnd()}
            />
          </div>
          {/* Text column — flex:1 */}
          <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: "8px 0 8px 10px" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
              <span style={{ fontSize: 14, color: "var(--t-1)" }}>{rec.text}</span>
              {rec.fresh && <JustAddedTag key={rec.id} />}
            </div>
            {rec.total != null && (
              <div style={{ marginTop: 3, fontSize: 13, color: "var(--t-3)", lineHeight: 1.3 }}>
                Labor ${Number(rec.labor || 0).toFixed(0)} · Parts ${Number(rec.parts || 0).toFixed(0)}
                {Number(rec.misc || 0) > 0 && ` · Misc $${Number(rec.misc).toFixed(0)}`}
              </div>
            )}
          </div>
          {/* Badges + price together — one right-side group so they stay visually adjacent */}
          {(badgeItems.filter(Boolean).length > 0 || priceEl) && (
            <div style={{ flexShrink: 0, display: "flex", alignItems: "center", gap: 8, padding: "0 12px 0 8px", minWidth: 76, justifyContent: "flex-end" }}>
              {badgeItems.filter(Boolean).map((node, idx) => (
                <React.Fragment key={idx}>{node}</React.Fragment>
              ))}
              {priceEl && badgeItems.filter(Boolean).length > 0 && (
                <span style={{ width: 1, height: 15, background: "var(--b-2)", flexShrink: 0 }} />
              )}
              {priceEl && <span style={{ fontVariantNumeric: "tabular-nums" }}>{priceEl}</span>}
            </div>
          )}
          {/* Action column — 84px with left border, matches header action column */}
          <div style={{ width: 84, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", borderLeft: "1px solid var(--b-2)" }}
            onClick={(e) => e.stopPropagation()}>
            {onDeleteRec && (
              <button
                onClick={(e) => { e.stopPropagation(); onDeleteRec(rec.id); }}
                style={{ height: 28, padding: "0 9px", background: "transparent", border: "none", borderRadius: 5, color: "var(--t-4)", cursor: "pointer", display: "inline-flex", alignItems: "center", justifyContent: "center" }}
                onMouseEnter={(e) => { e.currentTarget.style.color = "#dc2626"; }}
                onMouseLeave={(e) => { e.currentTarget.style.color = "var(--t-4)"; }}
                title="Delete recommendation"
              ><IconTrash size={15} /></button>
            )}
          </div>
        </div>
        );
      })}

    </div>
  );
};

const InspectionSection = ({ section, onPointStatusChange, onTireReading, onPointFailWithComment, drag, onPointDragStart, onPointDragEnd, concerns, onMoveMpiPointTo, onMoveMpiPointToNew, onPointClick, isFirst = true, isLast = true }) => {
  const [open, setOpen] = React.useState(true);

  return (
    <div style={{ marginBottom: 0 }}>
      <div style={{
        display: "flex", alignItems: "center", gap: 8,
        padding: "6px 14px",
        background: "var(--b-1)",
        border: "1px solid var(--b-2)",
        borderTop: isFirst ? "1px solid var(--b-2)" : "none",
        borderBottom: open ? "none" : "1px solid var(--b-1)",
        borderRadius: `${isFirst ? 6 : 0}px ${isFirst ? 6 : 0}px ${(!open && isLast) ? 6 : 0}px ${(!open && isLast) ? 6 : 0}px`,
        marginBottom: 0,
        cursor: "pointer",
      }} onClick={() => setOpen(!open)}>
        <div style={{
          color: "var(--t-3)", transition: "transform 180ms",
          transform: open ? "rotate(0)" : "rotate(-90deg)",
        }}>
          <IconChevDown size={14} />
        </div>
        <div style={{ flex: 1, fontSize: 14, fontWeight: 600, color: "var(--t-1)" }}>{section.title}</div>
        <div style={{
          background: "var(--bg-white)", border: "1px solid var(--b-2)",
          padding: "4px 10px", borderRadius: 4,
          fontSize: 11, fontWeight: 700, letterSpacing: 0.04, textTransform: "uppercase",
          color: "var(--t-2)", display: "inline-flex", alignItems: "center", gap: 6,
        }} onClick={(e) => e.stopPropagation()}>
          Pass remaining <IconChevDown size={11} />
        </div>
      </div>

      {open && (
        <div style={{ background: "var(--bg-white)", border: "1px solid var(--b-1)", borderTop: "none", borderRadius: `0 0 ${isLast ? 6 : 0}px ${isLast ? 6 : 0}px` }}>
          {section.points.map((pt, i) => (
            pt.type === "tire" ? (
              <div key={pt.id} style={{
                padding: "12px 14px 12px 12px",
                borderTop: i === 0 ? "none" : "1px solid var(--b-1)",
                opacity: drag && drag.kind === "mpiPoint" && drag.pointId === pt.id ? 0.4 : 1,
                transition: "opacity 140ms",
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
                  {pt.status === "fail" && (
                    <MoveMenu
                      arrow
                      concerns={concerns}
                      currentConcernId={null}
                      onSelect={(toId) => onMoveMpiPointTo(pt.id, toId)}
                      onCreateNew={() => onMoveMpiPointToNew && onMoveMpiPointToNew(pt.id)}
                    />
                  )}
                  <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-1)" }}>{pt.name}</span>
                  <span style={{ fontSize: 14, color: "var(--t-3)" }}>0–3 replace · 4 monitor · 5+ ok</span>
                  {(pt.status === "fail" || pt.status === "caution") && pt.addedTo && <AddedToTag addedTo={pt.addedTo} />}
                </div>
                <TireTreadGrid
                  readings={pt.readings || {}}
                  unit={pt.unit || "mm"}
                  columns={false}
                  onChange={(pos, n) => onTireReading(section.id, pt.id, pos, n)}
                  onNotInspected={() => onTireReading(section.id, pt.id, "__ni__", null)}
                  notInspected={pt.status === "ni"}
                />
              </div>
            ) : (
            <div key={pt.id} style={{
              padding: "10px 14px 10px 12px",
              display: "flex", alignItems: "center", gap: 12,
              borderTop: i === 0 ? "none" : "1px solid var(--b-1)",
              opacity: drag && drag.kind === "mpiPoint" && drag.pointId === pt.id ? 0.4 : 1,
              transition: "opacity 140ms",
              cursor: onPointClick ? "pointer" : "default",
            }}
            onClick={onPointClick ? (e) => { e.stopPropagation(); onPointClick(pt, section); } : undefined}
            onMouseEnter={onPointClick ? (e) => { e.currentTarget.style.background = "var(--bg-cream)"; } : undefined}
            onMouseLeave={onPointClick ? (e) => { e.currentTarget.style.background = ""; } : undefined}
            >
              {pt.status === "fail" && (
                <MoveMenu
                  arrow
                  concerns={concerns}
                  currentConcernId={null}
                  onSelect={(toId) => onMoveMpiPointTo(pt.id, toId)}
                  onCreateNew={() => onMoveMpiPointToNew && onMoveMpiPointToNew(pt.id)}
                />
              )}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, color: "var(--t-1)" }}>{pt.name}</div>
                {(pt.status === "fail" || pt.status === "caution") && pt.addedTo && <AddedToTag addedTo={pt.addedTo} />}
                {pt.comments && (
                  <div style={{
                    marginTop: 6,
                    background: "var(--bg-cream-soft)",
                    border: "1px solid var(--b-1)",
                    borderLeft: "3px solid var(--red-500)",
                    borderRadius: 4,
                    padding: "7px 10px",
                    fontSize: 14,
                  }}>
                    <div style={{ color: "var(--t-2)" }}>
                      <b style={{ color: "var(--red-700)" }}>● Comments:</b> {pt.comments}
                    </div>
                    <div style={{ color: "var(--t-3)", marginTop: 2 }}>
                      <b style={{ color: "var(--t-2)" }}>● Labor Hours:</b> {pt.laborHours} <span style={{ marginLeft: 12 }}><b style={{ color: "var(--t-2)" }}>● Labor Cost:</b> ${pt.laborCost}</span> <span style={{ marginLeft: 12 }}><b style={{ color: "var(--t-2)" }}>● Parts Cost:</b> ${pt.partsCost}</span>
                    </div>
                  </div>
                )}
              </div>
              <InspectionStatusGroup
                point={pt}
                onStatus={(s) => onPointStatusChange(section.id, pt.id, s)}
              />
            </div>
            )
          ))}
        </div>
      )}
    </div>
  );
};

const RailIcons = ({ sidebarOpen, onToggleSidebar }) => (
  <div style={{
    width: 48, flexShrink: 0,
    background: "var(--bg-cream-soft)",
    borderRight: "1px solid var(--b-1)",
    display: "flex", flexDirection: "column",
    alignItems: "center", padding: "8px 0", gap: 4,

    <button
      onClick={onToggleSidebar}
      title={sidebarOpen ? "Collapse panel" : "Expand panel"}
