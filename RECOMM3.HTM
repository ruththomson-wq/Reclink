// ── A single recommendation line within a concern.
const RecRecRow = ({ rec, concernId, isFirst, isLast, approval, onApprovalChange, onRecClick, selected = false, onToggleSelect, defaultExpanded = false, compact = true, phase = 1 }) => {
  const [expanded, setExpanded] = React.useState(defaultExpanded);
  // Phase 1: always show the full expanded (3-column) layout, permanently — no per-row
  // chevron and no way to collapse back to the compact summary row. Phase 2 keeps the
  // normal expand/collapse toggle (master "Expand" switch + per-row chevron).
  const canExpand = phase !== 1;
  const isExpanded = phase === 1 ? true : expanded;
  const [workStatus, setWorkStatus] = React.useState(() => {
    if (!rec.workTag) return "—";
    return rec.workTag.tone === "done" ? "Done" : rec.workTag.label;
  });
  const stat = REC_STATUS[rec.status];
  const hasMedia = rec.media && typeof rec.media === "object" && (rec.media.photos > 0 || rec.media.videos > 0);
  const total = rec.total;
  const shownToCustomer = rec.shownToCustomer;
  const isApproved = approval === "approved";
  const isDeclined = approval === "declined";

  // Left tags: fail/caution status badge, plus an infrequent grey qualifier tag (ACV, Traxtion, Previously Declined)
  const leftTags = [];
  if (stat) leftTags.push(
    <span key="status" style={{
      display: "inline-flex", alignItems: "center",
      fontSize: 11, fontWeight: 700, padding: "1px 7px", borderRadius: 4,
      letterSpacing: "0.04em", textTransform: "uppercase",
      background: stat.pillBg,
      color: stat.pillC,
      border: stat.pillBorder,
    }}>{stat.label}</span>
  );
  if (rec.extraTag) leftTags.push(
    <span key="extra" style={{
      display: "inline-flex", alignItems: "center",
      fontSize: 14, fontWeight: 500, padding: "1px 7px", borderRadius: 4,
      background: "var(--bg-white)", color: "var(--t-3)", border: "1px solid var(--b-2)",
    }}>{rec.extraTag}</span>
  );

  // Work status label for compact row — driven by workTag only
  const recWorkStatus = (() => {
    if (!rec.workTag) return null;
    const { tone, label } = rec.workTag;
    if (tone === "done" || tone === "complete") return { label: label || "Done", mt: 2, icon: <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--green-700)" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg> };
    if (tone === "gray" || !label) return null;
    const dot = <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--blue-500)", display: "inline-block", flexShrink: 0 }} />;
    return { label, icon: dot };
  })();

  // Icons (compact: media, parts, internal note; no work icon — work status shown per-rec in its own column)
  const openSection = (section) => { onRecClick && onRecClick(rec, null, section); };
  const hasParts = (rec.partsList?.length > 0) || Number(rec.parts) > 0;
  const hasNote = !!rec.internal;
  const iconWrap = (key, active, el) => (
    <span key={key} style={{ display: "inline-flex", opacity: active ? 1 : 0.4 }}>{el}</span>
  );
  const rightTags = [
    iconWrap("media-icon",    hasMedia, <MediaTag media={rec.media} onAdd={openSection} />),
    iconWrap("parts-icon",    hasParts, <PartsTag parts={rec.partsList} amount={rec.parts} estStatus={rec.estStatus} onAdd={openSection} />),
    iconWrap("internal-icon", hasNote,  <InternalNoteTag note={rec.internal} onAdd={openSection} />),
  ];
  const expandedTags = [
    iconWrap("media-icon", hasMedia, <MediaTag media={rec.media} onAdd={openSection} />),
    iconWrap("parts-icon", hasParts, <PartsTag parts={rec.partsList} amount={rec.parts} estStatus={rec.estStatus} onAdd={openSection} />),
  ];

  const moreBtn = (
    <button onClick={(e) => { e.stopPropagation(); setExpanded(!expanded); }}
      style={{
        width: 30, height: 30, borderRadius: 8, flexShrink: 0,
        border: "1px solid var(--b-2)", background: "var(--bg-white)",
        color: "var(--t-3)", cursor: "pointer",
        display: "inline-flex", alignItems: "center", justifyContent: "center",
      }}
      onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; e.currentTarget.style.color = "var(--t-2)"; }}
      onMouseLeave={e => { e.currentTarget.style.background = "var(--bg-white)"; e.currentTarget.style.color = "var(--t-3)"; }}>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
        style={{ transform: expanded ? "rotate(180deg)" : "none", transition: "transform 120ms" }}>
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>
  );

  const isDiscounted = shownToCustomer === 0 && total > 0;
  const priceEl = total != null ? (
    <span style={{ fontSize: 14, fontWeight: 700, color: isDiscounted ? "var(--red-600)" : "var(--t-1)", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>
      ${Number(isDiscounted ? 0 : (shownToCustomer != null ? shownToCustomer : total)).toFixed(0)}
    </span>
  ) : null;
  // "Total" row — label + price on its own line below the approve/decline + chevron row,
  // instead of stacking the bare price under the chevron button.
  const totalRow = total != null && (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", width: "100%" }}>
      <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-3)" }}>Total</span>
      {priceEl}
    </div>
  );

  const mkBtn = (label, val) => {
    const active = approval === val;
    const isApprove = val === "approved";
    const activeColor   = isApprove ? "var(--green-700)" : "var(--red-600)";
    const activeBg      = isApprove ? "var(--green-50)"  : "var(--red-50)";
    const activeBorder  = isApprove ? "#BDD9BD"          : "#F0B6B6";
    const hoverColor    = isApprove ? "var(--green-700)" : "var(--red-600)";
    const hoverBg       = isApprove ? "var(--green-50)"  : "var(--red-50)";
    const hoverBorder   = isApprove ? "#BDD9BD"          : "#F0B6B6";
    return (
      <button onClick={e => { e.stopPropagation(); onApprovalChange && onApprovalChange(active ? null : val); }}
        title={isApprove ? "Approve" : "Decline"}
        className="rec-appdec-btn"
        style={{
          height: 30, padding: "0 4px", flex: 1, minWidth: 0,
          background: active ? activeBg : "transparent",
          border: `1px solid ${active ? activeBorder : "var(--b-2)"}`,
          borderRadius: isApprove ? "8px 0 0 8px" : "0 8px 8px 0",
          marginLeft: isApprove ? 0 : -1,
          position: "relative", zIndex: active ? 1 : 0,
          color: active ? activeColor : "var(--t-4)",
          cursor: "pointer",
          display: "inline-flex", alignItems: "center", justifyContent: "center",
          transition: "background 120ms, color 120ms, border-color 120ms",
          flexShrink: 0,
        }}
        onMouseEnter={e => { if (!active) { e.currentTarget.style.background = hoverBg; e.currentTarget.style.color = hoverColor; e.currentTarget.style.borderColor = hoverBorder; e.currentTarget.style.zIndex = "1"; } }}
        onMouseLeave={e => { if (!active) { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--t-4)"; e.currentTarget.style.borderColor = "var(--b-2)"; e.currentTarget.style.zIndex = active ? "1" : "0"; } }}
      >
        {isApprove
          ? <><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><polyline points="20 6 9 17 4 12"/></svg><span className="rec-appdec-label" style={{ fontSize: 11, fontWeight: 600 }}>Approve</span></>
          : <><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span className="rec-appdec-label" style={{ fontSize: 11, fontWeight: 600 }}>Decline</span></>
        }
      </button>
    );
  };


  // ── Expanded: full 3-column layout ──
  if (isExpanded) {
    return (
      <div key="expanded" style={{ borderTop: isFirst ? "none" : "1px solid var(--b-2)", display: "flex", alignItems: "stretch", minHeight: 72, background: "var(--bg-white)", paddingRight: 8, cursor: onRecClick ? "pointer" : "default" }}
        onClick={(e) => { e.stopPropagation(); onRecClick && onRecClick(rec, concernId); }}
        onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; }}
        onMouseLeave={e => { e.currentTarget.style.background = "var(--bg-white)"; }}>
        {/* Rec text — status badge inline with the recommendation, wraps underneath if it doesn't fit */}
        <div style={{ flex: 1, minWidth: 220, display: "flex", flexDirection: "column", justifyContent: "flex-start", padding: "10px 14px 10px 0" }}>
          <div style={{ fontSize: 14, lineHeight: 1.5, wordBreak: "break-word" }}>
            {leftTags.map((tag, i) => React.cloneElement(tag, { key: tag.key || i, style: { ...tag.props.style, display: "inline-block", verticalAlign: "middle", marginRight: 5 } }))}<span style={{ color: rec.recommendation ? "var(--t-1)" : "var(--t-5)", verticalAlign: "middle" }}>{rec.recommendation || "No recommendation added"}</span>
          </div>

          {rec.internal && (
            <div style={{ marginTop: 8, padding: "8px 10px", borderRadius: 6, background: "#FFFBEB", border: "1px solid #F3DDA1" }}>
              <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: "0.08em", textTransform: "uppercase", color: "#B45309", marginBottom: 3 }}>Internal parts notes</div>
              <div style={{ fontSize: 14, color: "var(--t-2)", lineHeight: 1.4 }}>{rec.internal}</div>
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "18px 18px", gap: 8, flexShrink: 0, width: 44, marginTop: 8 }} onClick={e => e.stopPropagation()}>{expandedTags}</div>

        </div>

        {/* REC ESTIMATE */}
        <div style={{ width: 240, flexShrink: 0, borderLeft: "1px solid var(--b-2)", padding: "10px 14px 12px" }}>
          {(() => {
            // "requested" tone (labor/parts already sent out for pricing, e.g. to a vendor) is
            // distinct from "incomplete" (nothing done yet): calmer blue clock icon instead of
            // the amber warning triangle, and its own "Requested" text instead of "Incomplete ...".
            const laborStatus = rec.estStatus?.find(s => s.label?.toLowerCase().includes("labor"));
            const partsStatus = rec.estStatus?.find(s => s.label?.toLowerCase().includes("parts"));
            const laborRequested = laborStatus?.tone === "requested";
            const partsRequested = partsStatus?.tone === "requested";
            return [
              rec.estSummary ? ["Hours", rec.estSummary, true, "No input", null] : null,
              ["Labor",      rec.labor  != null ? `$${Number(rec.labor).toFixed(2)}`  : null, false, laborRequested ? "Requested" : "Missing Labor", laborRequested ? "requested" : "incomplete"],
              ["Parts",      rec.parts  != null ? `$${Number(rec.parts).toFixed(2)}`  : null, false, partsRequested ? "Requested" : "Missing Parts", partsRequested ? "requested" : "incomplete"],
              ["Misc Fees",  rec.misc   != null ? `$${Number(rec.misc).toFixed(2)}`   : null, false, "No input", null],
              ["Taxes on P + L + Misc", null, false, "No input", null],
            ];
          })().filter(Boolean).map(([label, val, bold, emptyLabel, alertTone]) => {
            const alertColor = alertTone === "requested" ? "var(--blue-600)" : "var(--red-600)";
            return (
            <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 3 }}>
              <span style={{ fontSize: 14, color: "var(--t-3)" }}>{label}</span>
              <span style={{ fontSize: 14, fontWeight: (bold || alertTone === "incomplete") ? 700 : 400, color: val ? "var(--t-2)" : (alertTone ? alertColor : "var(--t-5)"), fontVariantNumeric: "tabular-nums", display: "inline-flex", alignItems: "center", gap: 4 }}>
                {!val && alertTone === "incomplete" && (
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--red-600)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <path d="M12 9v4"/><path d="M12 17h.01"/>
                  </svg>
                )}
                {!val && alertTone === "requested" && (
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--blue-600)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <polyline points="12 7 12 12 16 14" />
                  </svg>
                )}
                {val || emptyLabel}
              </span>
            </div>
            );
          })}
          <div style={{ height: 1, background: "var(--b-1)", margin: "6px 0" }} />
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: "var(--t-2)" }}>Total (w/ tax + misc)</span>
            <span style={{ fontSize: 12, fontWeight: 700, color: "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>${rec.total != null ? Number(rec.total).toFixed(2) : "0.00"}</span>
          </div>
          {rec.shownToCustomer === 0 && (
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 8px", borderRadius: 5, border: "1px solid #F0B6B6", background: "var(--red-50)" }}>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--red-600)" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <span style={{ fontSize: 14, fontWeight: 600, color: "var(--red-600)" }}>Customer sees $0</span>
            </span>
          )}
        </div>

        {/* Right column */}
        <div style={{ width: 260, flexShrink: 0, borderLeft: "1px solid var(--b-2)", alignSelf: "stretch", paddingTop: 12, paddingBottom: 10, display: "flex", flexDirection: "column", alignItems: "stretch", gap: 10 }}>
          {/* APPROVAL row — labeled like the WORK/PARTS rows below it, with the Approve/Decline
              buttons pushed flush to the right edge instead of showing the price inline (the
              REC ESTIMATE column to the left still shows the full "Total (w/ tax + misc)"
              breakdown, so the price isn't repeated here). Same layout in both phases now — no
              separate collapse chevron or standalone Total row here; to re-collapse an expanded
              row in phase 2, use the row's own compact view via the master EXPAND toggle. */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", paddingLeft: 10, paddingRight: 10 }} onClick={e => e.stopPropagation()}>
            <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-3)", width: 48, flexShrink: 0 }}>Approval</span>
            <div style={{ display: "flex", width: 172, flexShrink: 0 }}>
              {mkBtn("✓", "approved")}
              {mkBtn("✗", "declined")}
            </div>
          </div>
          {/* Divider */}
          <div style={{ height: 1, background: "var(--b-1)", marginLeft: 10, marginRight: 6 }} />
          {/* WORK row */}
          <div style={{ display: "flex", alignItems: "center", paddingLeft: 10, paddingRight: 6 }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-3)", width: 48, flexShrink: 0 }}>Work</span>
            {(() => {
              const wsColors = {
                "—":                 { bg: "var(--bg-white)",  color: "var(--t-4)",        border: "var(--b-2)" },
                "Need parts pulled": { bg: "var(--bg-white)",  color: "var(--t-3)",        border: "var(--b-2)" },
                "In Progress":       { bg: "var(--bg-white)",  color: "var(--t-3)",        border: "var(--b-2)" },
                "Done":              { bg: "var(--green-50)",  color: "var(--green-700)",  border: "#BDD9BD" },
              };
              const wc = wsColors[workStatus] || wsColors["—"];
              return (
                <div style={{ position: "relative", flex: 1, minWidth: 0 }}>
                  <select
                    className="select"
                    value={workStatus}
                    onChange={(e) => setWorkStatus(e.target.value)}
                    onClick={(e) => e.stopPropagation()}
                    style={{
                      width: "100%", height: 28, fontSize: 14, padding: "0 24px 0 8px",
                      color: wc.color, borderColor: wc.border, background: wc.bg,
                      appearance: "none", WebkitAppearance: "none", MozAppearance: "none",
                    }}
                  >
                    <option value="—" style={{ background: "var(--bg-white)", color: "var(--t-2)" }}>—</option>
                    <option value="Need parts pulled" style={{ background: "var(--bg-white)", color: "var(--t-2)" }}>Need parts pulled</option>
                    <option value="In Progress" style={{ background: "var(--bg-cream-soft)", color: "var(--t-3)" }}>In Progress</option>
                    <option value="Done" style={{ background: "var(--green-50)", color: "var(--green-700)" }}>Done</option>
                  </select>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={wc.color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"
                    style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }}>
                    <polyline points="6 9 12 15 18 9" />
                  </svg>
                </div>
              );
            })()}
          </div>
          {/* PARTS row */}
          <div style={{ display: "flex", alignItems: "center", paddingLeft: 10, paddingRight: 6 }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-3)", width: 48, flexShrink: 0 }}>Parts</span>
            {rec.partsTag ? (() => {
              const tone = rec.partsTag.tone;
              const bg     = tone === "stock" ? "var(--green-50)" : tone === "out-of-stock" ? "var(--red-50)" : "var(--yellow-25)";
              const color  = tone === "stock" ? "var(--green-700)" : tone === "out-of-stock" ? "var(--red-600)" : "var(--yellow-700)";
              const border = tone === "stock" ? "#BDD9BD" : tone === "out-of-stock" ? "#F0B6B6" : "#F3DDA1";
              return (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 14, fontWeight: 700, padding: "1px 6px", borderRadius: 4, background: bg, color, border: `1px solid ${border}` }}>
                  {rec.partsTag.label}
                </span>
              );
            })() : (
              <span style={{ fontSize: 14, color: "var(--t-4)" }}>Not set</span>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ── Compact row ──
  return (
    <div key="compact" style={{ borderTop: isFirst ? "none" : "1px solid var(--b-2)", display: "flex", alignItems: "flex-start", minHeight: 52, background: "var(--bg-white)", paddingRight: 8, userSelect: "none" }}
      onClick={(e) => { e.stopPropagation(); onRecClick && onRecClick(rec, concernId); }}
      onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; }}
      onMouseLeave={e => { e.currentTarget.style.background = "var(--bg-white)"; }}
    >
      {/* Rec text + icons inline */}
      <div style={{ flex: 1, minWidth: 220, padding: "10px 12px 14px 0", display: "flex", alignItems: "flex-start", gap: 10 }}>
        <div style={{ flex: 1, minWidth: 220 }}>
          <div style={{ fontSize: 14, lineHeight: 1.5, wordBreak: "break-word" }}>
            {leftTags.map((tag, i) => React.cloneElement(tag, { key: tag.key || i, style: { ...tag.props.style, display: "inline-block", verticalAlign: "middle", marginRight: 5 } }))}<span style={{ color: rec.recommendation ? "var(--t-1)" : "var(--t-5)", verticalAlign: "middle" }}>{rec.recommendation || "No recommendation added"}</span>
          </div>
          {/* Hours/Labor/Parts/Misc summary line — same format as the Edit MPI tab's compact rec row */}
          {rec.total != null && (
            <div style={{ marginTop: 3, fontSize: 14, color: "var(--t-3)", lineHeight: 1.3 }}>
              {(() => { const m = rec.estSummary && rec.estSummary.match(/^(\d+\.?\d*)\s*hrs?/i); return (m ? m[1] : "0") + " hrs · "; })()}{rec.labor == null ? <span style={{ color: "var(--red-600)", fontWeight: 400 }}>Missing Labor</span> : `Labor $${Number(rec.labor).toFixed(0)}`} · {rec.parts == null ? <span style={{ color: "var(--red-600)", fontWeight: 400 }}>Missing Parts</span> : `Parts $${Number(rec.parts).toFixed(0)}`}
              {Number(rec.misc || 0) > 0 && ` · Misc $${Number(rec.misc).toFixed(0)}`}
            </div>
          )}
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "18px 18px 18px", gap: 8, flexShrink: 0, width: 70, paddingTop: 2 }} onClick={e => e.stopPropagation()}>{rightTags}</div>
      </div>
      {/* Work status label column */}
      <div style={{ width: 130, flexShrink: 0, alignSelf: "stretch", display: "flex", alignItems: "flex-start", justifyContent: "flex-start", paddingLeft: 12, paddingRight: 4, paddingTop: 12 }}>
        {recWorkStatus && (
          <div title={recWorkStatus.label} style={{ display: "flex", alignItems: "flex-start", gap: 4, fontSize: 14, fontWeight: 600, color: "var(--t-4)", cursor: "default", minWidth: 0, width: "100%" }}>
            <span style={{ flexShrink: 0, lineHeight: 0, marginTop: recWorkStatus.mt ?? 5 }}>{recWorkStatus.icon}</span>
            <span style={{ display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden", lineHeight: 1.5 }}>{recWorkStatus.label}</span>
          </div>
        )}
      </div>
      {/* Right column: approve+decline row (top-aligned with chevron), Total row below.
          Only reachable in phase 2 now — phase 1 always renders the expanded branch above. */}
      <div style={{ width: 260, flexShrink: 0, alignSelf: "stretch", display: "flex", flexDirection: "column", gap: 8, paddingLeft: 10, paddingRight: 10, paddingTop: 12, paddingBottom: 12, borderLeft: "1px solid var(--b-2)" }}
        onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-3)", width: 48, flexShrink: 0 }}>Approval</span>
          <div style={{ display: "flex", width: 172, flexShrink: 0 }}>
            {mkBtn("✓", "approved")}
            {mkBtn("✗", "declined")}
          </div>
        </div>
      </div>
    </div>
  );
}

const RecCompactConcernCard = ({ concern, letter, reorderable, onReorderConcern, onConcernDragStart, onConcernDragEnd, dragging, reorderRec, recDrag, setRecDrag, concerns, moveRec, moveRecToNew, onRecClick, selectedRecs = new Set(), onToggleRec, onTitleChange, onAddRec, autoRename }) => {
  const p = concernPalette[concern.type] || concernPalette.asc_m;
  const concernTotal = concern.recs.reduce((s, r) => s + (r.total || 0), 0);
  const shownTotal = concern.recs.reduce((s, r) => s + (r.shownToCustomer != null ? r.shownToCustomer : (r.total || 0)), 0);
  const hasZeroShown = concern.recs.some((r) => r.shownToCustomer === 0 && r.total > 0);
  const _npLabor = concern.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("labor")));
  const _npParts = concern.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("parts")));
  const needsPricing = _npLabor && _npParts ? "Labor, Parts" : _npLabor ? "Labor" : _npParts ? "Parts" : null;
  const hasRecs = concern.recs.length > 0;
  return (
    <div
      data-concern-drop={concern.id}
      {...(reorderable ? { "data-concern-reorderable": "1" } : {})}
      style={{
        marginBottom: 8,
        border: "1px solid var(--b-2)",
        borderLeft: concern.type === "occ" ? "3px solid var(--blue-600)" : "1px solid var(--b-2)",
        borderRadius: 8,
        background: "var(--bg-white)", overflow: "hidden",
        opacity: dragging ? 0.4 : 1, transition: "opacity 140ms",
        position: "relative",
      }}>
      <ConcernCardHeader
        concern={concern}
        palette={p}
        letter={letter}
        reorderable={reorderable}
        onReorder={onReorderConcern}
        onDragStart={onConcernDragStart}
        onDragEnd={onConcernDragEnd}
        onTitleChange={onTitleChange}
        onAddRec={onAddRec}
        total={concernTotal}
        shownTotal={shownTotal}
        hasZeroShown={hasZeroShown}
        showTotal={true}
        autoRename={autoRename}
        noLeftBorder={true}
        style={{ borderBottom: hasRecs ? "1px solid var(--b-2)" : "none" }}
        breakdown={(() => {
          const labor = concern.recs.reduce((s, r) => s + Number(r.labor || 0), 0);
          const parts = concern.recs.reduce((s, r) => s + Number(r.parts || 0), 0);
          const misc  = concern.recs.reduce((s, r) => s + Number(r.misc  || 0), 0);
          const hrs   = concern.recs.reduce((s, r) => { const m = r.estSummary && r.estSummary.match(/^(\d+\.?\d*)\s*hrs?/i); return s + (m ? Number(m[1]) : 0); }, 0);
          return { labor, parts, misc, hrs: hrs > 0 ? String(hrs) : null };
        })()}
        needsPricing={needsPricing}
      />
      {concern.recs.map((rec, i) => {
        const isLast = i === concern.recs.length - 1;
        const mediaData = rec.media && typeof rec.media === "object" ? rec.media : null;
        const recStatus = rec.status && typeof rec.status === "string" ? { kind: rec.status } : rec.status;
        // Separate badges from price so price can go in a fixed column matching the header
        const badgeTags = [
          mediaData && <MediaTag key="m" media={mediaData} />,
          (rec.partsList?.length || Number(rec.parts) > 0) && <PartsTag key="pt" parts={rec.partsList} amount={rec.parts} />,
          recStatus && <RecStatusBadge key="s" status={recStatus} />,
        ].filter(Boolean);
        const priceEl = rec.total != null
          ? (rec.shownToCustomer === 0 && rec.total > 0
              ? <span style={{ display: "inline-flex", alignItems: "baseline", gap: 5, whiteSpace: "nowrap" }}>
                  <span style={{ fontSize: 13, fontWeight: 400, color: "var(--t-4)", textDecoration: "line-through" }}>${Number(rec.total).toFixed(0)}</span>
                  <span style={{ fontSize: 14, fontWeight: 400, color: "var(--red-600)", lineHeight: 1.1 }}>$0</span>
                </span>
              : <span style={{ fontSize: 14, fontWeight: 400, color: "var(--t-1)", lineHeight: 1.1, whiteSpace: "nowrap" }}>${Number(rec.total).toFixed(0)}</span>
            )
          : null;
        return (
          <div
            key={rec.id}
            data-rec-drop={rec.id}
            data-rec-concern={concern.id}
            style={{
              display: "flex", alignItems: "stretch",
              borderBottom: isLast ? "none" : "1px solid var(--b-2)",
              borderRadius: isLast ? "0 0 7px 7px" : 0,
              background: "var(--bg-white)",
              opacity: recDrag === rec.id ? 0.4 : 1, transition: "opacity 140ms",
              cursor: onRecClick ? "pointer" : "default",
            }}
            onClick={onRecClick ? (e) => { e.stopPropagation(); onRecClick(rec, concern.id); } : undefined}
            onMouseEnter={onRecClick ? (e) => { e.currentTarget.style.background = "var(--bg-cream)"; } : undefined}
            onMouseLeave={onRecClick ? (e) => { e.currentTarget.style.background = ""; } : undefined}
          >
            {/* Checkbox */}
            <div style={{ width: 34, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={(e) => e.stopPropagation()}>
              <input type="checkbox" className="checkbox" checked={selectedRecs.has(rec.id)} onChange={(e) => { e.stopPropagation(); onToggleRec && onToggleRec(rec.id); }} style={{ width: 15, height: 15 }} />
            </div>

            {/* Text + badges — flex:1, padding sets row height */}
            <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 8, padding: "9px 0 9px 10px" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, lineHeight: 1.5, wordBreak: "break-word" }}>{recStatus && <span style={{ display: "inline-block", verticalAlign: "middle", marginRight: 5, padding: "1px 7px", background: "var(--bg-white)", color: (typeof recStatus === "string" ? recStatus : recStatus?.kind) === "fail" ? "var(--red-600)" : "var(--yellow-700)", border: "1px solid " + ((typeof recStatus === "string" ? recStatus : recStatus?.kind) === "fail" ? "#F0B6B6" : "#D4A900"), borderRadius: 4, fontSize: 11, fontWeight: 700, letterSpacing: 0.06, textTransform: "uppercase", whiteSpace: "nowrap" }}>{(typeof recStatus === "string" ? recStatus : recStatus?.kind) === "fail" ? "Fail" : "Caution"}</span>}<span style={{ color: rec.recommendation ? "var(--t-1)" : "var(--t-5)" }}>{rec.recommendation || "No recommendation added"}</span></div>

              </div>
              {(() => {
                const iconTags = [
                  mediaData && React.createElement(MediaTag, { key: "m", media: mediaData }),
                  (rec.partsList?.length || Number(rec.parts) > 0) && React.createElement(PartsTag, { key: "pt", parts: rec.partsList, amount: rec.parts }),
                ].filter(Boolean);
                return iconTags.length > 0 ? (
                  <div style={{ flexShrink: 0, display: "flex", alignItems: "center", gap: 8 }}>
                    {iconTags}
                  </div>
                ) : null;
              })()}
            </div>
            {/* Price — 76px fixed column, aligns with header price */}

              {priceEl}
            </div>
            {/* Summary column — hrs / labor / parts / misc */}
            {(() => {
              const hrs = (() => { const m = rec.estSummary && rec.estSummary.match(/^(\d+\.?\d*)\s*hrs?/i); return m ? m[1] : null; })();
              const laborMissing = rec.labor == null;
              const partsMissing = rec.parts == null;
              const labor = Number(rec.labor || 0);
              const parts = Number(rec.parts || 0);
              const misc  = Number(rec.misc  || 0);
              const hasAny = hrs || labor > 0 || parts > 0 || misc > 0 || laborMissing || partsMissing;
              if (!hasAny) return <div style={{ width: 148, flexShrink: 0 }} />;
              return (
                <div style={{ width: (laborMissing || partsMissing) ? undefined : 148, flexShrink: 0, display: "flex", alignItems: "center", paddingLeft: 12, gap: 12, fontVariantNumeric: "tabular-nums" }}>
                  {hrs && <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <span style={{ fontSize: 14, color: "var(--t-4)", fontWeight: 500 }}>hrs</span>
                    <span style={{ fontSize: 14, color: "var(--t-2)", fontWeight: 600 }}>{hrs}</span>
                  </div>}
                  {laborMissing ? (
                    <span style={{ fontSize: 14, color: "var(--red-600)", fontWeight: 400, whiteSpace: "nowrap" }}>Missing Labor</span>
                  ) : labor > 0 && <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <span style={{ fontSize: 14, color: "var(--t-4)", fontWeight: 500 }}>Labor</span>
                    <span style={{ fontSize: 12.5, color: "var(--t-2)", fontWeight: 600 }}>${labor.toFixed(0)}</span>
                  </div>}
                  {partsMissing ? (
                    <span style={{ fontSize: 14, color: "var(--red-600)", fontWeight: 400, whiteSpace: "nowrap" }}>Missing Parts</span>
                  ) : parts > 0 && <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <span style={{ fontSize: 14, color: "var(--t-4)", fontWeight: 500 }}>Parts</span>
                    <span style={{ fontSize: 12.5, color: "var(--t-2)", fontWeight: 600 }}>${parts.toFixed(0)}</span>
                  </div>}
                  {misc > 0 && <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                    <span style={{ fontSize: 14, color: "var(--t-4)", fontWeight: 500 }}>Misc</span>
                    <span style={{ fontSize: 12.5, color: "var(--t-2)", fontWeight: 600 }}>${misc.toFixed(0)}</span>
                  </div>}
                </div>
              );
            })()}
            {/* 84px spacer matches header action column width — use positioned divider, not borderLeft, to avoid box-model width shift */}
            <div style={{ width: 84, flexShrink: 0, position: "relative" }}>
              <span style={{ position: "absolute", left: 0, top: "50%", transform: "translateY(-50%)", width: 1, height: "60%", background: "var(--b-2)" }} />
            </div>
          </div>
        );
      })}
    </div>
  );
};

// ── A concern card — MPI-style colored header + a list of recommendation rows.
const RecConcernCard = ({ concern, letter, reorderable, onReorderConcern, onConcernDragStart, onConcernDragEnd, dragging, reorderRec, recDrag, setRecDrag, concerns, moveRec, moveRecToNew, onRecClick, selectedRecs = new Set(), onToggleRec, onToggleConcernRecs, onTitleChange, onAddRec, autoRename, recApprovals, onApprovalChange, compact = true, isFirst = false, phase = 1 }) => {
  // Tracks which rec row (if any) the currently-dragged rec is hovering over, and
  const p = concernPalette[concern.type] || concernPalette.asc_m;
  const concernTotal = concern.recs.reduce((s, r) => s + (r.total || 0), 0);
  const paAmt = concern.preApproved ? ((concern.preApproved.labor || 0) + (concern.preApproved.parts || 0) + (concern.preApproved.misc || 0)) : 0;
  const displayTotal = concernTotal + paAmt;
  const shownTotal = concern.recs.reduce((s, r) => s + (r.shownToCustomer != null ? r.shownToCustomer : (r.total || 0)), 0) + paAmt;
  const hasZeroShown = concern.recs.some((r) => r.shownToCustomer === 0 && r.total > 0);
  const _npLabor = concern.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("labor")));
  const _npParts = concern.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("parts")));
  const needsPricing = _npLabor && _npParts ? "Labor, Parts" : _npLabor ? "Labor" : _npParts ? "Parts" : null;
  // (per-concern checkbox removed — select-all is in section header)
  const preApprovedEl = (concern.type === "occ" && concern.preApproved)
    ? <PreApprovedPill pa={concern.preApproved} concernId={concern.id} concernTitle={concern.title} onRecClick={onRecClick} />
    : null;
  return (
    <div
      data-concern-drop={concern.id}
      {...(reorderable ? { "data-concern-reorderable": "1" } : {})}
      style={{
        border: "1px solid var(--b-2)",
        borderLeft: concern.type === "occ" ? "3px solid var(--blue-600)" : "1px solid var(--b-2)",
        borderRadius: 8,
        background: "var(--bg-white)",
        overflow: "hidden",
        boxShadow: "var(--shadow-card)", marginBottom: 8, marginLeft: 0,
        opacity: dragging ? 0.4 : 1, transition: "opacity 140ms, box-shadow 140ms",
        position: "relative",
      }}>

      <ConcernCardHeader
        concern={concern}
        palette={p}
        letter={letter}
        reorderable={reorderable}
        onReorder={onReorderConcern}
        onDragStart={onConcernDragStart}
        onDragEnd={onConcernDragEnd}
        onTitleChange={onTitleChange}
        onAddRec={onAddRec}
        hasZeroShown={hasZeroShown}
        showTotal={concern.recs.length > 0}
        autoRename={autoRename}
        noLeftBorder={true}
        preApproved={concern.preApproved || null}
        recApprovals={recApprovals}
        recTabLayout={true}
        preApprovedEl={preApprovedEl}
        preApprovedTotal={paAmt}
        total={displayTotal}
        shownTotal={shownTotal}
        style={{ borderBottom: "1px solid var(--b-2)", borderRadius: compact ? 0 : "7px 7px 0 0" }}
        breakdown={(() => {
          const labor = concern.recs.reduce((s, r) => s + Number(r.labor || 0), 0) + (concern.preApproved?.labor || 0);
          const parts = concern.recs.reduce((s, r) => s + Number(r.parts || 0), 0) + (concern.preApproved?.parts || 0);
          const misc  = concern.recs.reduce((s, r) => s + Number(r.misc  || 0), 0) + (concern.preApproved?.misc  || 0);
          const hrs   = concern.recs.reduce((s, r) => { const m = r.estSummary && r.estSummary.match(/^(\d+\.?\d*)\s*hrs?/i); return s + (m ? Number(m[1]) : 0); }, 0);
          return { labor, parts, misc, hrs: hrs > 0 ? String(hrs) : null };
        })()}
        needsPricing={needsPricing}
      />



      {concern.recs.map((rec, i) => {
        return (
        <div key={rec.id}
          data-rec-drop={rec.id}
          data-rec-concern={concern.id}
          style={{
            display: "flex", alignItems: "stretch",
            opacity: recDrag === rec.id ? 0.4 : 1,
            transition: "opacity 140ms",
            cursor: onRecClick ? "pointer" : "default",
          }}
          onClick={() => onRecClick && onRecClick(rec, concern.id)}
        >
          {/* Checkbox + drag handle — left edge, top-aligned, small gap between them */}
          <div style={{ display: "flex", alignItems: "flex-start", gap: 4, paddingLeft: 8, paddingRight: phase === 2 ? 4 : 14, paddingTop: 12, flexShrink: 0, borderTop: i === 0 ? "none" : "1px solid var(--b-2)", background: "var(--bg-white)" }}>
            <div style={{ width: 15, flexShrink: 0, display: "flex", alignItems: "flex-start", justifyContent: "center" }}
              onClick={(e) => e.stopPropagation()}>
              <input type="checkbox" className="checkbox" checked={selectedRecs.has(rec.id)} onChange={() => onToggleRec && onToggleRec(rec.id)} style={{ width: 15, height: 15 }} />
            </div>
            {phase === 2 && (
              <div
                style={{ width: 24, flexShrink: 0, display: "flex", alignItems: "flex-start", justifyContent: "center" }}
                onClick={(e) => e.stopPropagation()}
              >
                <RecMoveMenu
                  concerns={concerns || []}
                  currentConcernId={concern.id}
                  selfRecId={rec.id}
                  onSelect={(toId) => moveRec && moveRec(rec.id, concern.id, toId)}
                  onCreateNew={moveRecToNew ? () => moveRecToNew(rec.id, concern.id) : undefined}
                  onDropAtRec={(toConcernId, targetRecId, before) => {
                    if (toConcernId === concern.id) reorderRec(concern.id, rec.id, targetRecId, before);
                    else moveRec && moveRec(rec.id, concern.id, toConcernId, targetRecId, before);
                  }}
                  onDragStart={() => setRecDrag(rec.id)}
                  onDragEnd={() => setRecDrag(null)}
                />
              </div>
            )}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <RecRecRow
              rec={rec}
              concernId={concern.id}
              isFirst={i === 0}
              isLast={i === concern.recs.length - 1}
              recDraggable={true}
              concerns={concerns}
              onMoveRecTo={(recId, toId) => moveRec && moveRec(recId, concern.id, toId)}
              onMoveRecRelative={(recId, toConcernId, targetRecId, before) => moveRec && moveRec(recId, concern.id, toConcernId, targetRecId, before)}
              onMoveRecToNew={moveRecToNew ? (recId) => moveRecToNew(recId, concern.id) : undefined}
              onReorderRec={(dragRecId, targetRecId, before) => reorderRec(concern.id, dragRecId, targetRecId, before)}
              onDragStartRec={() => setRecDrag(rec.id)}
              onDragEndRec={() => setRecDrag(null)}
              dragging={recDrag === rec.id}
              onRecClick={onRecClick}
              onMoveUp={i > 0 ? () => reorderRec(concern.id, rec.id, concern.recs[i - 1].id, true) : null}
              onMoveDown={i < concern.recs.length - 1 ? () => reorderRec(concern.id, rec.id, concern.recs[i + 1].id, false) : null}
              approval={recApprovals ? recApprovals.get(rec.id) ?? null : null}
              onApprovalChange={onApprovalChange ? (val) => onApprovalChange(rec.id, val) : undefined}
              defaultExpanded={!compact}
              compact={compact}
              phase={phase}
            />
          </div>
        </div>
        );
      })}
      {/* Concern subtotal when some (not all) recs are selected */}
      {(() => {
        if (!selectedRecs || selectedRecs.size === 0) return null;
        const concernRecIds = concern.recs.map(r => r.id);
        const selectedInConcern = concernRecIds.filter(id => selectedRecs.has(id));
        if (selectedInConcern.length === 0 || selectedInConcern.length === concernRecIds.length) return null;
        const subtotal = concern.recs.filter(r => selectedRecs.has(r.id)).reduce((s, r) => s + (r.total || 0), 0);
        return (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 10, padding: "6px 14px", borderTop: "1px solid var(--b-1)", background: "var(--blue-25)" }}>
            <span style={{ fontSize: 14, color: "var(--blue-700)", fontWeight: 600 }}>{selectedInConcern.length} of {concernRecIds.length} selected · subtotal</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "var(--blue-700)", fontVariantNumeric: "tabular-nums" }}>${subtotal.toFixed(0)}</span>
          </div>
        );
      })()}
    </div>
  );
};

const RecCalcFooter = ({ selectedTotal = 0, recommendedTotal = 0, declinedTotal = 0, approvedTotal = 0, selectedCount = 0 }) => {
  const [open, setOpen] = React.useState(false);
  const fmt = (n) => n > 0 ? `$${n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}` : "–";
  const calcGrid = "minmax(150px,1fr) 120px 120px 120px 120px";
  // Shop fees + tax aren't tracked elsewhere yet — approximate with a small capped fee and a flat
  // tax rate on (Labor+Parts+Misc + Shop Fees) so the expanded breakdown has a plausible number in
  // every row instead of leaving them blank.
  const SHOP_FEE_CAP = 25;
  const SHOP_FEE_PCT = 0.02;
  const TAX_RATE = 0.04;
  const shopFee = (t) => (t > 0 ? Math.min(t * SHOP_FEE_PCT, SHOP_FEE_CAP) : 0);
  const tax = (t, fee) => (t > 0 ? (t + fee) * TAX_RATE : 0);
  const selFee = shopFee(selectedTotal), recFee = shopFee(recommendedTotal), decFee = shopFee(declinedTotal), appFee = shopFee(approvedTotal);
  const selTax = tax(selectedTotal, selFee), recTax = tax(recommendedTotal, recFee), decTax = tax(declinedTotal, decFee), appTax = tax(approvedTotal, appFee);
  const dynamicRows = [
    { label: "Preapproved", selected: "–", recommended: "–", declined: "–", approved: "–" },
    { label: "Labor + Parts + Misc", selected: selectedCount > 0 ? fmt(selectedTotal) : "–", recommended: fmt(recommendedTotal), declined: fmt(declinedTotal), approved: fmt(approvedTotal) },
    { label: "Shop Fees - Max $", selected: selectedCount > 0 ? fmt(selFee) : "–", recommended: fmt(recFee), declined: fmt(decFee), approved: fmt(appFee) },
    { label: "Tax", selected: selectedCount > 0 ? fmt(selTax) : "–", recommended: fmt(recTax), declined: fmt(decTax), approved: fmt(appTax) },
    { label: "Total", selected: selectedCount > 0 ? fmt(selectedTotal + selFee + selTax) : "–", recommended: fmt(recommendedTotal + recFee + recTax), declined: fmt(declinedTotal + decFee + decTax), approved: fmt(approvedTotal + appFee + appTax), strong: true },
  ];
  const rows = open ? dynamicRows : dynamicRows.filter(r => r.strong);
  return (
    <div style={{ position: "fixed", bottom: 52, left: 0, right: 0, zIndex: 41, background: "var(--bg-white)", borderTop: "1px solid var(--b-2)", boxShadow: "0 -6px 16px -8px rgba(16,24,40,0.18)", overflow: "hidden" }}>
      <div style={{ display: "grid", gridTemplateColumns: calcGrid, gap: 12, padding: "6px 18px", background: "var(--b-1)", alignItems: "center" }}>
        <button className="btn btn-secondary" onClick={() => setOpen(o => !o)} style={{ height: 26, padding: "0 10px", fontSize: 11.5, fontWeight: 700, letterSpacing: 0.05, gap: 6, justifySelf: "start" }}>
          {open ? <IconChevDown size={12} /> : <IconChevUp size={12} />}
          {open ? "Collapse" : "Expand"}
        </button>
        {["Selected Total $", "Recommended", "Declined", "Approved"].map((h) => (
          <span key={h} className="caps" style={{ textAlign: "right", fontSize: 14, fontWeight: 700, color: "var(--t-3)", letterSpacing: 0.05 }}>{h}</span>
        ))}
      </div>
      <div>
        {rows.map((r) => (
          <div key={r.label} style={{ display: "grid", gridTemplateColumns: calcGrid, gap: 12, padding: "8px 18px", alignItems: "center", borderTop: (open && r.strong) ? "1px solid var(--b-1)" : "none", background: r.strong ? "var(--bg-cream-soft)" : "transparent", ...REC_FONT }}>
            <span style={{ fontSize: 14, fontWeight: r.strong ? 700 : 500, color: "var(--t-2)" }}>{r.label}</span>
            {[r.selected, r.recommended, r.declined, r.approved].map((v, j) => (

            ))}
          </div>
        ))}
      </div>
    </div>
  );
};

const RecommendationView = ({ concerns, items: itemsProp, setItems: setItemsProp, sections, onPointStatusChange, onTireReading, onAddRec, onAddCustomRec, onRecClick, onExtractRec, phase = 1, showToast }) => {
  const [sectionsOpen, setSectionsOpen] = React.useState({ ocr: true, asc: true });
  const [localItems, localSetItems] = React.useState(initialRecConcerns);
  const items = itemsProp !== undefined ? itemsProp : localItems;
  const setItems = setItemsProp || localSetItems;
  const [concernDrag, setConcernDrag] = React.useState(null);
  const [recDrag, setRecDrag] = React.useState(null);
  // Undo toast for approve <-> decline (or reset) flips — lets the user recover from a misclick.
  const [approvalToast, setApprovalToast] = React.useState(null); // { recId, prevVal, label }
  const approvalToastTimer = React.useRef(null);
  const [compact, setCompact] = React.useState(false);
  const [selectedRecs, setSelectedRecs] = React.useState(new Set());
  const [activeFilter, setActiveFilter] = React.useState("all");

  // Approval state: Map<recId, 'approved'|'declined'|null>
  // Seed from estStatus on first render
  const [recApprovals, setRecApprovals] = React.useState(() => {
    const m = new Map();
    initialRecConcerns.forEach(c => c.recs.forEach(r => {
      const approved = r.estStatus?.some(s => s.tone === "approved");
      const declined = r.estStatus?.some(s => s.tone === "declined");
      if (approved) m.set(r.id, "approved");
      else if (declined) m.set(r.id, "declined");
    }));
    return m;
  });

  const onApprovalChange = React.useCallback((recId, val) => {
    setRecApprovals(prev => {
      const prevVal = prev.get(recId) ?? null;
      const next = new Map(prev);
      next.set(recId, val);
      // Only surface the undo toast when flipping an already-decided rec (approved <-> declined,
      // or resetting it back to awaiting) — not on the very first approve/decline click.
      if (prevVal != null && prevVal !== val) {
        const label = val === "approved" ? "Marked as Approved" : val === "declined" ? "Marked as Declined" : "Decision reset";
        if (approvalToastTimer.current) clearTimeout(approvalToastTimer.current);
        setApprovalToast({ recId, prevVal, label });
        approvalToastTimer.current = setTimeout(() => setApprovalToast(null), 5000);
      }
      return next;
    });
  }, []);

  const undoApprovalChange = () => {
    setApprovalToast((t) => {
      if (!t) return null;
      setRecApprovals(prev => { const next = new Map(prev); next.set(t.recId, t.prevVal); return next; });
      if (approvalToastTimer.current) { clearTimeout(approvalToastTimer.current); approvalToastTimer.current = null; }
      return null;
    });
  };

  const allRecIds = React.useMemo(() => items.flatMap(c => c.recs.map(r => r.id)), [items]);
  const totalCount = allRecIds.length;
  const selectedCount = selectedRecs.size;

  const onToggleRec = React.useCallback((recId) => {
    setSelectedRecs(prev => {
      const next = new Set(prev);
      if (next.has(recId)) next.delete(recId); else next.add(recId);
      return next;
    });
  }, []);

  const onSelectAll = () => {
    setSelectedRecs(selectedCount === totalCount ? new Set() : new Set(allRecIds));
  };

  const onBulkApprove = () => {
    setRecApprovals(prev => { const next = new Map(prev); selectedRecs.forEach(id => next.set(id, "approved")); return next; });
    setSelectedRecs(new Set());
  };
  const onBulkDecline = () => {
    setRecApprovals(prev => { const next = new Map(prev); selectedRecs.forEach(id => next.set(id, "declined")); return next; });
    setSelectedRecs(new Set());
  };
  const onBulkReset = () => {
    setRecApprovals(prev => { const next = new Map(prev); selectedRecs.forEach(id => next.set(id, null)); return next; });
    setSelectedRecs(new Set());
  };
  const onBulkDelete = () => {
    setItems(prev => prev.map(concern => ({
      ...concern,
      recs: concern.recs.filter(r => !selectedRecs.has(r.id)),
    })));
    setRecApprovals(prev => { const next = new Map(prev); selectedRecs.forEach(id => next.delete(id)); return next; });
    setSelectedRecs(new Set());
  };

  // Filter counts
  const filterCounts = React.useMemo(() => {
    const counts = { all: 0, awaiting: 0, approved: 0, declined: 0, incomplete: 0 };
    items.forEach(c => c.recs.forEach(r => {
      counts.all++;
      const appr = recApprovals.get(r.id);
      if (appr === "approved") counts.approved++;
      else if (appr === "declined") counts.declined++;
      else counts.awaiting++;
      if (r.total == null || r.labor == null) counts.incomplete++;
    }));
    return counts;
  }, [items, recApprovals]);

  // Filter items for display
  const filteredItems = React.useMemo(() => {
    if (activeFilter === "all") return items;
    return items.map(c => ({
      ...c,
      recs: c.recs.filter(r => {
        const appr = recApprovals.get(r.id);
        if (activeFilter === "approved") return appr === "approved";
        if (activeFilter === "declined") return appr === "declined";
        if (activeFilter === "awaiting") return appr == null;
        if (activeFilter === "incomplete") return r.total == null || r.labor == null;
        return true;
      }),
    })).filter(c => c.recs.length > 0);
  }, [items, activeFilter, recApprovals]);

  // Calc footer totals
  const calcTotals = React.useMemo(() => {
    let recommended = 0, declined = 0, approved = 0, selected = 0;
    items.forEach(c => c.recs.forEach(r => {
      const tot = r.total || 0;
      recommended += tot;
      const appr = recApprovals.get(r.id);
      if (appr === "approved") approved += tot;
      if (appr === "declined") declined += tot;
      if (selectedRecs.has(r.id)) selected += tot;
    }));
    return { recommended, declined, approved, selected };
  }, [items, recApprovals, selectedRecs]);

  // Reorder ASC concerns only. OCCs have no handle and aren't drop targets, so
  // they stay pinned at the top.
  const reorderConcern = (dragId, targetId, before) => {
    setItems((list) => {
      const arr = list.slice();
      const target = arr.find((x) => x.id === targetId);
      if (!target || target.section !== "mpi") return list;
      const from = arr.findIndex((x) => x.id === dragId);
      if (from < 0 || arr[from].section !== "mpi") return list;
      const [moved] = arr.splice(from, 1);
      const ti = arr.findIndex((x) => x.id === targetId);
      arr.splice(before ? ti : ti + 1, 0, moved);
      return arr;
    });
  };

  // Reorder recommendation lines within a single concern.
  const reorderRec = (concernId, dragRecId, targetRecId, before) => {
    setItems((list) => list.map((c) => {
      if (c.id !== concernId) return c;
      const recs = c.recs.slice();
      const from = recs.findIndex((r) => r.id === dragRecId);
      if (from < 0) return c;
      const [moved] = recs.splice(from, 1);
      const ti = recs.findIndex((r) => r.id === targetRecId);
      recs.splice(ti < 0 ? recs.length : (before ? ti : ti + 1), 0, moved);
      return { ...c, recs };
    }));
  };

  // Move a rec from one concern to another (optionally relative to a target rec).
  // Signature: moveRec(recId, fromConcernId, toConcernId[, targetRecId, before])
  const moveRec = (recId, fromId, toId, targetRecId, before) => {
    setItems((list) => {
      let moved = null;
      const next = list.map((c) => {
        if (c.id !== fromId) return c;
        const recs = c.recs.filter((r) => { if (r.id === recId) { moved = r; return false; } return true; });
        return { ...c, recs };
      });
      if (!moved) return list;
      const placed = next.map((c) => {
        if (c.id !== toId) return c;
        const recs = c.recs.slice();
        if (targetRecId) {
          const ti = recs.findIndex((r) => r.id === targetRecId);
          recs.splice(ti < 0 ? recs.length : (before ? ti : ti + 1), 0, moved);
        } else {
          recs.push(moved);
        }
        return { ...c, recs };
      });
      // Remove now-empty non-OCC concerns
      return placed.filter(c => c.type === "occ" || c.recs.length > 0 || (c.points?.length ?? 0) > 0);
    });
  };

  const [newConcernId, setNewConcernId] = React.useState(null);
  const onTitleChange = (id, title) => { setItems((cs) => cs.map((x) => x.id === id ? { ...x, title } : x)); if (id === newConcernId) setNewConcernId(null); };
  const addConcern = () => {
    const newId = "custom-" + Date.now();
    setItems((cs) => [...cs, { id: newId, section: "mpi", type: "asc_m", title: "New concern", points: [], recs: [] }]);
    setNewConcernId(newId);
  };
  const onAddRecToCard = (concernId) => { onAddRec && onAddRec(concernId, true); };
  // Extract a rec out of its concern into a new standalone concern.
  // If onExtractRec is provided (from MPIPage), use it so both concerns and recConcerns update.
  // Otherwise fall back to updating only the local items.
  const moveRecToNew = (recId, fromConcernId) => {
    if (onExtractRec) { onExtractRec(fromConcernId, recId); return; }
    const newId = "custom-" + Date.now();
    setItems(list => {
      const from = list.find(c => c.id === fromConcernId);
      const rec = from?.recs.find(r => r.id === recId);
      if (!rec) return list;
      return [
        ...list.map(c => c.id === fromConcernId ? { ...c, recs: c.recs.filter(r => r.id !== recId) } : c),
        { id: newId, section: "mpi", type: "asc_m", title: rec.recommendation || rec.text || "New concern", points: [], recs: [{ ...rec, fresh: true }] },
      ];
    });
  };
  const onToggleConcernRecs = React.useCallback((concernId) => {
    const c = items.find(x => x.id === concernId);
    if (!c) return;
    const ids = c.recs.map(r => r.id);
    const allSel = ids.length > 0 && ids.every(id => selectedRecs.has(id));
    setSelectedRecs(prev => {
      const next = new Set(prev);
      if (allSel) { ids.forEach(id => next.delete(id)); } else { ids.forEach(id => next.add(id)); }
      return next;
    });
  }, [items, selectedRecs]);
  const common = { reorderRec, recDrag, setRecDrag, concerns: items, moveRec, moveRecToNew, onRecClick, selectedRecs, onToggleRec, onToggleConcernRecs, onTitleChange, recApprovals, onApprovalChange };

  const ocr = filteredItems.filter((x) => x.section === "ocr");
  const mpi = filteredItems.filter((x) => x.section === "mpi");

  return (
    <div style={{ background: "var(--bg-canvas)", flex: 1, display: "flex", flexDirection: "column" }}>
      {/* Toolbar: RecActionBar with bulk actions */}
      <div style={{ padding: "10px 16px 0", background: "var(--bg-white)", borderBottom: "1px solid var(--b-1)", position: "sticky", top: 0, zIndex: 20 }}>
        <RecActionBar
          compact={compact}
          onToggleCompact={() => setCompact(c => !c)}
          selectedCount={selectedCount}
          onBulkApprove={onBulkApprove}
          onBulkDecline={onBulkDecline}
          onBulkReset={onBulkReset}
          onBulkDelete={onBulkDelete}
          onAddCustomRec={onAddCustomRec}
          phase={phase}
        />
      </div>
      {/* Bottom padding (200px) reserves room for the two fixed bars docked at the page
          bottom (the collapsible Totals bar + the Refresh/Preview/Print toolbar) so the
          last concern card can scroll fully into view instead of being hidden under them. */}
      <div style={{ padding: "16px 16px 200px", background: "var(--bg-canvas)", flex: 1 }}>
        <div style={{ maxWidth: 1200, margin: "0 auto" }}>
          <RecSectionHeader
            title="Concerns"
            count={ocr.length + mpi.length}
            right={<RecFilterBar filter={activeFilter} setFilter={setActiveFilter} counts={filterCounts} />}
            left={(() => {
              const allSel = totalCount > 0 && selectedCount === totalCount;
              const someSel = selectedCount > 0 && !allSel;
              return (
                <label style={{ display: "inline-flex", alignItems: "center", cursor: "pointer" }} title={allSel ? "Deselect all" : "Select all"}>
                  <input
                    type="checkbox"
                    className="checkbox"
                    checked={allSel}
                    ref={el => { if (el) el.indeterminate = someSel; }}
                    onChange={onSelectAll}
                    style={{ width: 14, height: 14, cursor: "pointer" }}

          />
          {(() => {
            if (ocr.length === 0 && mpi.length === 0) return <RecEmptyDrop label="No concerns match the active filter." />;

                onReorderConcern={reorderable ? (targetId, before) => reorderConcern(c.id, targetId, before) : undefined}
                onConcernDragStart={() => setConcernDrag(c.id)}
                onConcernDragEnd={() => setConcernDrag(null)}
                dragging={concernDrag === c.id}
                autoRename={c.id === newConcernId}
                phase={phase}
                {...common}
              />
            );
            return (
              <>
                {ocr.length > 0 && (
                  <>
                    {sectionLabel("Original Customer Concerns", "ocr")}
                    {sectionsOpen.ocr && ocr.map((c, i) => makeCard(c, { letter: String.fromCharCode(65 + i), reorderable: false, isFirst: i === 0 }))}
                  </>
                )}
                {mpi.length > 0 && (
                  <>
                    {sectionLabel("Additional Service Concerns", "asc", ocr.length > 0 ? 20 : 0)}
                    {sectionsOpen.asc && mpi.map((c, i) => makeCard(c, { letter: undefined, reorderable: mpi.length > 1, isFirst: i === 0 }))}
                  </>
                )}
              </>
            );
          })()}

          <PreviousDeclines concerns={items} setConcerns={setItems} showToast={showToast} defaultOpen={true} />
        </div>
      </div>
      <RecCalcFooter
        selectedTotal={calcTotals.selected}
        recommendedTotal={calcTotals.recommended}
        declinedTotal={calcTotals.declined}
        approvedTotal={calcTotals.approved}
        selectedCount={selectedCount}
      />

      {/* Undo toast — shown after flipping an already-decided rec between Approved/Declined
          (or resetting it), so an accidental click is easy to recover from. Same visual
          pattern as the toast used elsewhere in the app (progress-bar + action button). */}
      {approvalToast && (
        <div style={{
          position: "fixed", bottom: 80, left: "50%",
          transform: "translateX(-50%)",
          background: "#02679b", color: "#fff",
          borderRadius: 8,
          fontSize: 14, fontWeight: 500,
          boxShadow: "0 16px 40px rgba(2,103,155,0.35)",
          zIndex: 200,
          animation: "toastIn 220ms cubic-bezier(.2,.8,.2,1)",
          overflow: "hidden",
          minWidth: 260,
        }}>
          {/* Progress bar — top, drains over the undo window */}
          <div style={{ height: 5, background: "rgba(255,255,255,0.18)", position: "relative" }}>
            <div style={{
              position: "absolute", left: 0, top: 0, width: "100%", height: "100%",
              background: "rgba(255,255,255,0.75)",
              transformOrigin: "left center",
              animation: "toastProgress 5000ms linear forwards",
            }} />
          </div>
          {/* Main row */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px" }}>
            <span style={{
              width: 18, height: 18, borderRadius: 999,
              background: "rgba(255,255,255,0.25)",
              display: "grid", placeItems: "center", flexShrink: 0,
            }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
            </span>
            <span style={{ flex: 1 }}>{approvalToast.label}</span>
            <button
              onClick={undoApprovalChange}
              style={{ marginLeft: 6, padding: "2px 10px", height: 24, background: "rgba(255,255,255,0.18)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 4, color: "#fff", fontSize: 12.5, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}
              onMouseEnter={e => e.currentTarget.style.background = "rgba(255,255,255,0.3)"}
              onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.18)"}
            >Undo</button>
          </div>
        </div>
      )}
    </div>
  );
};

const MediaUploadArea = ({ internal = false, initialFiles = [] }) => {
  const [files, setFiles] = React.useState(initialFiles);
  const [dragging, setDragging] = React.useState(false);
  const inputRef = React.useRef(null);
  const bg = internal ? "#FFF0DB" : "var(--bg-white)";
  const accentColor = internal ? "#D9A941" : "var(--blue-600)";
  const dragBg = internal ? "#FEF3C7" : "var(--blue-25)";
  const borderCol = dragging ? accentColor : (internal ? "#F3DDA1" : "var(--b-3)");

  const readFiles = (fileList) => {
    Array.from(fileList).forEach(file => {
      if (!file.type.startsWith("image/") && !file.type.startsWith("video/")) return;
      const reader = new FileReader();
      reader.onload = e => setFiles(prev => [...prev, { url: e.target.result, name: file.name, type: file.type.startsWith("video/") ? "video" : "image" }]);
      reader.readAsDataURL(file);
    });
  };

  if (files.length > 0) {
    const MAX = 4;
    const extra = files.length > MAX ? files.length - MAX : 0;
    return (
      <div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-start", marginBottom: 8 }}>
          {files.slice(0, MAX).map((f, i) => (
            <div key={i} style={{ position: "relative", width: 110, height: 110, borderRadius: 8, overflow: "hidden", border: `1px solid ${internal ? "#F3DDA1" : "var(--b-2)"}`, flexShrink: 0 }}>
              {f.type === "video"
                ? <div style={{ width: "100%", height: "100%", background: "#111", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
                : <img src={f.url} alt={f.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
              }
              <button onClick={() => setFiles(prev => prev.filter((_, j) => j !== i))}
                style={{ position: "absolute", top: 4, right: 4, width: 20, height: 20, borderRadius: 999, background: "rgba(0,0,0,0.55)", border: "none", color: "#fff", fontSize: 13, cursor: "pointer", display: "grid", placeItems: "center", lineHeight: 1 }}>×</button>
              <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: "rgba(0,0,0,0.45)", padding: "3px 6px" }}>
                <div style={{ fontSize: 14, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</div>
              </div>
            </div>
          ))}
          {extra > 0 && (
            <div style={{ width: 110, height: 110, borderRadius: 8, border: `1.5px solid ${internal ? "#F3DDA1" : "var(--blue-300)"}`, background: internal ? "#FFF0DB" : "var(--blue-25)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
              onClick={() => inputRef.current?.click()}>
              <span style={{ fontSize: 14, fontWeight: 700, color: accentColor }}>+{extra} more</span>
            </div>
          )}
          <div style={{ width: 110, height: 110, borderRadius: 8, border: `1.5px dashed ${internal ? "#F3DDA1" : "var(--b-3)"}`, background: bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, cursor: "pointer", flexShrink: 0 }}
            onClick={() => inputRef.current?.click()}
            onDragOver={e => { e.preventDefault(); setDragging(true); }}
            onDragLeave={() => setDragging(false)}
            onDrop={e => { e.preventDefault(); setDragging(false); readFiles(e.dataTransfer.files); }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--t-4)" strokeWidth="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-4)" }}>Add</span>
          </div>
        </div>
        <input ref={inputRef} type="file" accept="image/*,video/*" multiple style={{ display: "none" }} onChange={e => { readFiles(e.target.files); e.target.value = ""; }} />
        <div style={{ fontSize: 14, color: "var(--t-4)", display: "flex", alignItems: "center", gap: 5 }}>
          {internal
            ? <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            : <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          }
          {internal ? "Internal — not shared with customer" : "Customer-visible"}
          <span style={{ marginLeft: "auto", color: accentColor, fontWeight: 600, cursor: "pointer" }} onClick={() => inputRef.current?.click()}>+ Add more</span>
        </div>
      </div>
    );
  }

  return (
    <div style={{ flex: 1 }}>
      <input ref={inputRef} type="file" accept="image/*,video/*" multiple style={{ display: "none" }} onChange={e => { readFiles(e.target.files); e.target.value = ""; }} />
      <div style={{
        border: `1.5px dashed ${borderCol}`, borderRadius: 8, background: dragging ? dragBg : bg,
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        padding: "22px 16px", gap: 6, cursor: "pointer", transition: "background 120ms, border-color 120ms", textAlign: "center",
      }}
        onClick={() => inputRef.current?.click()}
        onDragOver={e => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={e => { e.preventDefault(); setDragging(false); readFiles(e.dataTransfer.files); }}
      >
        {internal
          ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t-3)" strokeWidth="1.6"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--t-3)" strokeWidth="1.6"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        }
        <div style={{ fontSize: 14, fontWeight: 700, color: "var(--t-2)" }}>{internal ? "Internal Photos" : "Customer Photos"}</div>
        <div style={{ fontSize: 14, color: "var(--t-3)" }}>Drag and drop or <span style={{ color: accentColor, fontWeight: 600 }}>Upload</span></div>
        <div style={{ fontSize: 14, color: "var(--t-4)" }}>50 MB max file size</div>
      </div>
    </div>
  );
};

    return () => document.removeEventListener("mousedown", handler);
  }, [historyOpen]);
  const mockHistory = [

        </div>
        {/* APPROVAL */}
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 2, flexShrink: 0 }}>

            <span style={{ fontSize: 14, fontWeight: 700, color: "var(--green-700)" }}>success - FW</span>

                <div style={{ position: "relative" }} ref={historyRef}>

                  </button>

                    <div style={{ position: "absolute", top: "calc(100% + 6px)", right: 0, width: 340, background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 8, boxShadow: "0 4px 20px rgba(0,0,0,0.12)", zIndex: 200, overflow: "hidden" }}>

                      </div>
                      {mockHistory.map((h, i) => (

              <button style={{ padding: "6px 13px", fontSize: 12, fontWeight: 600, background: "var(--bg-cream-soft)", color: "var(--t-2)", border: "none", borderRight: "1px solid var(--b-2)", cursor: "pointer" }}>DMS Push</button>
              <button style={{ padding: "6px 10px", fontSize: 11, background: "var(--bg-cream-soft)", color: "var(--t-4)", border: "none", cursor: "pointer", fontFamily: "monospace" }}>Ctrl+Enter</button>
            </div>
            <button style={{ padding: "6px 14px", background: "var(--blue-600)", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer", fontFamily: "Lato, sans-serif", fontSize: 14, fontWeight: 400, lineHeight: "20px", letterSpacing: "1.12px", textTransform: "uppercase" }}>Save</button>
            <div style={{ flex: 1 }} />
            <button style={{ padding: "6px 13px", fontSize: 12, fontWeight: 600, border: "1px solid var(--b-2)", borderRadius: 6, background: "var(--bg-white)", color: "var(--t-2)", cursor: "pointer" }}>Add Part to DMS</button>
          </div>

          {/* Parts table */}
          <div style={{ borderTop: "1px solid var(--b-2)", overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
              <thead>
                <tr style={{ background: "var(--bg-cream-soft)", borderBottom: "1px solid var(--b-2)" }}>
                  <th style={{ width: 38, padding: "7px 10px", textAlign: "center" }}>
                    <input type="checkbox" checked={allChecked} onChange={toggleAll} style={{ width: 14, height: 14 }} />
                  </th>
                  <th style={{ textAlign: "left", padding: "7px 8px", fontWeight: 700, fontSize: 11, letterSpacing: "0.04em", color: "var(--t-3)", textTransform: "uppercase", whiteSpace: "nowrap" }}>Part #</th>

              </thead>
              <tbody>
                {parts.map((row) => {
                  const rowTotal = (parseFloat(row.sellPrice) || 0) * Math.max(1, parseInt(row.qty) || 1);

                    <tr key={row.id} style={{ borderBottom: "1px solid var(--b-1)" }}>

                      <td style={{ padding: "5px 8px" }}>
                        <input value={row.partNo} onChange={e => updateRow(row.id, "partNo", e.target.value)} placeholder="Input" style={{ ...inputSt, width: 110 }} />
                      </td>
                      <td style={{ padding: "5px 8px", textAlign: "center" }}>
                        <input type="number" min="1" value={row.qty} onChange={e => updateRow(row.id, "qty", e.target.value)} style={{ ...inputSt, width: 52, textAlign: "center" }} />

                        <input value={row.description} onChange={e => updateRow(row.id, "description", e.target.value)} style={inputSt} />

                      <td style={{ padding: "5px 8px", textAlign: "center" }}>

                      <td style={{ padding: "5px 8px", textAlign: "center" }}>
                        <select value={row.eta} onChange={e => updateRow(row.id, "eta", e.target.value)} style={{ fontSize: 14, border: "1px solid #D5D7DA", borderRadius: 8, padding: "4px 6px", background: "var(--bg-white)", cursor: "pointer" }}>
                          <option>Later today</option>
                          <option>Tomorrow</option>
                          <option>2-3 days</option>
                          <option>Next week</option>
                          <option>On order</option>
                        </select>
                      </td>
                      <td style={{ padding: "5px 8px", textAlign: "right", fontWeight: 600, color: "var(--t-1)", whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums" }}>
                        ${rowTotal.toFixed(2)}
                      </td>
                      <td style={{ padding: "5px 8px", textAlign: "center" }}>
                        <button onClick={() => setParts(prev => prev.filter(r => r.id !== row.id))} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--t-4)", display: "inline-flex", alignItems: "center", justifyContent: "center", padding: 2 }}

                          onMouseLeave={e => e.currentTarget.style.color = "var(--t-4)"}>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <button onClick={() => setParts(prev => [...prev, makePartRow()])}
              style={{ margin: "8px 14px 10px", padding: "4px 12px", fontSize: 12, fontWeight: 600, border: "1.5px dashed var(--b-3)", borderRadius: 5, background: "transparent", color: "var(--t-3)", cursor: "pointer" }}>
              + Add row
            </button>
          </div>
        </div>
      )}
    </div>
  );
};

const PartsTab = ({ recConcerns = [] }) => {
  const approvedEntries = [];
  let idx = 0;
  recConcerns.forEach(c => {
    (c.recs || []).forEach(r => {
      if (r.estStatus && r.estStatus.some(s => s.tone === "approved")) {
        approvedEntries.push({ rec: r, concern: c, letter: String.fromCharCode(65 + idx++) });
      }
    });
  });

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "14px 16px 40px", background: "var(--bg-cream-soft)" }} className="scrollable">
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        {/* Toolbar */}
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 16 }}>
          <button style={{ padding: "7px 14px", fontSize: 12, fontWeight: 700, letterSpacing: "0.04em", textTransform: "uppercase", border: "1px solid var(--b-2)", borderRadius: 6, background: "var(--bg-white)", color: "var(--t-2)", cursor: "pointer" }}>Mark Parts Added to DMS</button>
          <button style={{ padding: "7px 14px", border: "none", borderRadius: 6, background: "var(--blue-600)", color: "#fff", cursor: "pointer", fontFamily: "Lato, sans-serif", fontSize: 14, fontWeight: 400, lineHeight: "20px", letterSpacing: "1.12px", textTransform: "uppercase" }}>Save Changes</button>
        </div>
        {/* Section label */}
        <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--t-3)", marginBottom: 10 }}>Recommendations</div>
        {approvedEntries.length === 0 ? (
          <div style={{ textAlign: "center", padding: "48px 24px", color: "var(--t-4)", fontSize: 14 }}>No approved recommendations yet. Approve recs in the Recommendation tab.</div>
        ) : (
          approvedEntries.map(({ rec, concern, letter }) => (
            <PartsRecCard key={rec.id} rec={rec} concern={concern} letter={letter} />
          ))
        )}
      </div>
    </div>
  );
};
