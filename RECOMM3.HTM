// Drag handle for reordering ASC concern cards. Only rendered for ASC concerns
// when 2+ are present; OCC cards never get one, so they can't be reordered.
const CardDragHandle = ({ selfConcernId, onReorder, onDragStart, onDragEnd }) => {
  const dragRef = React.useRef(null);

  const onPointerDown = (e) => {
    if (e.button !== 0) return;
    e.stopPropagation();
    const st = { sx: e.clientX, sy: e.clientY, dragging: false, ghost: null, line: null, target: null, before: false, hotEl: null, hotPrevOutline: null, hotPrevOutlineOffset: null, hotPrevBg: null };
    dragRef.current = st;
    // Clears both the thin insertion line AND the full-card blue outline/fill highlight
    // left on whichever card was the last valid drop target.
    const clearLine = () => {
      if (st.line) { st.line.remove(); st.line = null; }
      st.target = null;
      if (st.hotEl) {
        st.hotEl.style.outline = st.hotPrevOutline || "";
        st.hotEl.style.outlineOffset = st.hotPrevOutlineOffset || "";
        st.hotEl.style.background = st.hotPrevBg || "";
        st.hotEl = null; st.hotPrevOutline = null; st.hotPrevOutlineOffset = null; st.hotPrevBg = null;
      }
    };
    const move = (ev) => {
      if (!st.dragging) {
        if (Math.hypot(ev.clientX - st.sx, ev.clientY - st.sy) < 5) return;
        st.dragging = true;
        onDragStart && onDragStart();
        const g = document.createElement("div");
        g.textContent = "Drag to reorder concern";
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:6px 10px;border-radius:6px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:nowrap;";
        document.body.appendChild(g); st.ghost = g;
        document.body.style.cursor = "grabbing"; document.body.style.userSelect = "none";
      }
      st.ghost.style.transform = `translate(${ev.clientX + 14}px, ${ev.clientY + 14}px)`;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "block";
      const card = under && under.closest ? under.closest("[data-concern-reorderable]") : null;
      clearLine();
      if (card) {
        const cid = card.getAttribute("data-concern-drop");
        if (cid !== selfConcernId) {
          const rect = card.getBoundingClientRect();
          const before = ev.clientY < rect.top + rect.height / 2;
          st.target = cid; st.before = before;
          const line = document.createElement("div");
          line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:3px;border-radius:2px;background:#02679B;box-shadow:0 0 0 1px rgba(2,103,155,.2);";
          line.style.left = rect.left + "px"; line.style.width = rect.width + "px";
          line.style.top = ((before ? rect.top : rect.bottom) - 1.5) + "px";
          document.body.appendChild(line); st.line = line;
          // Full-card blue outline + lighter fill on the drop target itself, so it's obvious
          // which concern card you're about to drop onto — not just the thin insertion line.
          st.hotEl = card;
          st.hotPrevOutline = card.style.outline;
          st.hotPrevOutlineOffset = card.style.outlineOffset;
          st.hotPrevBg = card.style.background;
          card.style.outline = "2px solid var(--blue-500)";
          card.style.outlineOffset = "-2px";
          card.style.background = "var(--blue-50)";
        }
      }
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = ""; document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      const t = st.target, b = st.before;
      clearLine();
      if (st.dragging) { onDragEnd && onDragEnd(); if (t) onReorder(t, b); }
      dragRef.current = null;
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div
      role="button"
      tabIndex={0}
      onPointerDown={onPointerDown}
      onClick={(e) => e.stopPropagation()}
      title="Drag to reorder this concern"
      style={{
        width: 20, height: 22, borderRadius: 5, flexShrink: 0,
        background: "transparent", border: "none",
        color: "var(--t-3)", cursor: "grab",
        display: "grid", placeItems: "center", touchAction: "none",
      }}
      onMouseEnter={(e) => { e.currentTarget.style.color = "var(--t-1)"; }}
      onMouseLeave={(e) => { e.currentTarget.style.color = "var(--t-3)"; }}
    >
      <IconMove size={14} />
    </div>
  );
};

const TotalPill = ({ total, shownTotal, hasZeroShown, breakdown, needsPricing, preApprovedTotal = 0 }) => {
  const [tip, setTip] = React.useState(false);
  const [hov, setHov] = React.useState(false);
  const [pos, setPos] = React.useState({ top: 0, left: 0 });
  const ref = React.useRef(null);
  const hideT = React.useRef(null);
  const missingLabor = needsPricing && needsPricing.includes("Labor");
  const missingParts = needsPricing && needsPricing.includes("Parts");
  const hasTooltip = !!(breakdown || needsPricing);
  const showTip = () => { clearTimeout(hideT.current); if (hasTooltip && ref.current) { const r = ref.current.getBoundingClientRect(); setPos({ top: r.bottom + 6, left: r.left }); setTip(true); } };
  const hideTip = () => { hideT.current = setTimeout(() => setTip(false), 150); };
  const isZero = hasZeroShown && shownTotal === 0;
  const displayAmt = isZero ? total : (hasZeroShown ? shownTotal : total);
  // Build tooltip rows: normal lines, plus "Incomplete" for missing items
  const tooltipRows = [
    breakdown?.hrs ? ["Hours", breakdown.hrs + " hrs", false] : null,
    missingLabor ? ["Labor", "Incomplete", true] : (Number(breakdown?.labor) > 0 ? ["Labor", "$" + Number(breakdown.labor).toFixed(0), false] : null),
    missingParts ? ["Parts", "Incomplete", true] : (Number(breakdown?.parts) > 0 ? ["Parts", "$" + Number(breakdown.parts).toFixed(0), false] : null),
    Number(breakdown?.misc) > 0 ? ["Misc", "$" + Number(breakdown.misc).toFixed(0), false] : null,
  ].filter(Boolean);
  return (
    <span ref={ref} style={{ position: "relative" }}
      onMouseEnter={() => { setHov(true); showTip(); }}
      onMouseLeave={() => { setHov(false); hideTip(); }}
      onClick={e => e.stopPropagation()}>
      <span style={{
        fontSize: 14, fontWeight: 600, color: "var(--t-3)",
        background: needsPricing ? (hov ? "var(--yellow-100)" : "var(--yellow-50)") : (hov ? "var(--bg-cream)" : "var(--bg-white)"),
        border: needsPricing ? "1px solid var(--yellow-600)" : "1px solid var(--b-2)", borderRadius: 5,
        padding: "3px 9px", whiteSpace: "nowrap", display: "inline-flex", alignItems: "center", gap: 5,
        cursor: hasTooltip ? "pointer" : "default",
        transition: "background 120ms",
        lineHeight: "18px",
      }}>
        <span style={{ color: "var(--t-2)", fontWeight: 600 }}>Total</span>
        {" · "}
        {isZero
          ? <><span style={{ textDecoration: "line-through", color: "var(--t-4)", fontWeight: 500 }}>${Number(total).toFixed(0)}</span>{" "}<span style={{ color: "var(--red-600)" }}>$0</span></>
          : <span style={{ color: needsPricing ? "var(--yellow-700)" : "var(--t-2)", fontWeight: needsPricing ? 700 : 600 }}>${Number(displayAmt).toFixed(0)}</span>
        }
        {needsPricing && (
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#D97706" stroke="white" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" style={{ flexShrink: 0 }}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        )}
      </span>
      {tip && hasTooltip && (
        <div onMouseEnter={() => { clearTimeout(hideT.current); setHov(true); }} onMouseLeave={() => { setHov(false); hideTip(); }}
          style={{ position: "fixed", top: pos.top, left: pos.left, background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 8, boxShadow: "var(--shadow-modal)", zIndex: 9999, minWidth: 190, padding: "8px 0" }}>
          {Number(preApprovedTotal) > 0 && (
            <>
              <div style={{ padding: "2px 12px 6px", fontSize: 10, fontWeight: 700, letterSpacing: "0.09em", textTransform: "uppercase", color: "var(--t-4)" }}>Pre-approved breakdown</div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 12px", borderTop: "1px solid var(--b-1)", gap: 24 }}>
                <span style={{ fontSize: 14, color: "var(--t-3)" }}>Pre-Approved</span>
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>${Number(preApprovedTotal).toFixed(0)}</span>
              </div>
              <div style={{ height: 1, background: "var(--b-2)", margin: "6px 0" }} />
            </>
          )}
          <div style={{ padding: "2px 12px 6px", fontSize: 10, fontWeight: 700, letterSpacing: "0.09em", textTransform: "uppercase", color: "var(--t-4)" }}>Estimate breakdown</div>
          {tooltipRows.map(([label, val, isIncomplete]) => (
            <div key={label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 12px", borderTop: "1px solid var(--b-1)", gap: 24 }}>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 5, fontSize: 14, color: "var(--t-3)" }}>
                {isIncomplete && <svg width="11" height="11" viewBox="0 0 24 24" fill="#D97706" stroke="white" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>}
                {label}
              </span>
              <span style={{ fontSize: 14, fontWeight: 600, color: isIncomplete ? "#D97706" : "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>{val}</span>
            </div>
          ))}
          {breakdown && (() => {
            // Credit and Debit are the same underlying total, shown two ways (e.g. pre-tax vs
            // with-tax rounding) — keep them within 3% of each other rather than pulling Debit
            // from a wholly separate figure (like preApprovedTotal) that could diverge widely.
            const creditAmt = Number(total);
            const debitAmt = creditAmt * 1.03;
            return (
              <>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 12px", borderTop: "1px solid var(--b-2)", background: "var(--bg-cream-soft)", gap: 24 }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: "var(--t-1)" }}>Total (Credit)</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>${creditAmt.toFixed(0)}</span>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 12px", borderTop: "1px solid var(--b-1)", background: "var(--bg-cream-soft)", gap: 24 }}>
                  <span style={{ fontSize: 14, fontWeight: 700, color: "var(--t-1)" }}>Total (Debit)</span>
                  <span style={{ fontSize: 13, fontWeight: 700, color: "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>${debitAmt.toFixed(0)}</span>
                </div>
              </>
            );
          })()}
        </div>
      )}
    </span>
  );
};

// ── Shared header row used by ConcernCard (Edit MPI), RecConcernCard, and RecCompactConcernCard.
const ConcernCardHeader = ({ recTabLayout = false,
  concern, palette, letter,
  reorderable, onReorder, onDragStart, onDragEnd,
  onTitleChange,   // (id, title) → void; if falsy, no rename
  onAddRec,        // (id) → void; if falsy, no +REC button
  total = 0, shownTotal = 0, hasZeroShown = false, showTotal = true,
  autoRename = false,
  recApprovals = null,
  checkboxEl = null,
  preApprovedEl = null,
  preApprovedTotal = 0,
  noLeftBorder = false,
  style = {},
  breakdown = null,
  needsPricing = null,
}) => {
  const approvedCount = recApprovals ? concern.recs.filter(r => recApprovals.get(r.id) === "approved").length : 0;
  const recsCount = concern.recs.length;
  const canRename = concern.type !== "occ" && !!onTitleChange;
  const [editingTitle, setEditingTitle] = React.useState(false);
  const [titleDraft, setTitleDraft] = React.useState(concern.title);
  const [headerHover, setHeaderHover] = React.useState(false);
  React.useEffect(() => { setTitleDraft(concern.title); }, [concern.title]);
  React.useEffect(() => { if (autoRename) { setTitleDraft(concern.title); setEditingTitle(true); } }, [autoRename]);
  const commitEdit = () => { setEditingTitle(false); onTitleChange && onTitleChange(concern.id, titleDraft || concern.title); };
  const cancelEdit = () => { setEditingTitle(false); setTitleDraft(concern.title); };
  return (
    <div style={{ display: "flex", alignItems: "center", background: palette.headBg, borderLeft: noLeftBorder ? "none" : (concern.type !== "occ" ? "3px solid transparent" : "3px solid var(--blue-600)"), padding: "7px 0", ...(recTabLayout ? { paddingRight: 8 } : {}), ...style }} onMouseEnter={() => setHeaderHover(true)} onMouseLeave={() => setHeaderHover(false)}>
      {checkboxEl && <div style={{ paddingLeft: 8, flexShrink: 0 }} onClick={e => e.stopPropagation()}>{checkboxEl}</div>}
      {/* Drag handle — only for reorderable (non-OCC) concern cards; wired to the pointer-drag CardDragHandle */}
      {reorderable && (
        <div style={{ width: 24, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <CardDragHandle selfConcernId={concern.id} onReorder={onReorder} onDragStart={onDragStart} onDragEnd={onDragEnd} />
        </div>
      )}
      {/* Left group — title area, gapped — owns the 8px left inset so the outer flex has no padding, keeping right columns pixel-aligned with rec rows */}
      <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 10, paddingLeft: (checkboxEl || reorderable) ? 6 : 8 }}>

        <div style={{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: 4 }}>
        {concern.type === "occ" && letter != null
          ? <ConcernTypePill combined label={"OCC · " + (typeof letter === "number" ? letter : String(letter).toUpperCase())} color="var(--occ-strong)" />
          : <ConcernTypePill label={palette.label} color={palette.pillT} />
        }
        {concern.type !== "occ" && <span style={{ fontSize: 11, color: "var(--t-4)", flexShrink: 0 }}>·</span>}
        {canRename && editingTitle ? (
          <input autoFocus value={titleDraft}
            onChange={(e) => setTitleDraft(e.target.value)}
            onBlur={commitEdit}
            onKeyDown={(e) => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") cancelEdit(); }}
            onClick={(e) => e.stopPropagation()}
            style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 700, letterSpacing: 0.01, textTransform: "uppercase", lineHeight: 1.3, background: "rgba(255,255,255,0.8)", border: "1px solid var(--blue-400)", borderRadius: 8, color: "var(--t-1)", padding: "1px 4px", fontFamily: "inherit" }}
          />
        ) : (
          <span style={{ flex: 1, minWidth: 0, display: "inline-flex", alignItems: "center", gap: 6 }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: "var(--t-1)", letterSpacing: 0, textTransform: concern.type === "occ" ? "uppercase" : "none", fontStyle: "normal", lineHeight: 1.3, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{concern.title}</span>
            {canRename && (
              <button data-rename-concern={concern.id}
                onClick={(e) => { e.stopPropagation(); setTitleDraft(concern.title); setEditingTitle(true); }}
                title="Rename concern"
                style={{ flexShrink: 0, display: "inline-flex", alignItems: "center", justifyContent: "center", width: 20, height: 20, borderRadius: 4, background: "transparent", border: "1px solid transparent", color: "var(--t-4)", cursor: "pointer", padding: 0, opacity: headerHover ? 1 : 0, transition: "opacity 120ms" }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "rgba(0,0,0,0.07)"; e.currentTarget.style.color = "var(--t-2)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.color = "var(--t-4)"; }}
              ><IconPencil size={11} /></button>
            )}
          </span>
        )}
        </div>
      </div>
      {recTabLayout ? (
        <>
          {/* REC button — sits before price, no approval-count text */}
          {onAddRec && (
            <button onClick={(e) => { e.stopPropagation(); onAddRec(concern.id); }}
              style={{ height: 26, padding: "0 14px", background: "var(--bg-white)", border: "1px solid var(--blue-200)", borderRadius: 5, fontSize: 12, fontWeight: 700, color: "var(--blue-600)", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4, flexShrink: 0, marginRight: 14 }}
              onMouseEnter={(e) => { e.currentTarget.style.background = "var(--blue-50)"; e.currentTarget.style.borderColor = "var(--blue-500)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = "var(--bg-white)"; e.currentTarget.style.borderColor = "var(--blue-200)"; }}
            ><IconPlus size={10} /> REC</button>
          )}
          {/* Pre-approved pill + PRICE — grouped together; pre-approved shows independent of the Total badge */}
          {(showTotal || preApprovedEl) && (
            <div style={{ flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "flex-end", fontVariantNumeric: "tabular-nums", paddingRight: 6, gap: 6 }}>
              {preApprovedEl}
              {showTotal && <TotalPill total={total} shownTotal={shownTotal} hasZeroShown={hasZeroShown} breakdown={breakdown} needsPricing={needsPricing} preApprovedTotal={preApprovedTotal} />}
            </div>
          )}
        </>
      ) : (
        <>
          {/* Pre-approved pill + price — grouped together; pre-approved shows independent of the Total badge */}
          {(showTotal || preApprovedEl) && (
            <div style={{ flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "flex-end", fontVariantNumeric: "tabular-nums", paddingRight: onAddRec ? 8 : 14, gap: 6 }}>
              {preApprovedEl}
              {showTotal && <TotalPill total={total} shownTotal={shownTotal} hasZeroShown={hasZeroShown} breakdown={breakdown} needsPricing={needsPricing} preApprovedTotal={preApprovedTotal} />}
            </div>
          )}
          {/* Action column — only shown when +REC button exists */}
          {onAddRec && (
            <div style={{ width: 100, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
              {(showTotal || preApprovedEl) && (
                <span style={{ position: "absolute", left: 0, top: -7, bottom: -7, width: 1, background: "var(--b-2)", borderRadius: 1 }} />
              )}
              <button onClick={(e) => { e.stopPropagation(); onAddRec(concern.id); }}
                style={{ height: 28, padding: "0 14px", background: "var(--bg-white)", border: "1px solid var(--blue-200)", borderRadius: 5, fontSize: 13, fontWeight: 700, color: "var(--blue-600)", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4 }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "var(--blue-50)"; e.currentTarget.style.borderColor = "var(--blue-500)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "var(--bg-white)"; e.currentTarget.style.borderColor = "var(--blue-200)"; }}
              ><IconPlus size={11} /> REC</button>
            </div>
          )}
        </>
      )}
    </div>
  );
};

// ── Preview panel shown to the left of the rec-editor modal.
const ModalContextPreview = ({ concerns, recConcerns = [], targetConcernId, liveState, panel, onReorderRec, onExtractRec, editingRecId, onChangeLiveTarget, pvwCollapsed = false, showOnboarding = false, onDismissOnboarding, width = 330 }) => {
  const [pvwDragging, setPvwDragging] = React.useState(false);
  // Distinguishes a plain click (jump to that rec) from a drag-to-reorder gesture on the same row.
  const justDraggedRef = React.useRef(false);

  // Pointer-based drag handler for preview rec rows.
  // Supports three drop targets:
  //   1. Another rec row in the same concern → reorder (onReorderRec with same fromConcernId/toConcernId)
  //   2. A rec row in a different concern → move there (onReorderRec with different toConcernId)
  //   3. The "new concern" drop zone at the bottom → extract to standalone (onExtractRec)
  const makeRecDrag = (recId, concernId) => (e) => {
    if (e.button !== 0 || (!onReorderRec && !onExtractRec)) return;
    e.preventDefault();
    e.stopPropagation();
    const target = e.currentTarget;
    const pointerId = e.pointerId != null ? e.pointerId : null;
    if (pointerId != null) { try { target.setPointerCapture(pointerId); } catch(_) {} }
    const st = { sx: e.clientX, sy: e.clientY, dragging: false, ghost: null, line: null, dropId: null, dropConcernId: null, dropBefore: false, dropNew: false, highlightEl: null };
    const clearHighlight = () => { if (st.highlightEl) { st.highlightEl.style.outline = ""; st.highlightEl = null; } };
    const move = (ev) => {
      const dx = ev.clientX - st.sx, dy = ev.clientY - st.sy;
      if (!st.dragging) {
        if (Math.hypot(dx, dy) < 3) return;
        st.dragging = true;
        justDraggedRef.current = true;
        const g = document.createElement("div");
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:4px 10px;border-radius:5px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap;";
        g.textContent = "Move rec";
        document.body.appendChild(g); st.ghost = g;
        document.body.style.cursor = "grabbing"; document.body.style.userSelect = "none";
        setPvwDragging(true);
      }
      if (st.ghost) st.ghost.style.transform = `translate(${ev.clientX + 12}px,${ev.clientY + 12}px)`;
      if (st.line) { st.line.remove(); st.line = null; }
      clearHighlight();
      // Check drop zone first (may render on next tick after setPvwDragging)
      const dz = document.querySelector("[data-pvw-dropzone='new']");
      if (dz) {
        const dzr = dz.getBoundingClientRect();
        const overDz = ev.clientX >= dzr.left && ev.clientX <= dzr.right && ev.clientY >= dzr.top && ev.clientY <= dzr.bottom;
        if (overDz) {
          st.dropNew = true; st.dropId = null; st.dropConcernId = null;
          dz.style.background = "var(--blue-50,#eff6ff)"; dz.style.borderColor = "var(--blue-500,#3b82f6)"; dz.style.color = "var(--blue-600,#2563eb)";
          return;
        } else {
          st.dropNew = false;
          dz.style.background = ""; dz.style.borderColor = ""; dz.style.color = "";
        }
      }
      st.dropNew = false;
      if (!st.ghost) return;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "";
      const row = under && under.closest ? under.closest("[data-pvw-rec]") : null;
      const rowRecId = row && row.getAttribute("data-pvw-rec");
      const rowConcernId = row && row.getAttribute("data-pvw-concern");
      // 1. Drop onto a specific rec row (reorder or move cross-concern)
      if (onReorderRec && row && rowRecId !== recId) {
        const rect = row.getBoundingClientRect();
        const before = ev.clientY < rect.top + rect.height / 2;
        st.dropId = rowRecId; st.dropConcernId = rowConcernId; st.dropBefore = before;
        const line = document.createElement("div");
        line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:2px;border-radius:2px;background:#02679B;";
        line.style.left = rect.left + "px"; line.style.width = rect.width + "px";
        line.style.top = ((before ? rect.top : rect.bottom) - 1) + "px";
        document.body.appendChild(line); st.line = line;
      } else {
        // 2. Fallback: drop onto a concern card (appends to that concern)
        const card = under && under.closest ? under.closest("[data-pvw-concern-drop]") : null;
        const cardConcernId = card && card.getAttribute("data-pvw-concern-drop");
        if (onReorderRec && card && cardConcernId !== concernId) {
          st.dropId = null; st.dropConcernId = cardConcernId; st.dropBefore = false;
          card.style.outline = "2px solid var(--blue-400,#60a5fa)";
          st.highlightEl = card;
        } else {
          st.dropId = null; st.dropConcernId = null;
        }
      }
    };
    const up = (ev) => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.body.style.cursor = ""; document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      if (st.line) st.line.remove();
      clearHighlight();
      const dz = document.querySelector("[data-pvw-dropzone='new']");
      if (dz) { dz.style.background = ""; dz.style.borderColor = ""; dz.style.color = ""; }
      setPvwDragging(false);
      if (st.dragging && st.dropNew && onExtractRec) onExtractRec(concernId, recId);
      else if (st.dragging && st.dropConcernId && onReorderRec) onReorderRec(concernId, recId, st.dropConcernId, st.dropId, st.dropBefore);
      // Let the resulting click event (if any) see justDraggedRef before we clear it.
      setTimeout(() => { justDraggedRef.current = false; }, 0);
    };
    // Use pointer events on document for reliable tracking across scroll containers.
    // setPointerCapture ensures events reach us even when the pointer leaves the element.
    if (pointerId != null) {
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      document.addEventListener("pointercancel", up);
    } else {
      // Fallback for environments without pointer events
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    }
  };
  // Cleanup pointer listeners in up() already handles removal

  // Drag handler for the "Current rec" live row — lets the user drag it to a different concern
  // or to the "Add a new concern" drop zone (to go standalone).
  const makeLiveDrag = () => (e) => {
    if (e.button !== 0 || !onChangeLiveTarget) return;
    e.preventDefault();
    e.stopPropagation();
    const pointerId = e.pointerId != null ? e.pointerId : null;
    const st = { sx: e.clientX, sy: e.clientY, dragging: false, ghost: null, dropConcernId: null, dropNew: false, highlightEl: null };
    const clearHighlight = () => { if (st.highlightEl) { st.highlightEl.style.outline = ""; st.highlightEl = null; } };
    const move = (ev) => {
      const dx = ev.clientX - st.sx, dy = ev.clientY - st.sy;
      if (!st.dragging) {
        if (Math.hypot(dx, dy) < 3) return;
        st.dragging = true;
        const g = document.createElement("div");
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:4px 10px;border-radius:5px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.28);white-space:nowrap;";
        g.textContent = "Move to concern";
        document.body.appendChild(g); st.ghost = g;
        document.body.style.cursor = "grabbing"; document.body.style.userSelect = "none";
        setPvwDragging(true);
      }
      if (st.ghost) st.ghost.style.transform = `translate(${ev.clientX + 12}px,${ev.clientY + 12}px)`;
      clearHighlight();
      // Check "Add a new concern" drop zone first
      const dz = document.querySelector("[data-pvw-dropzone='new']");
      if (dz) {
        const dzr = dz.getBoundingClientRect();
        const overDz = ev.clientX >= dzr.left && ev.clientX <= dzr.right && ev.clientY >= dzr.top && ev.clientY <= dzr.bottom;
        if (overDz) {
          st.dropNew = true; st.dropConcernId = null;
          dz.style.background = "var(--blue-50,#eff6ff)"; dz.style.borderColor = "var(--blue-500,#3b82f6)"; dz.style.color = "var(--blue-600,#2563eb)";
          return;
        } else {
          st.dropNew = false;
          dz.style.background = ""; dz.style.borderColor = ""; dz.style.color = "";
        }
      }
      st.dropNew = false;
      if (!st.ghost) return;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "";
      const card = under && under.closest ? under.closest("[data-pvw-concern-drop]") : null;
      const cardId = card && card.getAttribute("data-pvw-concern-drop");
      if (card && cardId) {
        st.dropConcernId = cardId;
        card.style.outline = "2px solid var(--blue-400,#60a5fa)";
        st.highlightEl = card;
      } else {
        st.dropConcernId = null;
      }
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      document.body.style.cursor = ""; document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      clearHighlight();
      const dz = document.querySelector("[data-pvw-dropzone='new']");
      if (dz) { dz.style.background = ""; dz.style.borderColor = ""; dz.style.color = ""; }
      setPvwDragging(false);
      if (st.dragging && st.dropNew) onChangeLiveTarget("__unlinked__");
      else if (st.dragging && st.dropConcernId) onChangeLiveTarget(st.dropConcernId);
    };
    if (pointerId != null) {
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
      document.addEventListener("pointercancel", up);
    } else {
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    }
  };

  // Use concerns (MPI tab) as the sole source of truth — recs are populated when the user saves
  const occs = concerns.filter(c => c.type === "occ");
  const ascs = concerns.filter(c => c.type !== "occ");

  // liveState: { concernId, customName, recText, status } from RecEditorModal
  const liveId = liveState?.concernId;
  const liveName = liveState?.customName || "";
  const liveText = liveState?.recText || "";
  const liveStatus = liveState?.status || null; // "fail" | "caution" | null

  // Helper: resolve an ID (which may be from recConcerns with different IDs) to a concern in concerns[].
  // Tries direct match first, then title-match for OCCs (since OCC IDs differ between concerns/recConcerns).
  const resolveId = (id) => {
    if (!id) return null;
    const direct = concerns.find(c => c.id === id);
    if (direct) return direct;
    const rc = (recConcerns || []).find(r => r.id === id);
    if (rc?.type === "occ") {
      return concerns.find(c => c.type === "occ" && c.title?.trim().toLowerCase() === rc.title?.trim().toLowerCase()) || null;
    }
    return null;
  };

  const targetInConcerns = resolveId(targetConcernId);
  const liveConcernInMpi = (liveId && liveId !== "__new_custom__" && liveId !== "__unlinked__") ? resolveId(liveId) : null;
  const liveIsKnown = !!liveConcernInMpi;

  // Show a synthetic entry for custom/unlinked/ASC-from-recConcerns concerns
  // When linking to an existing recConcerns ASC (not in concerns yet), use its real title+type
  const rcForSynthetic = (liveId && !liveIsKnown) ? (recConcerns || []).find(r => r.id === liveId) : null;
  const syntheticConcern = (liveState && !liveIsKnown && liveId && (liveId !== "new-form-concern" || liveName))
    ? { id: "__live__", type: rcForSynthetic?.type || "asc_m", title: rcForSynthetic?.title || liveName || "New concern", recs: [], _liveTarget: true }
    : null;

  const all = [...occs, ...ascs, ...(syntheticConcern ? [syntheticConcern] : [])];
  if (all.length === 0 && !showOnboarding) return null;

  // Collapsed — parent renders the toggle button; we just return nothing
  if (pvwCollapsed) return null;

  return (
    <div style={{
      width, flexShrink: 0,
      background: "var(--bg-white)",
      borderRadius: panel ? 0 : 12,
      borderRight: panel ? "1px solid var(--b-2)" : undefined,
      border: panel ? undefined : "1px solid var(--b-2)",
      boxShadow: panel ? "none" : "0 8px 32px rgba(0,0,0,0.14)",
      overflow: "hidden",
      height: panel ? "100%" : undefined,
      maxHeight: panel ? undefined : "80vh",
      overflowY: "auto",
      alignSelf: panel ? "stretch" : "flex-start",
      animation: "modalIn 220ms cubic-bezier(.2,.8,.2,1)",
      position: "relative",
    }} className="scrollable">
      {/* Onboarding overlay — phase 2 first open */}
      {showOnboarding && (
        <div style={{
          position: "absolute", inset: 0, zIndex: 10,
          background: "rgba(15,23,42,0.72)",
          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
          padding: "24px 20px",
          backdropFilter: "blur(2px)",
          animation: "fadeIn 200ms",
        }}>
          <div style={{
            background: "var(--bg-white)", borderRadius: 12, padding: "20px 20px 18px",
            boxShadow: "0 8px 32px rgba(0,0,0,0.22)", width: "100%", maxWidth: 280,
            display: "flex", flexDirection: "column", gap: 12,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: "var(--blue-50)", display: "grid", placeItems: "center", flexShrink: 0 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue-600)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 5v14M5 12l7 7 7-7"/>
                </svg>
              </div>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "var(--t-1)" }}>Reorder recommendations</div>
                <div style={{ fontSize: 14, color: "var(--t-3)", marginTop: 2 }}>Phase 2 grouping is active</div>
              </div>
            </div>
            <div style={{ fontSize: 14, color: "var(--t-2)", lineHeight: 1.55 }}>
              Drag rows in this panel to reorder recommendations or move them between concerns. Changes apply live.
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
              <div style={{ flex: 1, borderRadius: 7, border: "1px dashed var(--b-2)", padding: "8px 10px", display: "flex", gap: 8, alignItems: "center" }}>
                <svg width="10" height="14" viewBox="0 0 10 14" fill="var(--t-4)">
                  <circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/>
                  <circle cx="3" cy="7" r="1.4"/><circle cx="7" cy="7" r="1.4"/>
                  <circle cx="3" cy="11" r="1.4"/><circle cx="7" cy="11" r="1.4"/>
                </svg>
                <span style={{ fontSize: 14, color: "var(--t-3)" }}>Drag handle on each row</span>
              </div>
            </div>
            <button
              onClick={onDismissOnboarding}
              style={{ alignSelf: "flex-end", height: 32, padding: "0 18px", background: "var(--blue-600)", color: "#fff", border: "none", borderRadius: 7, cursor: "pointer", fontFamily: "Lato, sans-serif", fontSize: 14, fontWeight: 400, lineHeight: "20px", letterSpacing: "1.12px", textTransform: "uppercase" }}
              onMouseEnter={e => { e.currentTarget.style.background = "var(--blue-700)"; }}
              onMouseLeave={e => { e.currentTarget.style.background = "var(--blue-600)"; }}
            >Got it</button>
          </div>
        </div>
      )}
      <div style={{ padding: "12px 14px 10px", borderBottom: "1px solid var(--b-1)", background: "var(--bg-white)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)" }}>Preview</span>
        <InfoTooltip size={16} align="right" tip="A live view of how this recommendation fits with the rest of the job. Drag rows to reorder or move between concerns." />
      </div>
      <div style={{ padding: "2px 14px 8px", display: "flex", flexDirection: "column" }}>
      {all.map((c, idx) => {
        const p = concernPalette[c.type] || concernPalette.asc_m;
        const isOcc = c.type === "occ";
        // isTarget: liveIsKnown takes exclusive priority so linking to a different concern
        // removes "Current rec" from the original. Fall back to targetInConcerns only when
        // liveState hasn't resolved yet (null = first render before useEffect fires).
        const isTarget = c._liveTarget
          || (liveIsKnown
            ? c === liveConcernInMpi
            : (!liveState && targetInConcerns && c === targetInConcerns));
        const occIdx = isOcc ? occs.indexOf(c) : -1;
        const letter = occIdx >= 0 ? String.fromCharCode(65 + occIdx) : null;
        const visibleRecs = (c.recs || []).filter(r => !editingRecId || r.id !== editingRecId);
        const recsSum = visibleRecs.reduce((s, r) => s + (r.total != null ? Number(r.total) : 0), 0);
        const preApprovedSum = c.preApproved ? (Number(c.preApproved.labor) || 0) + (Number(c.preApproved.parts) || 0) + (Number(c.preApproved.misc) || 0) : 0;
        const concernTotal = recsSum > 0 ? recsSum : preApprovedSum;
        const dotColor = (sk) => sk === "fail" ? "var(--red-600)" : sk === "caution" ? "#F2B91A" : "var(--t-4)";
        const dragHandle = (
          <svg width="8" height="12" viewBox="0 0 10 14" fill="var(--t-4)" style={{ flexShrink: 0, pointerEvents: "none" }}>
            <circle cx="3" cy="3" r="1.3"/><circle cx="7" cy="3" r="1.3"/>
            <circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/>
            <circle cx="3" cy="11" r="1.3"/><circle cx="7" cy="11" r="1.3"/>
          </svg>
        );
        return (
          <div key={c.id} data-pvw-concern-drop={c.id} style={{ padding: "9px 0", borderBottom: idx < all.length - 1 ? "1px solid var(--b-1)" : "none" }}>
            {/* Concern header — label + title + running total, all on one line */}
            <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 5 }}>
              <span style={{ flexShrink: 0, fontSize: 12, fontWeight: 700, color: isOcc ? "var(--occ-strong)" : p.pillT, whiteSpace: "nowrap" }}>
                {isOcc && letter ? "OCC · " + letter : p.label}
              </span>
              <span style={{ flex: 1, minWidth: 0, fontSize: 14, fontWeight: 700, color: "var(--t-1)", lineHeight: 1.35, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{c.title}</span>
              {concernTotal > 0 && <span style={{ flexShrink: 0, fontSize: 14, fontWeight: 700, color: "var(--t-1)", fontVariantNumeric: "tabular-nums" }}>${concernTotal.toFixed(0)}</span>}
            </div>
            {/* All recs (OCC or ASC) — exclude the rec currently being edited (shown as "Editing") */}
            {visibleRecs.map((r) => {
              const sk = typeof r.status === "string" ? r.status : r.status?.kind;
              return (
                <div key={r.id}
                  data-pvw-rec={r.id}
                  data-pvw-concern={c.id}
                  onPointerDown={makeRecDrag(r.id, c.id)}
                  style={{
                    display: "flex", alignItems: "center", gap: 7,
                    padding: "3px 0 3px 2px",
                    cursor: (onReorderRec || onExtractRec) ? "grab" : "default",
                    touchAction: "none", userSelect: "none",
                  }}>
                  {(onReorderRec || onExtractRec) && dragHandle}
                  <span style={{ flexShrink: 0, width: 7, height: 7, borderRadius: 999, background: dotColor(sk), pointerEvents: "none" }} />
                  <span style={{ fontSize: 14, color: "var(--t-2)", flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", pointerEvents: "none" }}>{r.text || r.recommendation}</span>
                </div>
              );
            })}
            {/* Current rec being created — shows live text as user types */}
            {isTarget && (
              <div
                onPointerDown={onChangeLiveTarget ? makeLiveDrag() : undefined}
                style={{
                  display: "flex", alignItems: "center", gap: 7,
                  padding: "3px 0 3px 2px",
                  cursor: onChangeLiveTarget ? "grab" : "default",
                  touchAction: "none", userSelect: "none",
                }}>
                {onChangeLiveTarget && dragHandle}
                <span style={{ flexShrink: 0, width: 7, height: 7, borderRadius: 999, background: dotColor(liveStatus) }} />

              </div>
            )}
          </div>
        );
      })}
      {/* Drop zone — only visible while dragging; drop here to create a new standalone concern */}
      {pvwDragging && (onExtractRec || onChangeLiveTarget) && (
        <div
          data-pvw-dropzone="new"
          style={{
            margin: "6px 8px 8px",
            padding: "12px 16px",
            borderRadius: 7,
            border: "2px dashed var(--b-2)",
            background: "var(--bg-white)",
            color: "var(--t-3)",
            fontSize: 14, fontWeight: 600,
            display: "flex", alignItems: "center", justifyContent: "center", gap: 7,

          <span style={{ pointerEvents: "none" }}>Add a new concern</span>

};

const ConcernCard = ({ concern, onPointStatusChange, onAddRec, onAddCustomRec, onRemoveConcern, onDeleteRec, onRecClick, onTitleChange,
  dragActive, isDragSource, isDragOver, draggingRecId, draggingPointId,
  onRecDragStart, onRecDragEnd, onPointDragStart, onPointDragEnd, onCardDragOver, onCardDragLeave, onCardDrop,
  isFirst, isLast, concerns, onMoveRecTo, onMoveRecRelative, onMovePointTo, onMoveRecToNew, onMovePointToNew,
  canReorder, onReorderConcern, letter, autoRename = false, phase = 1 }) => {
  const p = concernPalette[concern.type];
  const concernTotal = concern.recs.reduce((s, r) => s + (Number(r.total) || 0), 0);
  const preApprovedAmt = concern.preApproved ? ((concern.preApproved.labor || 0) + (concern.preApproved.parts || 0) + (concern.preApproved.misc || 0)) : 0;
  const displayTotal = concernTotal + preApprovedAmt;
  const hasRecs = concern.recs.length > 0;
  // Rec drags are pointer-based now (RecMoveMenu draws its own outline/ghost feedback
  // imperatively), so this banner should only appear for the still-native-DnD point
  // drags. Showing it during a rec drag inserted/removed a block on every other card
  // the instant a drag started, shifting the whole page's layout underneath the
  // cursor mid-drag — which made precise drops (especially reordering next to a
  // nearby row) land in the wrong place.
  const showDropBanner = dragActive && !isDragSource && draggingRecId == null;

  return (
    <div
      data-concern-drop={concern.id}
      data-concern-reorderable={canReorder ? "1" : undefined}
      onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (!isDragSource) onCardDragOver && onCardDragOver(); }}
      onDragLeave={(e) => { if (e.currentTarget.contains(e.relatedTarget)) return; onCardDragLeave && onCardDragLeave(); }}
      onDrop={(e) => { e.preventDefault(); if (!isDragSource) onCardDrop && onCardDrop(); }}
      style={{
        marginBottom: 8,
        border: `1px solid ${isDragOver ? "var(--blue-500)" : "var(--b-2)"}`,
        borderLeft: concern.type === "occ" ? "3px solid var(--blue-600)" : `1px solid ${isDragOver ? "var(--blue-500)" : "var(--b-2)"}`,
        borderRadius: 8,
        overflow: "hidden",
        background: isDragOver ? "var(--blue-50)" : "transparent",
        boxShadow: isDragOver ? "0 0 0 3px rgba(2,103,155,0.16)" : "none",
        transition: "box-shadow 140ms, background 140ms, border-color 140ms",
    }}>
      {showDropBanner && (
        <div style={{
          padding: "6px 14px",
          background: isDragOver ? "var(--blue-100)" : "var(--bg-cream-soft)",
          borderBottom: "1px dashed var(--blue-200)",
          borderRadius: "7px 7px 0 0",
          fontSize: 14, fontWeight: 600, color: "var(--blue-700)",
          display: "flex", alignItems: "center", gap: 6,
        }}>
          <IconPlus size={12} /> Drop here to move into this concern
        </div>

      <ConcernCardHeader
        concern={concern}
        palette={p}
        letter={letter}
        reorderable={canReorder}
        onReorder={(targetId, before) => onReorderConcern && onReorderConcern(targetId, before)}
        onTitleChange={onTitleChange}
        onAddRec={onAddRec}
        total={displayTotal}
        showTotal={hasRecs}
        hasZeroShown={false}
        autoRename={autoRename}
        noLeftBorder={true}
        preApprovedEl={concern.type === "occ" && concern.preApproved
          ? <PreApprovedPill pa={concern.preApproved} concernId={concern.id} concernTitle={concern.title} onRecClick={onRecClick} />
          : null}
        preApprovedTotal={preApprovedAmt}
        style={{
          borderRadius: showDropBanner ? 0 : (hasRecs ? "8px 8px 0 0" : 8),
          borderBottom: hasRecs && !showDropBanner ? "1px solid var(--b-2)" : "none",
        }}
      />



      {concern.recs.map((rec, ri) => {
        const isLastRec = ri === concern.recs.length - 1;
        const mediaPresent = rec.media && (rec.media.photos || rec.media.videos);
        // Badges only (no price) — price gets its own column
        const badgeItems = [

          <PartsTag key="p" parts={rec.partsList} amount={rec.parts} />,
          <span key="int" style={{ display: "inline-flex", opacity: rec.internal ? 1 : 0.4 }}><InternalNoteTag note={rec.internal} /></span>,
        ];
        const _recTotal = rec.total ?? 0;
        const priceEl = (rec.shownToCustomer === 0 && _recTotal > 0)
          ? <span style={{ display: "inline-flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}>
              <span style={{ fontSize: 13, fontWeight: 400, color: "var(--t-4)", textDecoration: "line-through" }}>${_recTotal.toFixed(0)}</span>
              <span style={{ fontSize: 14, fontWeight: 400, color: "var(--red-600)" }}>$0</span>

          : <span style={{ fontSize: 14, fontWeight: 400, color: "var(--t-1)", whiteSpace: "nowrap" }}>${_recTotal.toFixed(0)}</span>;
        return (
        <div key={rec.id}
          data-rec-id={rec.id}
          data-rec-drop={rec.id}
          data-rec-concern={concern.id}

          borderBottom: isLastRec ? "none" : "1px solid var(--b-2)",

          onMouseLeave={(e) => { e.currentTarget.style.background = "var(--bg-white)"; }}
        >

          {/* Drag handle — phase 2 only. Pointer-based (not native HTML5 DnD, which
              proved unreliable) — same mechanism as the Recommendation tab's rows. */}
          {phase === 2 && (
            <div
              style={{
                width: 24, flexShrink: 0, display: "flex", alignItems: "flex-start", justifyContent: "center", paddingTop: 8,
                background: "var(--bg-white)",

              <RecMoveMenu

                selfRecId={rec.id}
                onSelect={(toId) => onMoveRecTo && onMoveRecTo(rec.id, toId)}
                onCreateNew={onMoveRecToNew ? () => onMoveRecToNew(rec.id) : undefined}
                onDropAtRec={(toConcernId, targetRecId, before) => {
                  onMoveRecRelative && onMoveRecRelative(rec.id, toConcernId, targetRecId, before);
                }}
                onDragStart={() => onRecDragStart && onRecDragStart(rec.id)}
                onDragEnd={() => onRecDragEnd && onRecDragEnd()}
              />
            </div>
          )}
          {/* Text column — flex:1 */}
          <div style={{ flex: 1, minWidth: 0, padding: "8px 0 8px 10px" }}>
            <div style={{ fontSize: 14, lineHeight: 1.5, wordBreak: "break-word" }}>
              {rec.status && (() => { const st = REC_STATUS[rec.status]; return st ? (<span style={{ display: "inline-block", verticalAlign: "middle", marginRight: 5, fontSize: 11, fontWeight: 700, padding: "1px 7px", borderRadius: 4, letterSpacing: "0.04em", textTransform: "uppercase", background: st.pillBg, color: st.pillC }}>{st.label}</span>) : null; })()}{rec.extraTag && (<span style={{ display: "inline-block", verticalAlign: "middle", marginRight: 5, fontSize: 14, fontWeight: 500, padding: "1px 7px", borderRadius: 4, background: "var(--bg-white)", color: "var(--t-3)", border: "1px solid var(--b-2)" }}>{rec.extraTag}</span>)}{rec.fresh && <JustAddedTag key={rec.id} />}<span style={{ color: rec.text || rec.recommendation ? "var(--t-1)" : "var(--t-4)", verticalAlign: "middle" }}>{rec.text || rec.recommendation || "No recommendation added"}</span>
            </div>
            {rec.total != null && (
              <div style={{ marginTop: 3, fontSize: 14, color: "var(--t-3)", lineHeight: 1.3 }}>
                {(() => { const m = rec.estSummary && rec.estSummary.match(/^(\d+\.?\d*)\s*hrs?/i); return (m ? m[1] : "0") + " hrs · "; })()}{rec.labor == null ? <span style={{ color: "var(--red-600)", fontWeight: 400 }}>Missing Labor</span> : `Labor $${Number(rec.labor).toFixed(0)}`} · {rec.parts == null ? <span style={{ color: "var(--red-600)", fontWeight: 400 }}>Missing Parts</span> : `Parts $${Number(rec.parts).toFixed(0)}`}
                {Number(rec.misc || 0) > 0 && ` · Misc $${Number(rec.misc).toFixed(0)}`}
              </div>
            )}
          </div>
          {/* Price column — sits before the badge icons */}
          <div style={{ width: 70, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
            {rec.total != null && (
              <span style={{ fontSize: 13.5, fontWeight: 700, color: "var(--t-1)" }}>${Number(rec.total).toFixed(0)}</span>
            )}
          </div>
          {/* 84px zone — badges sit here, aligned with +REC button above */}
          {onAddRec && <div style={{ width: 100, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>{badgeItems}</div>}
        </div>
        );
      })}

    </div>
  );
};

const PassRemainingMenu = ({ compact = false }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);
  const btnStyle = compact
    ? { background: "var(--bg-white)", border: "1px solid var(--b-2)", padding: "4px 10px", borderRadius: 4, fontSize: 11, fontWeight: 700, letterSpacing: 0.04, textTransform: "uppercase", color: "var(--t-2)", display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer" }
    : { height: 34, padding: "0 12px", background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 6, fontSize: 14, fontWeight: 700, letterSpacing: 0.05, textTransform: "uppercase", color: "var(--t-2)", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6 };
  return (
    <div ref={ref} style={{ position: "relative" }} onClick={(e) => e.stopPropagation()}>
      <button style={btnStyle} onClick={() => setOpen(v => !v)}
        onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; }}
        onMouseLeave={e => { e.currentTarget.style.background = "var(--bg-white)"; }}
      >
        Pass remaining
        <span style={{ width: 1, height: compact ? 12 : 16, background: "var(--b-2)", flexShrink: 0, alignSelf: "stretch", margin: compact ? "0 -1px" : "0 -2px" }} />
        <IconChevDown size={compact ? 11 : 11} style={{ transition: "transform 180ms", transform: open ? "rotate(180deg)" : "rotate(0deg)" }} />
      </button>
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", right: 0, zIndex: 300, background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 7, boxShadow: "var(--shadow-modal)", minWidth: 220, overflow: "hidden" }}>
          <div
            onMouseDown={() => setOpen(false)}
            style={{ padding: "9px 14px", fontSize: 14, color: "var(--t-1)", cursor: "pointer" }}
            onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; }}
            onMouseLeave={e => { e.currentTarget.style.background = ""; }}
          >Mark remaining not inspected</div>
        </div>
      )}
    </div>
  );
};

                      const labor = Math.round(price * 0.6 * 100) / 100;

                      const existIdx = next.findIndex(c => c.title?.toLowerCase().trim() === row.concern.toLowerCase().trim());
                      if (existIdx >= 0) {
                        next = next.map((c, i) => i === existIdx ? { ...c, recs: [...c.recs, newRec] } : c);

                        next = [...next, { id: "concern-prev-" + Date.now() + "-" + row.id, type: "asc_m", section: "mpi", title: row.concern, points: [], recs: [newRec] }];
                      }
                    });
                    return next;
                  });

                onMouseEnter={e => e.currentTarget.style.background = "var(--blue-700)"}

                onClick={() => {
                  const selectedRows = groups.flatMap(g => g.rows).filter(r => selected.has(r.id));
                  if (!setConcerns) return;
                  setConcerns(cs => {
                    let next = [...cs];
                    selectedRows.forEach(row => {
                      const basePrice = parseFloat((row.est || "0").replace(/[^0-9.]/g, "")) || 0;
                      const price = Math.round(basePrice * 1.08 * 100) / 100;
                      const hrs = parseFloat((row.labor || "0").split("/")[1] || "0") || 0;
                      const labor = Math.round(price * 0.6 * 100) / 100;
                      const parts = Math.round(price * 0.3 * 100) / 100;
                      const misc = Math.round((price - labor - parts) * 100) / 100;
                      const newRec = { id: "prev-latest-" + row.id + "-" + Date.now(), text: row.rec, recommendation: row.rec, status: "fail", total: price, labor, parts, misc, shownToCustomer: price, estSummary: hrs + " hrs", fresh: true };
                      const existIdx = next.findIndex(c => c.title?.toLowerCase().trim() === row.concern.toLowerCase().trim());
                      if (existIdx >= 0) {
                        next = next.map((c, i) => i === existIdx ? { ...c, recs: [...c.recs, newRec] } : c);
                      } else {
                        next = [...next, { id: "concern-latest-" + Date.now() + "-" + row.id, type: "asc_m", section: "mpi", title: row.concern, points: [], recs: [newRec] }];

                    return next;
                  });

// Click-to-open "move" menu for rec rows — mirrors V3's MoveMenu.
// Click opens a concern picker; press-and-drag moves across concerns or reorders within one.
const RecMoveMenu = ({ concerns, currentConcernId, selfRecId, onSelect, onCreateNew, onDragStart, onDragEnd, onDropAtRec }) => {
  const [open, setOpen] = React.useState(false);
  const [menuPos, setMenuPos] = React.useState({ top: 0, left: 0 });
  const ref = React.useRef(null);
  const btnRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const justDraggedRef = React.useRef(false);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const targets = concerns.filter((c) => c.id !== currentConcernId);
  const isDraggable = !!onDragStart;

  const clearHot = (st) => {
    if (!st) return;
    if (st.hotEl) {
      st.hotEl.style.outline = "";
      st.hotEl.style.outlineOffset = "";
      st.hotEl.style.background = st.hotPrevBg || "";
      st.hotEl = null; st.hotPrevBg = null;
    }
    if (st.line) { st.line.remove(); st.line = null; }
    st.mode = null; st.dropConcernId = null; st.dropRecId = null; st.dropBefore = false;
  };

  const onPointerDown = (e) => {
    if (!isDraggable || e.button !== 0) return;
    justDraggedRef.current = false;
    const st = { startX: e.clientX, startY: e.clientY, dragging: false, ghost: null, line: null, hotEl: null, hotPrevBg: null, mode: null, dropConcernId: null, dropRecId: null, dropBefore: false };
    dragRef.current = st;

    const move = (ev) => {
      const dx = ev.clientX - st.startX, dy = ev.clientY - st.startY;
      if (!st.dragging) {
        if (Math.hypot(dx, dy) < 5) return;
        st.dragging = true;
        setOpen(false);
        onDragStart && onDragStart();
        const g = document.createElement("div");
        g.textContent = onDropAtRec ? "Drag to reorder or move" : "Drop on a concern to move";
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:6px 10px;border-radius:6px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:nowrap;";
        document.body.appendChild(g);
        st.ghost = g;
        document.body.style.cursor = "grabbing";
        document.body.style.userSelect = "none";
      }
      st.ghost.style.transform = `translate(${ev.clientX + 14}px, ${ev.clientY + 14}px)`;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "block";
      const closest = (sel) => (under && under.closest ? under.closest(sel) : null);
      let recRow = onDropAtRec ? closest("[data-rec-drop]") : null;
      // Ignore hits on the row being dragged itself — it never leaves the DOM during
      // a manual pointer drag (only fades to 40% opacity in place), so hovering back
      // over your own row is extremely easy to do by accident. Treating that as a
      // valid drop target used to silently reorder a rec relative to itself.
      if (recRow && selfRecId && recRow.getAttribute("data-rec-drop") === selfRecId) recRow = null;
      const card = !recRow ? closest("[data-concern-drop]") : null;
      clearHot(st);
      if (recRow) {
        const rect = recRow.getBoundingClientRect();
        const before = ev.clientY < rect.top + rect.height / 2;
        st.mode = "rec";
        st.dropConcernId = recRow.getAttribute("data-rec-concern");
        st.dropRecId = recRow.getAttribute("data-rec-drop");
        st.dropBefore = before;
        const line = document.createElement("div");
        line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:2.5px;border-radius:2px;background:#02679B;box-shadow:0 0 0 1px rgba(2,103,155,.2);";
        line.style.left = rect.left + "px";
        line.style.width = rect.width + "px";
        line.style.top = ((before ? rect.top : rect.bottom) - 1) + "px";
        document.body.appendChild(line);
        st.line = line;
      } else if (card) {
        const cid = card.getAttribute("data-concern-drop");
        if (cid !== currentConcernId) {
          st.mode = "card"; st.dropConcernId = cid;
          st.hotEl = card; st.hotPrevBg = card.style.background;
          card.style.outline = "2px solid var(--blue-500)"; card.style.outlineOffset = "-2px";
          card.style.background = "var(--blue-50)";
        }
      }
    };

    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      const mode = st.mode, dc = st.dropConcernId, dr = st.dropRecId, db = st.dropBefore;
      clearHot(st);
      if (st.dragging) {
        justDraggedRef.current = true;
        onDragEnd && onDragEnd();
        if (mode === "rec" && onDropAtRec) onDropAtRec(dc, dr, db);
        else if (mode === "card" && dc) onSelect(dc);
      }
      dragRef.current = null;
    };

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div ref={ref} style={{ position: "relative", flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
      <div
        role="button"
        tabIndex={0}
        ref={btnRef}
        onPointerDown={isDraggable ? onPointerDown : undefined}
        onClick={(e) => { e.stopPropagation(); if (justDraggedRef.current) { justDraggedRef.current = false; return; } if (!open && btnRef.current) { const r = btnRef.current.getBoundingClientRect(); setMenuPos({ top: r.bottom + 6, left: r.left }); } setOpen((o) => !o); }}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen((o) => !o); } }}
        title={isDraggable ? "Click to pick a concern, or drag to another concern" : "Move to another concern"}
        style={{
          width: 24, height: 24, borderRadius: 5,
          background: open ? "var(--bg-cream)" : "transparent",
          border: "none",
          color: "var(--t-3)", cursor: isDraggable ? "grab" : "pointer",
          display: "grid", placeItems: "center", touchAction: "none",
        }}
        onMouseEnter={(e) => { if (!open) { e.currentTarget.style.background = "var(--bg-cream)"; } }}
        onMouseLeave={(e) => { if (!open) { e.currentTarget.style.background = "transparent"; } }}
      >
        <IconMove size={15} />
      </div>

      {/* Fixed (not absolute) positioning, computed from the button's own bounding rect —
          this menu lives inside a concern card that clips overflow, so an absolutely-
          positioned dropdown anchored to that ancestor got cut off at the card's edge. */}
      {open && (
        <div style={{
          position: "fixed", left: menuPos.left, top: menuPos.top,
          width: 300,
          background: "var(--bg-white)",
          border: "1px solid var(--b-2)",
          borderRadius: 8,
          boxShadow: "var(--shadow-modal)",
          zIndex: 9999,
          padding: "6px 0", maxHeight: 340, overflowY: "auto",
          animation: "menuIn 140ms cubic-bezier(.2,.8,.2,1)",
        }} className="scrollable">
          <div style={{ padding: "8px 14px 4px", fontSize: 11, fontWeight: 600, letterSpacing: 0.08, textTransform: "uppercase", color: "var(--t-4)" }}>
            Link to a concern
          </div>
          {targets.map((c) => {
            const cp = concernPalette[c.type] || concernPalette.asc_m;
            return (
              <button
                key={c.id}
                onClick={(e) => { e.stopPropagation(); setOpen(false); onSelect(c.id); }}
                style={{
                  width: "100%", display: "flex", gap: 10, alignItems: "flex-start",
                  padding: "9px 14px", background: "transparent",
                  border: "none", cursor: "pointer", textAlign: "left",
                }}
                onMouseEnter={(e) => e.currentTarget.style.background = "var(--bg-cream)"}
                onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}
              >
                {cp.label === "OCC" && (
                  <span className="pill occ" style={{ marginTop: 2 }}>{cp.label}</span>
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ fontSize: 14, color: "var(--t-1)", fontWeight: 500 }}>{c.title}</span>
                </div>
              </button>
            );
          })}
          {onCreateNew && (
            <>
              <div style={{ height: 1, background: "var(--b-1)", margin: "4px 14px" }} />
              <button
                onClick={(e) => { e.stopPropagation(); setOpen(false); onCreateNew(); }}

const DecisionProgressPanel = ({ recApprovals, items }) => {
  const allRecs = items.flatMap(c => c.recs);
  const total = allRecs.reduce((s, r) => s + (r.total || 0), 0);
  const approvedRecs = allRecs.filter(r => recApprovals.get(r.id) === "approved");
  const declinedRecs = allRecs.filter(r => recApprovals.get(r.id) === "declined");
  const awaitingRecs  = allRecs.filter(r => recApprovals.get(r.id) == null);
  const approved   = approvedRecs.reduce((s, r) => s + (r.total || 0), 0);
  const declined   = declinedRecs.reduce((s, r) => s + (r.total || 0), 0);
  const awaitingAmt = awaitingRecs.reduce((s, r) => s + (r.total || 0), 0);
  const approvedPct = total > 0 ? (approved / total) * 100 : 0;
  const declinedPct = total > 0 ? (declined / total) * 100 : 0;
  const decidedCount = approvedRecs.length + declinedRecs.length;
  const totalCount   = allRecs.length;
  const zeroShown = approvedRecs.filter(r => r.shownToCustomer === 0 && (r.total || 0) > 0);
  const fmt = n => `$${Number(n).toFixed(2)}`;
  return (
    <div style={{ width: 230, flexShrink: 0, display: "flex", flexDirection: "column", gap: 10 }}>
      <div style={{ background: "var(--bg-white)", border: "1px solid var(--b-1)", borderRadius: 10, padding: "14px 16px", boxShadow: "var(--shadow-card)" }}>
        <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: "0.09em", textTransform: "uppercase", color: "var(--t-4)", marginBottom: 10 }}>Decision Progress</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 10 }}>
          <span style={{ fontSize: 26, fontWeight: 800, color: "var(--t-1)", fontVariantNumeric: "tabular-nums", letterSpacing: "-0.01em" }}>${Math.round(approved).toLocaleString()}</span>
          <span style={{ fontSize: 14, color: "var(--t-4)", fontWeight: 500 }}>approved of ${Math.round(total).toLocaleString()}</span>
        </div>
        <div style={{ height: 8, borderRadius: 999, background: "var(--b-1)", overflow: "hidden", display: "flex", marginBottom: 12 }}>
          <div style={{ width: `${approvedPct}%`, background: "var(--green-500)", transition: "width 300ms" }} />
          <div style={{ width: `${declinedPct}%`, background: "var(--red-500)", transition: "width 300ms" }} />
        </div>
        {[
          { label: "Approved", recs: approvedRecs, amount: approved, color: "var(--green-700)", dot: "var(--green-500)" },
          { label: "Declined", recs: declinedRecs, amount: declined, color: "var(--red-600)", dot: "var(--red-500)" },
          { label: "Awaiting", recs: awaitingRecs, amount: awaitingAmt, color: "var(--t-4)", dot: "var(--b-3)" },
        ].map(row => (
          <div key={row.label} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 5 }}>
            <span style={{ width: 7, height: 7, borderRadius: 999, background: row.dot, flexShrink: 0 }} />
            <span style={{ flex: 1, fontSize: 14, color: row.color, fontWeight: 600 }}>{row.label} · {row.recs.length}</span>
            <span style={{ fontSize: 14, fontWeight: 700, color: "var(--t-2)", fontVariantNumeric: "tabular-nums" }}>{fmt(row.amount)}</span>
          </div>
        ))}
        <div style={{ height: 1, background: "var(--b-1)", margin: "10px 0" }} />
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontSize: 14, color: "var(--t-3)", fontWeight: 500 }}>Decided</span>
          <span style={{ fontSize: 14, fontWeight: 700, color: "var(--t-2)" }}>{decidedCount} of {totalCount} recommendations</span>
        </div>
      </div>
      {zeroShown.length > 0 && (
        <div style={{ background: "#FFFBEB", border: "1px solid #F3DDA1", borderRadius: 8, padding: "10px 12px" }}>
          <div style={{ display: "flex", gap: 8 }}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#92400e" strokeWidth="2" style={{ flexShrink: 0, marginTop: 1 }}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#92400e", marginBottom: 2 }}>{zeroShown.length} priced {zeroShown.length === 1 ? "item" : "items"} showing $0 to the customer</div>
              <div style={{ fontSize: 14, color: "#b45309", lineHeight: 1.4 }}>Review before sending — the customer won't see these prices.</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
