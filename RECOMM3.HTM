const MPIPage = () => {
  const [concerns, setConcerns] = React.useState(initialConcerns);
  const [recConcerns, setRecConcerns] = React.useState(initialRecConcerns);
  const [sections, setSections] = React.useState(initialSections);
  const [tab, setTab] = React.useState("rec");
  const [mpiFilter, setMpiFilter] = React.useState("all");
  const [concernsFilter, setConcernsFilter] = React.useState("all");
  const [concernsOpen, setConcernsOpen] = React.useState(true);
  const [sidebarOpen, setSidebarOpen] = React.useState(false);
  const [modal, setModal] = React.useState(null); // { context }
  const [modalLive, setModalLive] = React.useState(null); // live preview state from RecEditorModal
  const [pendingRecJump, setPendingRecJump] = React.useState(null); // jump-to-another-rec request from the live preview panel
  const [editorVariant, setEditorVariant] = React.useState("panel"); // "modal" | "panel"
  const [toast, setToast] = React.useState(null);
  const toastTimer = React.useRef(null);
  const mpiScrollRef = React.useRef(null);
  const [newCustomConcernId, setNewCustomConcernId] = React.useState(null);
  const [custPreview, setCustPreview] = React.useState(false);
  const [pvwCollapsed, setPvwCollapsed] = React.useState(false);
  const [phase, setPhase] = React.useState(2);
  const [pvwOnboardingDone, setPvwOnboardingDone] = React.useState(false);
  const [panelWidth, setPanelWidth] = React.useState(null); // null = responsive default; explicit px once the user drags the resize handle
  const PANEL_MIN_WIDTH = 512; // 20% narrower than the previous 640px floor, so the panel can shrink further on a small screen
  const PANEL_MAX_WIDTH = 1900;
  const PREVIEW_WIDTH = 330; // Recommendations Preview column is always this fixed width — only the editor grows/shrinks
  const startPanelResize = (e) => {
    e.preventDefault();
    const startX = e.clientX;
    const startWidth = panelWidth || Math.min(PANEL_MAX_WIDTH, Math.max(PANEL_MIN_WIDTH, window.innerWidth - 300));
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    const move = (ev) => {
      // Panel is docked to the right edge, so dragging left (negative delta) widens it.
      const delta = startX - ev.clientX;
      const next = Math.min(PANEL_MAX_WIDTH, Math.max(PANEL_MIN_WIDTH, startWidth + delta));
      setPanelWidth(next);
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };
  // When the user has explicitly dragged the panel to a width, collapsing the recommendations
  // preview should free up that space by narrowing the whole panel — not by stretching the
  // editor into it — so re-derive the rendered width from the dragged width here.
  const effectivePanelWidth = panelWidth && (phase === 2 && pvwCollapsed)
    ? Math.max(PANEL_MIN_WIDTH, panelWidth - PREVIEW_WIDTH)
    : panelWidth;
  // Measure the actual rendered width of the side panel (whatever it currently is — dragged,
  // responsive default, preview shown/collapsed) so the page content behind it can reflow to
  // fill exactly the remaining visible width instead of staying full-width and getting covered.
  const panelBoxRef = React.useRef(null);
  const [visiblePanelWidth, setVisiblePanelWidth] = React.useState(0);
  React.useEffect(() => {
    if (!modal || editorVariant !== "panel") { setVisiblePanelWidth(0); return; }
    const el = panelBoxRef.current;
    if (!el) return;
    const ro = new ResizeObserver((entries) => {
      for (const entry of entries) setVisiblePanelWidth(entry.contentRect.width);
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [modal, editorVariant, phase, pvwCollapsed, panelWidth]);
  // Re-render on window resize so the clamp below stays accurate as the viewport changes.
  const [, forceViewportTick] = React.useReducer(x => x + 1, 0);
  React.useEffect(() => {
    const onResize = () => forceViewportTick();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  // Reflowing the page content by the panel's full width can, on narrower windows, squeeze the
  // content well past what its own fixed-width columns need — that doesn't truncate gracefully,
  // it corrupts text wrapping. Cap how much room we cede to the panel so the content area never
  // drops below a sane working width; beyond that the panel's own translucent edge may cover a
  // sliver of it rather than mangling the layout.
  const MIN_CONTENT_WIDTH = 760; // slightly narrower floor so the background page can shrink a bit more on small screens, ceding more room to the panel
  const appliedPanelMargin = Math.max(0, Math.min(visiblePanelWidth, window.innerWidth - MIN_CONTENT_WIDTH));

  const addCustomConcernFromToolbar = React.useCallback(() => {
    const newId = "custom-" + Date.now();
    setConcerns((cs) => [...cs, { id: newId, section: "mpi", type: "asc_m", title: "New concern", points: [], recs: [] }]);
    setNewCustomConcernId(newId);
    // Scroll to bottom after state update
    setTimeout(() => {
      if (mpiScrollRef.current) {
        mpiScrollRef.current.scrollTo({ top: mpiScrollRef.current.scrollHeight, behavior: "smooth" });
      }
    }, 50);
  }, []);

  React.useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && modal) setModal(null); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [modal]);

  const showToast = (msg, onView) => {
    if (toastTimer.current) { clearTimeout(toastTimer.current); toastTimer.current = null; }
    const duration = onView ? 10000 : 2400;
    setToast({ msg, onView: onView || null, duration, startedAt: Date.now() });
    toastTimer.current = setTimeout(() => setToast(null), duration);
  };

  // ── Status change on a concern point
  const setConcernPointStatus = (concernId, pointId, status) => {
    setConcerns((cs) => cs.map((c) =>
      c.id !== concernId ? c : { ...c, points: c.points.map((p) => p.id === pointId ? { ...p, status } : p) }
    ));
    if (status === "fail" || status === "caution") {
      const c = concerns.find((x) => x.id === concernId);
      const pt = c?.points.find((x) => x.id === pointId);
      if (pt) {
        const newConcernId = "asc-" + Date.now();
        setConcerns((cs) => [...cs, { id: newConcernId, section: "mpi", type: "asc_m", title: pt.name, points: [], recs: [] }]);
        openModalFor({
          inspectionPoint: pt.name,
          inspectionDetail: c.title,
          inspectionResult: status === "fail" ? "failed" : "caution",
          targetConcernId: newConcernId,
          targetPointId: pointId,
        });
      }
    }
  };

  // ── Status change on an MPI inspection section point
  const setSectionPointStatus = (sectionId, pointId, status) => {
    setSections((ss) => ss.map((s) =>
      s.id !== sectionId ? s : { ...s, points: s.points.map((p) => p.id === pointId ? { ...p, status } : p) }
    ));
    if (status === "fail" || status === "caution") {
      const s = sections.find((x) => x.id === sectionId);
      const pt = s?.points.find((x) => x.id === pointId);
      if (pt) {
        openModalFor({
          inspectionPoint: pt.name,
          inspectionDetail: s.title.replace(/^MPI: /, ""),
          inspectionResult: status === "fail" ? "failed" : "caution",
          targetSectionId: sectionId,
          targetPointId: pointId,
          targetConcernId: "mpi:" + pointId,
        });
      }
    }
  };

  // ── Tire tread reading set on the MPI page. Updates the per-position reading,
  // derives the worst-case status, and opens the modal (with the tire section)
  // when a reading lands in fail/caution territory.
  const setSectionTireReading = (sectionId, pointId, pos, value) => {
    const s = sections.find((x) => x.id === sectionId);
    const pt = s?.points.find((x) => x.id === pointId);
    if (!pt) return;

    if (pos === "__ni__") {
      setSections((ss) => ss.map((x) => x.id !== sectionId ? x : {
        ...x, points: x.points.map((p) => p.id !== pointId ? p : { ...p, status: "ni" }),
      }));
      return;
    }

    const newReadings = { ...(pt.readings || {}), [pos]: value };
    const derived = tireWorstGrade(newReadings);
    setSections((ss) => ss.map((x) => x.id !== sectionId ? x : {
      ...x, points: x.points.map((p) => p.id !== pointId ? p : { ...p, readings: newReadings, status: derived }),
    }));

    const g = defaultGradeOf(value);
    if (g === "fail" || g === "caution") {
      openModalFor({
        inspectionPoint: pt.name,
        inspectionDetail: s.title.replace(/^MPI: /, ""),
        inspectionResult: g === "fail" ? "failed" : "caution",
        targetSectionId: sectionId,
        targetPointId: pointId,
        targetConcernId: "mpi:" + pointId,
        tire: { readings: newReadings, unit: pt.unit || "mm" },
      });
    }
  };

  // ── Tire reading edited from inside the modal — sync back to the section
  const updateTireReading = (pos, value) => {
    if (!modal || !modal.targetSectionId || !modal.targetPointId) return;
    setSections((ss) => ss.map((x) => x.id !== modal.targetSectionId ? x : {
      ...x, points: x.points.map((p) => {
        if (p.id !== modal.targetPointId) return p;
        const nr = { ...(p.readings || {}), [pos]: value };
        return { ...p, readings: nr, status: tireWorstGrade(nr) };
      }),
    }));
  };

  // ── Add rec from concern card
  const addRecToConcern = (concernId, preLinked = true) => {
    const c = concerns.find((x) => x.id === concernId) || recConcerns.find((x) => x.id === concernId);
    openModalFor({
      inspectionPoint: c?.title || "New recommendation",
      inspectionDetail: "",
      inspectionResult: null,
      isNewRec: true,
      targetConcernId: concernId,
      preLinked,
    });
  };

  // ── Add a custom (one-off) rec from the concern's ⋮ menu
  const addCustomRecToConcern = (concernId) => {
    const c = concerns.find((x) => x.id === concernId);
    openModalFor({
      inspectionPoint: "Custom recommendation",
      inspectionDetail: c?.title || "",
      inspectionResult: "failed",
      isNewRec: true,
      targetConcernId: concernId,
    });
  };

  // ── Remove a whole concern from the ⋮ menu
  const removeConcern = (concernId) => {
    const c = concerns.find((x) => x.id === concernId);
    setConcerns((cs) => cs.filter((x) => x.id !== concernId));
    showToast(`Removed "${c?.title || "concern"}"`);
  };

  // ── Delete a single rec from a concern
  const deleteRec = (recId, concernId) => {
    let recText = "";
    setConcerns((cs) => {
      const updated = cs.map((c) => {
        if (c.id !== concernId) return c;
        const rec = c.recs.find((r) => r.id === recId);
        recText = rec?.text || "recommendation";
        return { ...c, recs: c.recs.filter((r) => r.id !== recId) };
      });
      return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
    });
    setRecConcerns((cs) => {
      const updated = cs.map((c) => c.id === concernId ? { ...c, recs: c.recs.filter((r) => r.id !== recId) } : c);
      return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
    });
    showToast(`Deleted "${recText}"`);
  };

  // ── Drag a rec into a different concern grouping
  const [drag, setDrag] = React.useState(null);          // { fromConcernId, recId }
  const [dragOverConcernId, setDragOverConcernId] = React.useState(null);

  const moveRecToConcern = (recId, fromConcernId, toConcernId) => {
    if (!recId || fromConcernId === toConcernId) return;
    let movedRec = null;
    let toTitle = "";
    setConcerns((cs) => {
      const from = cs.find((c) => c.id === fromConcernId);
      movedRec = from && from.recs.find((r) => r.id === recId);
      if (!movedRec) return cs;
      const target = cs.find((c) => c.id === toConcernId);
      toTitle = target ? target.title : "";
      const updated = cs.map((c) => {
        if (c.id === fromConcernId) return { ...c, recs: c.recs.filter((r) => r.id !== recId) };
        if (c.id === toConcernId)   return { ...c, recs: [...c.recs, { ...movedRec, fresh: true }] };
        return c;
      });
      return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
    });
    setRecConcerns((cs) => {
      const updated = cs.map((c) => c.id === fromConcernId ? { ...c, recs: c.recs.filter((r) => r.id !== recId) } : c);
      return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
    });
    if (movedRec) {
      showToast(`Moved "${movedRec.text}" to "${toTitle}"`);
      setTimeout(() => {
        setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map((r) => r.id === recId ? { ...r, fresh: false } : r) })));
      }, 3000);
    }
  };

  // ── Drop a rec next to a specific rec — reorders within a concern, or
  //    inserts at a precise position when crossing concerns.
  const moveRecRelativeTo = (recId, fromConcernId, toConcernId, targetRecId, before) => {
    if (!recId || recId === targetRecId) return;
    const sameConcern = fromConcernId === toConcernId;
    let movedRec = null;
    let toTitle = "";
    setConcerns((cs) => {
      const from = cs.find((c) => c.id === fromConcernId);
      movedRec = from && from.recs.find((r) => r.id === recId);
      if (!movedRec) return cs;
      const target = cs.find((c) => c.id === toConcernId);
      toTitle = target ? target.title : "";
      const insertRec = sameConcern ? movedRec : { ...movedRec, fresh: true };
      const updated = cs.map((c) => {
        if (c.id !== fromConcernId && c.id !== toConcernId) return c;
        let recs = c.recs;
        if (c.id === fromConcernId) recs = recs.filter((r) => r.id !== recId);
        if (c.id === toConcernId) {
          const idx = recs.findIndex((r) => r.id === targetRecId);
          const at = idx === -1 ? recs.length : (before ? idx : idx + 1);
          recs = [...recs.slice(0, at), insertRec, ...recs.slice(at)];
        }
        return { ...c, recs };
      });
      return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
    });
    if (!sameConcern) {
      setRecConcerns((cs) => {
        const updated = cs.map((c) => c.id === fromConcernId ? { ...c, recs: c.recs.filter((r) => r.id !== recId) } : c);
        return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
      });
    }
    if (movedRec && !sameConcern) {
      showToast(`Moved "${movedRec.text}" to "${toTitle}"`);
      setTimeout(() => {
        setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map((r) => r.id === recId ? { ...r, fresh: false } : r) })));
      }, 3000);
    }
  };

  // ── Reorder ASC concern cards (OCCs stay put — they're never draggable).
  const moveConcernRelativeTo = (dragId, targetId, before) => {
    if (!dragId || dragId === targetId) return;
    setConcerns((cs) => {
      const dragC = cs.find((c) => c.id === dragId);
      if (!dragC || dragC.type === "occ") return cs;
      const without = cs.filter((c) => c.id !== dragId);
      const idx = without.findIndex((c) => c.id === targetId);
      if (idx === -1) return cs;
      const at = before ? idx : idx + 1;
      return [...without.slice(0, at), dragC, ...without.slice(at)];
    });
  };

  const [dragOverNew, setDragOverNew] = React.useState(false);

  // ── Reorder / move recs in the Recommendations preview panel (Phase 2 modal)
  const reorderRecInModal = (fromCId, recId, toCId, targetId, before) => {
    // ModalContextPreview renders its rows from `concerns` (the Edit MPI dataset — see the
    // "sole source of truth" comment in that component), so the drag must update `concerns`
    // for the preview to visibly reflect the reorder/move. Previously this only updated
    // `recConcerns`, which the preview never reads, so dragging looked like it did nothing.
    let movedRec = null;
    let fromTitle = null, fromType = null;
    setConcerns(list => {
      if (fromCId === toCId) {
        return list.map(c => {
          if (c.id !== fromCId) return c;
          fromTitle = c.title; fromType = c.type;
          const recs = c.recs.slice();
          const fromIdx = recs.findIndex(r => r.id === recId);
          if (fromIdx < 0) return c;
          const [moved] = recs.splice(fromIdx, 1);
          movedRec = moved;
          const toIdx = targetId ? recs.findIndex(r => r.id === targetId) : -1;
          if (toIdx >= 0) recs.splice(before ? toIdx : toIdx + 1, 0, moved);
          else recs.push(moved);
          return { ...c, recs };
        });
      } else {
        let moved = null;
        const next = list.map(c => {
          if (c.id === fromCId) {
            fromTitle = c.title; fromType = c.type;
            moved = c.recs.find(r => r.id === recId);
            return { ...c, recs: c.recs.filter(r => r.id !== recId) };
          }
          return c;
        }).map(c => {
          if (c.id === toCId && moved) {
            const recs = c.recs.slice();
            const toIdx = targetId ? recs.findIndex(r => r.id === targetId) : -1;
            if (toIdx >= 0) recs.splice(before ? toIdx : toIdx + 1, 0, moved);
            else recs.push(moved);
            return { ...c, recs };
          }
          return c;
        });
        movedRec = moved;
        return next;
      }
    });
    // Best-effort mirror into recConcerns (Recommendation tab's separate dataset) so the two
    // stay roughly in sync. IDs differ between the two arrays, so match by title/type — same
    // approach used elsewhere (e.g. moveMpiPointToConcern) when bridging the two datasets.
    if (movedRec) {
      setRecConcerns(list => {
        const rcFrom = list.find(c => c.title === fromTitle && c.type === fromType);
        const toC = concerns.find(c => c.id === toCId);
        const rcTo = toC ? list.find(c => c.title === toC.title && c.type === toC.type) : null;
        if (!rcFrom) return list;
        const rcRec = rcFrom.recs.find(r => r.id === recId || r.recommendation === movedRec.recommendation);
        if (!rcRec) return list;
        if (rcFrom === rcTo || !rcTo) {
          // Same concern (or no resolvable target) — reorder within rcFrom
          return list.map(c => {
            if (c !== rcFrom) return c;
            const recs = c.recs.slice();
            const fromIdx = recs.findIndex(r => r === rcRec);
            if (fromIdx < 0) return c;
            recs.splice(fromIdx, 1);
            recs.push(rcRec);
            return { ...c, recs };
          });
        }
        return list.map(c => {
          if (c === rcFrom) return { ...c, recs: c.recs.filter(r => r !== rcRec) };
          if (c === rcTo) return { ...c, recs: [...c.recs, rcRec] };
          return c;
        });
      });
    }
  };

  // ── Extract a rec from the preview panel into a new standalone concern
  // Called when the user drags a rec row from ModalContextPreview onto the "new concern" drop zone.
  const extractRecFromPreview = (concernId, recId) => {
    const newId = "custom-" + Date.now();
    // Find in concerns (MPI tab state)
    const fromC = concerns.find(c => c.id === concernId);
    const rec = fromC?.recs.find(r => r.id === recId);
    let needsRename = false;
    if (rec) {
      const isCustomFrom = fromC.type === "custom";
      const newTitle = isCustomFrom ? (rec.text || rec.recommendation || "New concern") : fromC.title;
      needsRename = isCustomFrom;
      setConcerns(cs => {
        const updated = cs.map(c => c.id === concernId ? { ...c, recs: c.recs.filter(r => r.id !== recId) } : c);
        const filtered = updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
        return [...filtered, { id: newId, type: "custom", title: newTitle, points: [], recs: [{ ...rec, fresh: true }] }];
      });
    }
    // Mirror into recConcerns (Rec tab state) using same newId for consistency
    setRecConcerns(cs => {
      const fromR = cs.find(c => c.id === concernId);
      const rRec = fromR?.recs.find(r => r.id === recId);
      if (!fromR || !rRec) return cs;
      const isCustomFrom = fromR.type === "custom";
      const newTitle = isCustomFrom ? (rRec.recommendation || rRec.text || "New concern") : fromR.title;
      const updated = cs.map(c => c.id === concernId ? { ...c, recs: c.recs.filter(r => r.id !== recId) } : c);
      const filtered = updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
      return [...filtered, { id: newId, section: "mpi", type: "custom", title: newTitle, points: [], recs: [{ ...rRec, fresh: true }] }];
    });
    // If source was a custom concern, open the title field on the new concern in Edit MPI
    if (needsRename) setNewCustomConcernId(newId);
    showToast(`Moved to new standalone concern`);
  };

  // ── Move an MPI inspection point into a concern grouping (manual drag only)
  const moveMpiPointToConcern = (sectionId, pointId, toConcernId) => {
    const sec = sections.find((s) => s.id === sectionId);
    const pt = sec?.points.find((p) => p.id === pointId);
    if (!pt) return;
    const toC = concerns.find((c) => c.id === toConcernId);

    // Find the auto-created ASC concern for this point (matched by title)
    const fromC = concerns.find((c) => c.type === "asc_m" && c.title === pt.name);
    const existingRec = fromC?.recs?.[0];

    if (fromC && existingRec) {
      // Move the existing rec out of its auto-created concern into the target
      const recId = existingRec.id;
      setConcerns((cs) => cs.map((c) => {
        if (c.id === fromC.id) return { ...c, recs: c.recs.filter((r) => r.id !== recId) };
        if (c.id === toConcernId) return { ...c, recs: [...c.recs, { ...existingRec, fresh: true }] };
        return c;
      }));
      // Mirror move in recConcerns (match source by title since IDs may differ)
      setRecConcerns((cs) => {
        const rcFrom = cs.find((c) => c.type === "asc_m" && c.title === pt.name);
        const rcRec = rcFrom?.recs?.[0];
        if (!rcFrom || !rcRec) return cs;
        return cs.map((c) => {
          if (c.id === rcFrom.id) return { ...c, recs: c.recs.filter((r) => r.id !== rcRec.id) };
          if (c.id === toConcernId) return { ...c, recs: [...c.recs, { ...rcRec, fresh: true }] };
          return c;
        });
      });
      setTimeout(() => {
        setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map((r) => r.id === recId ? { ...r, fresh: false } : r) })));
        setRecConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map((r) => r.id === recId ? { ...r, fresh: false } : r) })));
      }, 3000);
    } else {
      // No existing rec yet — create one (point marked fail but not yet saved through modal)
      const newRecId = "r-" + Date.now();
      const newRec = {
        id: newRecId, text: pt.name, total: null,
        status: { kind: pt.status === "caution" ? "caution" : "fail" },
        fresh: true, fromMpi: true,
      };
      setConcerns((cs) => cs.map((c) => c.id !== toConcernId ? c : { ...c, recs: [...c.recs, newRec] }));
      setTimeout(() => {
        setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map((r) => r.id === newRecId ? { ...r, fresh: false } : r) })));
      }, 3000);
    }

    // Keep the form row visible, mark as manually linked so AddedToTag shows
    const addedTo = toC ? { type: toC.type === "occ" ? "occ" : "asc-cos", label: toC.type === "occ" ? "OCC" : "ASC", title: toC.title } : null;
    setSections((ss) => ss.map((s) => s.id !== sectionId ? s : { ...s, points: s.points.map((p) => p.id !== pointId ? p : { ...p, addedTo, linkedManually: true }) }));
    showToast(`Moved "${pt.name}" to "${toC ? toC.title : "concern"}"`);
  };

  // ── Move a concern's inspection point into another concern grouping
  const moveConcernPointToConcern = (fromConcernId, pointId, toConcernId) => {
    if (fromConcernId === toConcernId) return;
    const from = concerns.find((c) => c.id === fromConcernId);
    const pt = from?.points.find((p) => p.id === pointId);
    if (!pt) return;
    const toC = concerns.find((c) => c.id === toConcernId);
    const moved = { ...pt, fresh: true };
    setConcerns((cs) => cs.map((c) => {
      if (c.id === fromConcernId) return { ...c, points: c.points.filter((p) => p.id !== pointId) };
      if (c.id === toConcernId)   return { ...c, points: [...c.points, moved] };
      return c;
    }));
    showToast(`Moved "${pt.name}" to "${toC ? toC.title : "concern"}"`);
    setTimeout(() => {
      setConcerns((cs) => cs.map((c) => ({ ...c, points: c.points.map((p) => p.id === pointId ? { ...p, fresh: false } : p) })));
    }, 3000);
  };

  // ── Drop an MPI point (or rec) onto the "Add new concern" zone → new custom concern
  const createConcernFromDrag = (d) => {
    if (!d) return;
    const newId = "custom-" + Date.now();
    if (d.kind === "mpiPoint") {
      const sec = sections.find((s) => s.id === d.fromSectionId);
      const pt = sec?.points.find((p) => p.id === d.pointId);
      if (!pt) return;
      setSections((ss) => ss.map((s) => s.id !== d.fromSectionId ? s : { ...s, points: s.points.filter((p) => p.id !== d.pointId) }));
      setConcerns((cs) => [...cs, {
        id: newId, type: "custom", title: pt.name,
        points: [{ ...pt, kind: pt.kind || "MPI", fresh: true }], recs: [],
      }]);
      showToast(`New concern created from "${pt.name}"`);
    } else if (d.kind === "concernPoint") {
      const from = concerns.find((c) => c.id === d.fromConcernId);
      const pt = from?.points.find((p) => p.id === d.pointId);
      if (!pt) return;
      setConcerns((cs) => [

        ...cs.map((c) => c.id === d.fromConcernId ? { ...c, points: c.points.filter((p) => p.id !== d.pointId) } : c),
        { id: newId, type: "custom", title: pt.name, points: [{ ...pt, fresh: true }], recs: [] },
      ]);
      showToast(`New concern created from "${pt.name}"`);
    } else if (d.recId) {
      const from = concerns.find((c) => c.id === d.fromConcernId);
      const rec = from?.recs.find((r) => r.id === d.recId);
      if (!rec) return;
      // Named concerns (OCC/ASC) → use the concern's own title (or the rec's original form item name if known).
      // Custom (user-created) concerns → use rec text but open autoRename so the user can set a proper name.
      const isCustomFrom = from.type === "custom";
      const isOccFrom = from.type === "occ";
      const newTitle = isCustomFrom
        ? (rec.text || rec.recommendation || "New concern")
        : isOccFrom
          ? (rec.sourceFormItemName || rec.text || rec.recommendation || "New concern")
          : from.title;
      setConcerns((cs) => {
        const updated = cs.map((c) => c.id === d.fromConcernId ? { ...c, recs: c.recs.filter((r) => r.id !== d.recId) } : c);
        // Remove now-empty non-OCC concerns
        const filtered = updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
        return [...filtered, { id: newId, type: "custom", title: newTitle, points: [], recs: [{ ...rec, fresh: true }] }];
      });
      // Mirror removal into recConcerns so Rec tab stays in sync
      setRecConcerns((cs) => {
        const updated = cs.map((c) => c.id === d.fromConcernId ? { ...c, recs: c.recs.filter((r) => r.id !== d.recId) } : c);
        return updated.filter(c => c.type === "occ" || c.recs.length > 0 || c.points.length > 0);
      });
      if (isCustomFrom) setNewCustomConcernId(newId);
      showToast(`New concern created`);
    }
  };

  // ── Build concern dropdown groups dynamically from current concerns
  const buildConcernGroups = (defaultTargetConcernId) => {
    // OCCs: canonical source is recConcerns, dedup by title
    const seenOccTitles = new Set();
    const allOccs = recConcerns.filter(c => c.type === "occ").filter(c => {
      if (seenOccTitles.has(c.title)) return false;
      seenOccTitles.add(c.title); return true;
    });
    // ASCs: merge both states by ID
    const seenIds = new Set(recConcerns.map(c => c.id));
    const allAscs = [
      ...recConcerns.filter(c => c.type !== "occ"),
      ...concerns.filter(c => c.type !== "occ" && !seenIds.has(c.id)),
    ];
    const combinedAll = [...allOccs, ...allAscs];
    const current = combinedAll.find((x) => x.id === defaultTargetConcernId);
    const others = combinedAll.filter((x) => x.id !== defaultTargetConcernId);
    const occOthers = others.filter((x) => x.type === "occ");
    // ASCs: only fail-marked (asc_m) concerns with at least 1 marked rec
    const ascOthers = others.filter((x) => x.type === "asc_m" && x.recs.some((r) => r.status != null));
    return [
      {
        label: null,
        items: current ? [{
          id: current.id,
          type: (current.type === "asc_m" || current.type === "asc_c" || current.type === "custom") ? "asc-cos" : current.type,
          typeLabel: { occ: "OCC", custom: "ASC", asc_m: "ASC", asc_c: "ASC" }[current.type] || "Concern",
          title: current.title + " (current)",
          count: current.recs.length,
          consequence: "Keeps the rec on this concern",
          sticky: true,
        }] : [],
      },
      ...(occOthers.length ? [{
        label: "Move under an original customer concern",
        items: occOthers.map((c) => ({
          id: c.id, type: "occ", typeLabel: "OCC", title: c.title,
          count: c.recs.length,
          consequence: "Adds rec to this concern card; customer sees them grouped",
        })),
      }] : []),
      ...(ascOthers.length ? [{
        label: "Or move under another concern",
        items: ascOthers.map((c) => ({
          id: c.id,
          type: (c.type === "asc_m" || c.type === "asc_c" || c.type === "custom") ? "asc-cos" : c.type,
          typeLabel: { custom: "ASC", asc_m: "ASC", asc_c: "ASC" }[c.type] || "Concern",
          title: c.title,
          count: c.recs.length,
          consequence: "Customer sees this rec under " + c.title.toLowerCase(),
        })),
      }] : []),
    ];
  };

  // ── Open modal with context
  // Flatten all section points into a searchable list for FormItemSearchField
  const allFormItems = React.useMemo(() => {
    // Build reverse map: pointId → concernId (from the Edit MPI concerns)
    const pointToConcern = {};
    concerns.forEach(c => { (c.points || []).forEach(p => { pointToConcern[p.id] = c.id; }); });
    return sections.flatMap(s => (s.points || []).map(p => ({
      id: p.id, name: p.name, status: p.status || null,
      sectionTitle: s.title, type: p.type || null, readings: p.readings || null,
      concernId: pointToConcern[p.id] || null,
    })));
  }, [sections, concerns]);

  const openModalFor = (ctx) => {
    const isNewRec = !!ctx.isNewRec;
    const inferredDefaults = {
      whatNeedsDone: "",
      opCode: "",
      laborType: "CP",
      hours: "1.0",
      labor: "",
      parts: "",
      misc: "0",
      // For new recs, no status prefill
      status: isNewRec ? null : undefined,
    };
    const lockedConcern = !!ctx.targetSectionId;
    // Determine source concern type + title for PLACEMENT dropdown
    const sourceCon = ctx.targetConcernId
      ? (concerns.find(c => c.id === ctx.targetConcernId) || recConcerns.find(c => c.id === ctx.targetConcernId))
      : null;
    const sourceType = ctx.sourceType || (lockedConcern ? "asc" : (sourceCon?.type === "occ" ? "occ" : "asc"));
    const sourceConcernTitle = ctx.sourceConcernTitle || (lockedConcern ? (ctx.inspectionPoint || "") : (sourceCon?.title || ctx.inspectionPoint || ""));
    setModal({
      inspectionPoint: ctx.inspectionPoint,
      inspectionDetail: ctx.inspectionDetail,
      inspectionResult: isNewRec ? (ctx.inspectionResult || null) : (ctx.inspectionResult || "failed"),
      defaultConcern: ctx.targetConcernId || (isNewRec ? "__unlinked__" : "new-form-concern"),
      targetConcernId: ctx.targetConcernId,
      targetSectionId: ctx.targetSectionId,
      targetPointId: ctx.targetPointId,
      tire: ctx.tire || null,
      lockedConcern,
      lockedConcernLabel: lockedConcern ? (ctx.inspectionPoint || "") : "",
      preLinked: !!ctx.preLinked,
      // The rec's own persistent identity (e.g. the inspection point it was originally filed
      // against), independent of whichever concern it's currently been moved/shown under —
      // so the modal header keeps reading correctly even after a drag-and-drop move.
      ownConcernTitle: ctx.ownConcernTitle || null,
      isNewRec,
      editingRecId: ctx.editingRecId || null,
      initialSection: ctx.initialSection || null,
      sourceType,
      sourceConcernTitle,
      inspectionMedia: lockedConcern ? { photos: 2, videos: 1 } : null,
      defaults: { ...inferredDefaults, ...(ctx.defaults || {}) },
      isPreApproved: !!ctx._isPreApproved,
      _openTime: Date.now(),
      groups: ctx.targetConcernId
        ? buildConcernGroups(ctx.targetConcernId)
        : (() => {
          // OCCs: canonical source is recConcerns, dedup by title
          const seenOccTitles = new Set();
          const dedupedOccs = recConcerns.filter(c => c.type === "occ").filter(c => {
            if (seenOccTitles.has(c.title)) return false;
            seenOccTitles.add(c.title); return true;
          });
          // ASCs: merge both states by ID, only those with a marked rec
          const seenIds = new Set(recConcerns.map(c => c.id));
          const markedAscs = [
            ...recConcerns.filter(c => c.type !== "occ"),
            ...concerns.filter(c => c.type !== "occ" && !seenIds.has(c.id)),
          ].filter(c => c.recs.some(r => r.status != null));
          return [
            { label: null, items: [
              { id: "__unlinked__", type: "none", typeLabel: "", title: "[Unlinked]", count: 0, consequence: "Recommendation is standalone, not grouped under any concern" },
              { id: "new-form-concern", type: "ungrouped", typeLabel: "New", title: "Create new custom concern", count: 0, consequence: "Creates a new custom concern from this recommendation" },
            ]},
            ...(dedupedOccs.length ? [{ label: "Move under an original customer concern", items: dedupedOccs.map(c => ({ id: c.id, type: "occ", typeLabel: "OCC", title: c.title, count: c.recs.length, consequence: "Adds rec to this concern card; customer sees them grouped" })) }] : []),
            ...(markedAscs.length ? [{ label: null, items: markedAscs.map(c => ({ id: c.id, type: (c.type === "asc_m" || c.type === "asc_c" || c.type === "custom") ? "asc-cos" : c.type, typeLabel: { custom: "ASC", asc_m: "ASC", asc_c: "ASC" }[c.type] || "Concern", title: c.title, count: c.recs.length, consequence: "Customer sees this rec under " + c.title.toLowerCase() })) }] : []),
          ];
        })(),
    });
  };

  // ── Jump to a different recommendation from the live preview panel, without closing the
  // editor. Reuses the same context shape as clicking a rec from the Recommendation tab.
  const performJump = (target) => {
    if (!target || !target.rec) return;
    const rec = target.rec;
    const statusKind = typeof rec.status === "string" ? rec.status : rec.status?.kind;
    openModalFor({
      inspectionPoint: rec.sourceFormItemName || rec.recommendation || rec.text || "",
      ownConcernTitle: rec.sourceFormItemName || null,
      inspectionDetail: "",
      inspectionResult: statusKind || null,
      targetConcernId: target.concernId,
      preLinked: true,
      editingRecId: rec.id,
      _isPreApproved: !!rec._isPreApproved,
      defaults: {
        whatNeedsDone: rec.recommendation || rec.text || "",
        labor: rec.labor != null ? String(rec.labor) : "",
        parts: rec.parts != null ? String(rec.parts) : "",
        misc: rec.misc != null ? String(rec.misc) : "0",
        status: statusKind,
      },
    });
    setPendingRecJump(null);
  };

  // ── Save a rec from the modal
  // A blank labor/parts field means "no input" — preserve that as null (rendered as red
  // "Missing Labor"/"Missing Parts") instead of silently coercing it to $0.
  const numOrNull = (v) => (v === "" || v == null ? null : Number(v));
  const handleSave = (data) => {
    if (!modal) return;
    const total = (Number(data.labor) || 0) + (Number(data.parts) || 0) + (Number(data.misc) || 0);

    // ── EDIT path: update existing rec in place
    if (modal.editingRecId) {
      const updatedFields = {
        text: data.whatNeedsDone || "New recommendation",
        recommendation: data.whatNeedsDone || "New recommendation",
        total: Number(total.toFixed(2)),
        labor: numOrNull(data.labor),
        parts: numOrNull(data.parts),
        misc:  Number(data.misc)  || 0,
        shownToCustomer: data.hidePrice ? 0 : Number(total.toFixed(2)),
        fresh: true,
        partsList: data.partsList ?? [],
        ...(data.status ? { status: typeof data.status === "string" ? { kind: data.status } : data.status } : {}),
      };
      const applyUpdate = (r) => r.id === modal.editingRecId ? { ...r, ...updatedFields } : r;
      setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map(applyUpdate) })));
      setRecConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map(applyUpdate) })));
      showToast("Recommendation updated");
      setTimeout(() => {
        const unfresh = (r) => r.id === modal.editingRecId ? { ...r, fresh: false } : r;
        setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map(unfresh) })));
        setRecConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map(unfresh) })));
      }, 3000);
      setModal(null);
      return;
    }
    // If the user changed the result to pass/na/ni — just update the point status and close, no concern created
    if (data.status === "pass" || data.status === "na" || data.status === "ni") {
      if (modal.targetSectionId && modal.targetPointId) {
        setSections((ss) => ss.map((s) => s.id !== modal.targetSectionId ? s : {
          ...s, points: s.points.map((p) => p.id !== modal.targetPointId ? p : { ...p, status: data.status }),
        }));
      }
      setModal(null);
      return;
    }

    // Use the status the user explicitly selected in the modal; fall back to inspectionResult or fail.
    // Keep as a plain string to match existing rec data format ("fail" | "caution" | null).
    let recStatus = data.status || (modal.inspectionResult === "caution" ? "caution" : "fail");
    const readings = data.tireReadings || (modal.tire && modal.tire.readings);
    if (readings) {
      const vals = Object.values(readings).filter((v) => v != null);
      if (vals.length) {
        const worst = Math.min(...vals);
        recStatus = {
          kind: "number",
          value: worst >= 10 ? "10+" : String(worst),
          tone: defaultGradeOf(worst) === "caution" ? "caution" : "fail",
        };
      }
    }
    const newRec = {
      id: "r-" + Date.now(),
      text: data.whatNeedsDone || "New recommendation",
      total: Number(total.toFixed(2)),
      labor: numOrNull(data.labor),
      parts: numOrNull(data.parts),
      misc:  Number(data.misc)  || 0,
      shownToCustomer: data.hidePrice ? 0 : Number(total.toFixed(2)),
      status: recStatus,
      fresh: true,
      partsList: data.partsList ?? [],
      ...(data.media ? { media: data.media } : {}),
      // Store the original form item name so it can be recovered if this rec is later moved to an OCC
      // and then extracted back to a standalone concern.
      ...(modal.lockedConcern && modal.inspectionPoint ? { sourceFormItemName: modal.inspectionPoint } : {}),
    };
    const isNewCustom = data.concern === "new-form-concern";
    const isUnlinked = data.concern === "__unlinked__";
    const targetConcernId = (isNewCustom || isUnlinked) ? "custom-" + Date.now() : data.concern;
    // For fail/caution flows (lockedConcern) the concern title must always be
    // the inspection line name — never the recommendation text.
    const newConcernTitle = isUnlinked
      ? (data.customConcernName || (modal.lockedConcern ? modal.inspectionPoint : null) || data.whatNeedsDone || "Custom concern")
      : (isNewCustom && !modal.lockedConcern && !modal.preLinked)
        ? (data.whatNeedsDone || "New concern")
        : (modal.inspectionPoint || data.whatNeedsDone || "New concern");
    // Bridge the ID mismatch between concerns (Edit MPI) and recConcerns (Rec tab) for OCCs.
    // e.g. the same OCC may be "occ-tire-light" in concerns but "occ1" in recConcerns.
    // Strategy: match by exact ID first; if not found, match OCC by title across states.
    const recDirectMatch = recConcerns.find(c => c.id === targetConcernId);
    const mpiOccSrc = !recDirectMatch ? concerns.find(c => c.id === targetConcernId && c.type === "occ") : null;
    const recTitleMatch = mpiOccSrc ? recConcerns.find(c => c.type === "occ" && c.title === mpiOccSrc.title) : null;
    const recTargetId = recDirectMatch ? recDirectMatch.id : (recTitleMatch ? recTitleMatch.id : targetConcernId);
    const isRecOcc = !!(recDirectMatch?.type === "occ" || recTitleMatch);
    // Update the Edit MPI tab concerns — skip if target is a recConcerns-only OCC (no matching ID in concerns)
    if (!isRecOcc || mpiOccSrc) {
      setConcerns((cs) => {
        const exists = cs.find((c) => c.id === targetConcernId);
        if (exists) return cs.map((c) => c.id === targetConcernId ? { ...c, recs: [...c.recs, newRec] } : c);
        // Only create new concern in Edit MPI if it's not an OCC-only target
        if (isRecOcc) return cs;
        return [...cs, { id: targetConcernId, section: "mpi", type: "asc_m", title: newConcernTitle, points: [], recs: [newRec] }];
      });
    }
    // Update the Recommendation tab concerns — use bridged recTargetId
    setRecConcerns((cs) => {
      let idx = cs.findIndex((c) => c.id === recTargetId);
      // Fallback: for OCCs, also try title match in case of any ID drift
      if (idx < 0 && isRecOcc) {
        const titleToMatch = recDirectMatch?.title || recTitleMatch?.title;
        if (titleToMatch) idx = cs.findIndex(c => c.type === "occ" && c.title === titleToMatch);
      }
      if (idx >= 0) {
        const arr = cs.slice();
        arr[idx] = { ...arr[idx], recs: [...arr[idx].recs, { ...newRec, recommendation: newRec.text }] };
        return arr;
      }
      // Create new concern — use ocr section for OCCs so they appear in the right section of the Rec tab
      return [...cs, { id: recTargetId, section: isRecOcc ? "ocr" : "mpi", type: isRecOcc ? "occ" : "asc_m", title: newConcernTitle, points: [], recs: [{ ...newRec, recommendation: newRec.text }] }];
    });
    const toastTitle = recConcerns.find(c => c.id === recTargetId)?.title || concerns.find(c => c.id === targetConcernId)?.title || newConcernTitle;
    showToast(`Recommendation added to "${toastTitle}"`, () => {
      setTab("mpi");
      // After the MPI tab renders, scroll the concern card into view
      setTimeout(() => {
        if (mpiScrollRef.current) {
          const el = mpiScrollRef.current.querySelector(`[data-concern-drop="${targetConcernId}"]`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }, 80);
    });
    // concerns state hasn't flushed yet at this point — look up existing or synthesize from known data
    const destConcern = concerns.find((c) => c.id === targetConcernId)
      || { type: isRecOcc ? "occ" : "asc_m", title: newConcernTitle };
    const pillTypeMap = { occ: "occ", custom: "asc-cos", asc_m: "asc-cos", asc_c: "asc-cos", form: "form" };
    const labelMap    = { occ: "OCC", custom: "ASC", asc_m: "ASC", asc_c: "ASC", form: "Form" };
    if (modal.targetPointId) {
      const addedTo = { type: pillTypeMap[destConcern.type] || "asc-cos", label: labelMap[destConcern.type] || "ASC", title: destConcern.title };
      if (modal.targetSectionId) {
        setSections((ss) => ss.map((s) => s.id !== modal.targetSectionId ? s : { ...s, points: s.points.map((p) => p.id === modal.targetPointId ? { ...p, addedTo } : p) }));
      } else if (modal.targetConcernId) {
        setConcerns((cs) => cs.map((c) => c.id !== modal.targetConcernId ? c : { ...c, points: c.points.map((p) => p.id === modal.targetPointId ? { ...p, addedTo } : p) }));
      }
    }
    setTimeout(() => {
      setConcerns((cs) => cs.map((c) => ({ ...c, recs: c.recs.map((r) => r.id === newRec.id ? { ...r, fresh: false } : r) })));
    }, 3000);
    // Write inspection result (or tire readings) back to the linked MPI point, if one was selected
    if (data.formItemPointId) {
      const hasTireReadings = data.tireReadings && Object.values(data.tireReadings).some(v => v != null);
      if (hasTireReadings) {
        const tireGrade = tireWorstGrade(data.tireReadings);
        setSections(ss => ss.map(s => ({
          ...s,
          points: s.points.map(p => p.id === data.formItemPointId
            ? { ...p, readings: { ...(p.readings || {}), ...data.tireReadings }, status: tireGrade }
            : p),
        })));
      } else if (data.status) {
        setSections(ss => ss.map(s => ({
          ...s,
          points: s.points.map(p => p.id === data.formItemPointId ? { ...p, status: data.status } : p),
        })));
      }
    }
    if (!data.addAnother) setModal(null);
  };

  return (
    <div style={{
      display: "flex", flexDirection: "column",
      minHeight: "100vh",
      background: "var(--bg-cream-soft)",
      fontFamily: "var(--font-sans)",
      color: "var(--t-1)",
    }}>
      <TopBar />
      <div style={{ flex: 1, display: "flex" }}>
        <RailIcons sidebarOpen={sidebarOpen} onToggleSidebar={() => setSidebarOpen(o => !o)} />
        {sidebarOpen && <Sidebar />}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, marginRight: appliedPanelMargin, transition: "margin-right 200ms" }}>
          <Tabs tab={tab} setTab={setTab} phase={phase} setPhase={setPhase} />

          {tab === "media" && (
            <MediaTab concerns={concerns} recConcerns={recConcerns} />
          )}
          {tab === "rec" && (
            <RecommendationView
              concerns={concerns}
              items={recConcerns}
              setItems={setRecConcerns}
              sections={sections}
              onPointStatusChange={setSectionPointStatus}
              onTireReading={setSectionTireReading}
              onAddRec={addRecToConcern}
              phase={phase}
              onAddCustomRec={() => openModalFor({ inspectionPoint: "Custom recommendation", inspectionDetail: "", inspectionResult: "failed", isNewRec: true })}
              onRecClick={(rec, concernId, section) => {
                const statusKind = typeof rec.status === "string" ? rec.status : rec.status?.kind;
                openModalFor({
                  inspectionPoint: rec.sourceFormItemName || rec.recommendation || rec.text || "",
                  ownConcernTitle: rec.sourceFormItemName || null,
                  inspectionDetail: "",
                  inspectionResult: statusKind || null,
                  targetConcernId: concernId,
                  preLinked: true,
                  editingRecId: rec.id,
                  initialSection: section || null,
                  _isPreApproved: !!rec._isPreApproved,
                  defaults: {
                    whatNeedsDone: rec.recommendation || rec.text || "",
                    labor: rec.labor != null ? String(rec.labor) : "",
                    parts: rec.parts != null ? String(rec.parts) : "",
                    misc:  rec.misc  != null ? String(rec.misc)  : "0",
                    status: statusKind,
                  },
                });
              }}
              onExtractRec={extractRecFromPreview}
              showToast={showToast}
            />
          )}
          {tab === "parts" && (
            <PartsTab recConcerns={recConcerns} />
          )}
          {(tab !== "start" && tab !== "rec" && tab !== "media" && tab !== "parts") && (
            <Toolbar
              onAddRec={() => openModalFor({ inspectionPoint: "New recommendation", inspectionDetail: "", inspectionResult: "failed", isNewRec: true })}
              onAddCustomRec={() => openModalFor({ inspectionPoint: "Custom recommendation", inspectionDetail: "", inspectionResult: "failed", isNewRec: true })}
              onAddConcern={() => openModalFor({ inspectionPoint: "", inspectionDetail: "", isNewRec: true })}
            />
          )}
          <div ref={mpiScrollRef} style={{ padding: "14px 16px 0 16px", background: "var(--bg-cream-soft)", display: (tab === "start" || tab === "rec" || tab === "media" || tab === "parts") ? "none" : undefined }} className="scrollable">
            <div style={{ maxWidth: 1200, margin: "0 auto" }}>
            <PreDiagSurvey />
            {(() => {
              const all = concerns.filter((c) => c.type === "occ" || c.recs.length > 0 || c.type === "asc_m");
              const laborCount = all.filter(c => c.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("labor")))).length;
              const partsCount = all.filter(c => c.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("parts")))).length;
              const partsNoteCount = all.filter(c => c.recs.some(r => r.internal)).length;
              return (
            <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 4px", marginBottom: 10, flexWrap: "wrap" }}>
              <div onClick={() => setConcernsOpen(o => !o)} style={{ display: "flex", alignItems: "center", gap: 9, cursor: "pointer", userSelect: "none" }}>
                <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: 0.06, textTransform: "uppercase", color: "var(--t-2)" }}>Customer Concerns</span>
                <span style={{ background: "var(--b-1)", color: "var(--t-3)", fontSize: 14, fontWeight: 700, borderRadius: 999, padding: "1px 9px" }}>{all.length}</span>
              </div>
              <div style={{ flex: 1, height: 1, background: "var(--b-1)", marginLeft: 4 }} />
              <FilterPillGroup
                options={[
                  { id: "all", label: "All" },
                  { id: "labor", label: "Needs Labor", count: laborCount },
                  { id: "parts", label: "Needs Parts", count: partsCount },
                  { id: "parts_notes", label: "Parts notes", count: partsNoteCount },
                ]}
                value={concernsFilter}
                onChange={setConcernsFilter}
              />
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t-4)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ transition: "transform 180ms", transform: concernsOpen ? "rotate(0deg)" : "rotate(-90deg)", flexShrink: 0, cursor: "pointer" }} onClick={() => setConcernsOpen(o => !o)}><polyline points="6 9 12 15 18 9"/></svg>
            </div>
              );
            })()}

            {concernsOpen && (() => {
              const all = concerns.filter((c) => c.type === "occ" || c.recs.length > 0 || c.type === "asc_m");
              const visible = all.filter((c) => {
                if (concernsFilter === "labor") return c.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("labor")));
                if (concernsFilter === "parts") return c.recs.some(r => r.estStatus?.some(s => s.tone === "incomplete" && s.label?.toLowerCase().includes("parts")));
                if (concernsFilter === "parts_notes") return c.recs.some(r => r.internal);
                return true;
              });
              const ascCount = visible.filter(c => c.type !== "occ").length;
              let occIdx = 0;
              return visible.map((c, i) => {
                const letter = c.type === "occ" ? String.fromCharCode(65 + occIdx++) : null;
                return (
              <ConcernCard
                key={c.id}
                concern={c}
                isFirst={i === 0}
                isLast={i === visible.length - 1}
                concerns={concerns}
                canReorder={c.type !== "occ" && ascCount > 1}
                onReorderConcern={(targetId, before) => moveConcernRelativeTo(c.id, targetId, before)}
                letter={letter}
                onMoveRecTo={(recId, toId) => moveRecToConcern(recId, c.id, toId)}
                onMoveRecRelative={(recId, toId, targetRecId, before) => moveRecRelativeTo(recId, c.id, toId, targetRecId, before)}
                onMovePointTo={(pointId, toId) => moveConcernPointToConcern(c.id, pointId, toId)}
                onMoveRecToNew={(recId) => createConcernFromDrag({ recId, fromConcernId: c.id })}
                onMovePointToNew={(pointId) => createConcernFromDrag({ kind: "concernPoint", fromConcernId: c.id, pointId })}
                onPointStatusChange={setConcernPointStatus}
                onAddRec={addRecToConcern}
                onAddCustomRec={addCustomRecToConcern}
                onRemoveConcern={removeConcern}
                onDeleteRec={(recId) => deleteRec(recId, c.id)}
                autoRename={c.id === newCustomConcernId}
                onTitleChange={(id, title) => { setConcerns(cs => cs.map(x => x.id === id ? { ...x, title } : x)); if (id === newCustomConcernId) setNewCustomConcernId(null); }}
                onMoveConcern={(id) => {}}
                dragActive={!!drag}
                isDragSource={drag && drag.kind !== "mpiPoint" && drag.fromConcernId === c.id}
                isDragOver={dragOverConcernId === c.id && drag && !(drag.kind !== "mpiPoint" && drag.kind !== "concernPoint" && drag.fromConcernId === c.id)}
                phase={phase}
                draggingRecId={drag && drag.kind === "rec" ? drag.recId : null}
                draggingPointId={drag && drag.kind === "concernPoint" && drag.fromConcernId === c.id ? drag.pointId : null}
                onRecDragStart={(recId) => setDrag({ kind: "rec", fromConcernId: c.id, recId })}
                onRecDragEnd={() => { setDrag(null); setDragOverConcernId(null); setDragOverNew(false); }}
                onPointDragStart={(pointId, pointName) => setDrag({ kind: "concernPoint", fromConcernId: c.id, pointId, pointName })}
                onPointDragEnd={() => { setDrag(null); setDragOverConcernId(null); setDragOverNew(false); }}
                onCardDragOver={() => setDragOverConcernId(c.id)}
                onCardDragLeave={() => setDragOverConcernId((id) => (id === c.id ? null : id))}
                onCardDrop={() => {
                  if (drag && drag.kind === "mpiPoint") moveMpiPointToConcern(drag.fromSectionId, drag.pointId, c.id);
                  else if (drag && drag.kind === "concernPoint") moveConcernPointToConcern(drag.fromConcernId, drag.pointId, c.id);
                  else if (drag) moveRecToConcern(drag.recId, drag.fromConcernId, c.id);
                  setDrag(null); setDragOverConcernId(null);
                }}
                onRecClick={(cid, rec) => openModalFor({
                  inspectionPoint: rec.sourceFormItemName || rec.text || rec.recommendation || "",
                  ownConcernTitle: rec.sourceFormItemName || null,
                  inspectionDetail: c.title,
                  inspectionResult: rec.status?.kind || null,
                  targetConcernId: cid,
                  preLinked: true,
                  editingRecId: rec.id,
                  defaults: {
                    whatNeedsDone: rec.text || rec.recommendation || "",
                    labor: rec.labor != null ? String(rec.labor) : "",
                    parts: rec.parts != null ? String(rec.parts) : "",
                    misc:  rec.misc  != null ? String(rec.misc)  : "0",
                    status: rec.status?.kind,
                  },
                })}
              />
                );
              });
            })()}

            {concernsOpen && drag && (
              <div
                data-concern-new="1"
                onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; setDragOverNew(true); }}
                onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverNew(false); }}
                onDrop={(e) => { e.preventDefault(); createConcernFromDrag(drag); setDrag(null); setDragOverConcernId(null); setDragOverNew(false); }}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                  margin: "4px 0 8px", padding: "14px", borderRadius: 8,
                  border: `2px dashed ${dragOverNew ? "var(--blue-600)" : "var(--blue-400)"}`,
                  background: dragOverNew ? "var(--blue-100)" : "var(--blue-50)",
                  color: dragOverNew ? "var(--blue-800)" : "var(--blue-700)",
                  fontSize: 14, fontWeight: 700, letterSpacing: 0.04, textTransform: "uppercase",
                  transition: "background 120ms, border-color 120ms, color 120ms",
                  cursor: "copy",
                }}
              >
                <IconPlus size={15} /> Add new concern
              </div>
            )}

            <div style={{ height: 8 }} />

            <PreviousDeclines concerns={concerns} setConcerns={setConcerns} showToast={showToast} />

            {(() => {
              const isComplete = (pt) => pt.status && pt.status !== "ni";
              const allPoints = sections.flatMap(s => s.points);
              const completedCount = allPoints.filter(isComplete).length;
              const incompleteCount = allPoints.length - completedCount;
              const requiredIncompleteCount = allPoints.filter(pt => pt.required && !isComplete(pt)).length;
              return (
            <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 4px", marginBottom: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 14, fontWeight: 700, letterSpacing: 0.06, textTransform: "uppercase", color: "var(--t-2)" }}>Inspection</span>
              <span style={{ background: "var(--b-1)", color: "var(--t-3)", fontSize: 14, fontWeight: 700, borderRadius: 999, padding: "1px 9px" }}>{sections.length}</span>
              <div style={{ flex: 1, height: 1, background: "var(--b-1)", marginLeft: 4 }} />
              <FilterPillGroup
                options={[
                  { id: "all", label: "All" },
                  { id: "completed", label: "Completed", count: completedCount },
                  { id: "incomplete", label: "Incomplete", count: incompleteCount },
                  { id: "required", label: "Required", count: requiredIncompleteCount },
                ]}
                value={mpiFilter}
                onChange={setMpiFilter}
              />
            </div>
              );
            })()}

            <div>
            {sections.map((s, si) => {
              const isComplete = (pt) => pt.status && pt.status !== "ni";
              const filteredPoints = mpiFilter === "completed" ? s.points.filter(isComplete)
                : mpiFilter === "incomplete" ? s.points.filter(pt => !isComplete(pt))
                : mpiFilter === "required" ? s.points.filter(pt => pt.required && !isComplete(pt))
                : s.points;
              if (mpiFilter !== "all" && filteredPoints.length === 0) return null;
              const filteredSection = mpiFilter === "all" ? s : { ...s, points: filteredPoints };
              return (
              <InspectionSection
                key={s.id}
                section={filteredSection}
                isFirst={si === 0}
                isLast={si === sections.length - 1}
                onPointStatusChange={setSectionPointStatus}
                onTireReading={setSectionTireReading}
                drag={drag}
                onPointDragStart={(pointId, pointName) => setDrag({ kind: "mpiPoint", fromSectionId: s.id, pointId, pointName })}
                onPointDragEnd={() => { setDrag(null); setDragOverConcernId(null); setDragOverNew(false); }}
                concerns={concerns}
                onMoveMpiPointTo={(pointId, toId) => moveMpiPointToConcern(s.id, pointId, toId)}
                onMoveMpiPointToNew={(pointId) => createConcernFromDrag({ kind: "mpiPoint", fromSectionId: s.id, pointId })}
                onPointClick={(pt, section) => {
                  const statusKind = typeof pt.status === "string" ? pt.status : pt.status?.kind;
                  openModalFor({
                    inspectionPoint: pt.name,
                    inspectionDetail: s.title.replace(/^MPI: /, ""),
                    inspectionResult: statusKind === "caution" ? "caution" : "failed",
                    targetSectionId: s.id,
                    targetPointId: pt.id,
                  });
                }}
              />
              );
            })}
            </div>

            <div style={{ height: 160 }} />
            </div>{/* /maxWidth centering wrapper */}
          </div>
          <BottomBar onPreview={() => setCustPreview(true)} />
        </div>
      </div>

      {modal && (
        <div
          style={{
            position: "fixed", inset: 0,
            // Background stays visible (not darkened) so the page underneath still shows
            // through and fills the left portion of the screen while the panel is open —
            // the panel's own box-shadow provides enough separation on its own.
            background: "transparent",
            pointerEvents: editorVariant === "panel" ? "none" : "auto",
            zIndex: 100,
            display: "flex",
            justifyContent: editorVariant === "panel" ? "flex-end" : "center",
            alignItems: editorVariant === "panel" ? "stretch" : "flex-start",
            overflowY: editorVariant === "panel" ? "hidden" : "auto",
            padding: editorVariant === "panel" ? 0 : "40px 24px",
            animation: "fadeIn 160ms",
          }}
          onClick={(e) => { if (e.target === e.currentTarget && editorVariant !== "panel") setModal(null); }}
        >

          <div ref={panelBoxRef} style={{
            position: "relative",
            pointerEvents: "auto",
            width: editorVariant === "panel" && panelWidth ? effectivePanelWidth : "100%",
            maxWidth: editorVariant === "panel" ? (panelWidth ? effectivePanelWidth : (phase === 2 ? (pvwCollapsed ? 1170 : 1500) : 1200)) : 900,
            minWidth: editorVariant === "panel" ? (panelWidth ? effectivePanelWidth : (phase === 2 && pvwCollapsed ? "clamp(500px, 50vw, 900px)" : "clamp(720px, 60vw, 1200px)")) : undefined,
            height: editorVariant === "panel" ? "100vh" : "auto",
            animation: editorVariant === "panel"
              ? "panelIn 240ms cubic-bezier(.2,.8,.2,1)"
              : "modalIn 220ms cubic-bezier(.2,.8,.2,1)",
            display: "flex", flexDirection: "row",
            // With the backdrop transparent, the panel needs its own visible seam against the
            // page content sitting immediately to its left.
            borderLeft: editorVariant === "panel" ? "1px solid var(--b-2)" : undefined,
            boxShadow: editorVariant === "panel" ? "-6px 0 16px rgba(16, 24, 40, 0.08)" : undefined,
          }}>
            {/* Drag handle to resize the panel's width — grabbing anywhere on this thin strip
                and dragging left/right widens/narrows the whole panel (docked to the right
                edge of the screen, so dragging left = wider). */}
            {editorVariant === "panel" && (
              <div
                onPointerDown={startPanelResize}
                title="Drag to resize"
                style={{
                  position: "absolute", left: -4, top: 0, bottom: 0, width: 8,
                  // Sits below the collapse/expand toggle button (zIndex 20) so that when the
                  // toggle overlaps this strip (it hugs the panel's left edge while collapsed),
                  // the button fully owns hover/click there instead of the resize highlight
                  // bleeding through underneath it.
                  cursor: "col-resize", zIndex: 15,
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "var(--blue-200)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
              />
            )}

            {phase === 2 && (
              <ModalContextPreview
                concerns={concerns}
                recConcerns={recConcerns}
                targetConcernId={modal.targetConcernId || modal.defaultConcern}
                liveState={modalLive}
                panel={true}
                width={PREVIEW_WIDTH}
                editingRecId={modal.editingRecId}
                onReorderRec={reorderRecInModal}
                onExtractRec={extractRecFromPreview}
                onChangeLiveTarget={(concernId) => setModal((m) => m ? { ...m, externalConcernId: concernId } : m)}
                pvwCollapsed={pvwCollapsed}
                showOnboarding={false}
                onDismissOnboarding={() => setPvwOnboardingDone(true)}
              />
            )}

            {/* Drag handle at the Recommendations Preview / editor boundary — grabbing it resizes
                the whole panel exactly like the outer left-edge handle does (same handler), so the
                preview stays a fixed width either way and only the editor grows or shrinks. It's
                just a second, more discoverable place to grab the same resize behavior. Sits below
                the toggle button (zIndex 20), which floats at this same boundary, so the button
                fully owns hover/click there. */}
            {phase === 2 && !pvwCollapsed && (
              <div
                onPointerDown={startPanelResize}
                title="Drag to resize"
                style={{
                  position: "absolute", left: PREVIEW_WIDTH - 4, top: 0, bottom: 0, width: 8,
                  cursor: "col-resize", zIndex: 15,
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = "var(--blue-200)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = "transparent"; }}
              />
            )}

            {/* Collapse/expand toggle for the Recommendations Preview panel — floats at the
                panel/editor boundary (left edge sits at the panel's width when expanded, or
                hugs the editor's left edge when collapsed so it stays reachable to re-open). */}
            {phase === 2 && (
              <button
                onClick={() => setPvwCollapsed(v => !v)}
                title={pvwCollapsed ? "Show recommendations preview" : "Hide recommendations preview"}
                style={{
                  position: "absolute",
                  left: pvwCollapsed ? 0 : PREVIEW_WIDTH,
                  transform: "translateX(-50%)",
                  top: 40,
                  zIndex: 20,
                  width: 24, height: 44,
                  borderRadius: 999,
                  border: "1px solid var(--b-2)",
                  background: "var(--bg-white)",
                  color: "var(--t-3)",
                  cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  boxShadow: "0 2px 6px rgba(0,0,0,0.14)",
                  transition: "left 200ms",
                }}
                onMouseEnter={e => { e.currentTarget.style.background = "var(--bg-cream)"; e.currentTarget.style.color = "var(--t-2)"; }}
                onMouseLeave={e => { e.currentTarget.style.background = "var(--bg-white)"; e.currentTarget.style.color = "var(--t-3)"; }}
              >
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ transition: "transform 180ms", transform: pvwCollapsed ? "none" : "rotate(180deg)" }}>
                  <polyline points="15 18 9 12 15 6" />
                </svg>
              </button>
            )}

            <RecEditorModal
              key={modal._openTime}
              initialSection={modal.initialSection}
              inspectionPoint={modal.inspectionPoint}
              inspectionDetail={modal.inspectionDetail}
              inspectionResult={modal.inspectionResult}
              defaultConcern={modal.defaultConcern}
              concernOptions={modal.groups}
              preLinked={modal.preLinked}
              lockedConcern={modal.lockedConcern}
              lockedConcernLabel={modal.lockedConcernLabel}
              isPreApproved={modal.isPreApproved}
              phase={phase}
              defaults={modal.defaults}
              variant={editorVariant}
              tire={modal.tire}
              isNewRec={modal.isNewRec}
              sourceType={modal.sourceType}
              sourceConcernTitle={modal.sourceConcernTitle}
              ownConcernTitle={modal.ownConcernTitle}
              inspectionMedia={modal.inspectionMedia}
              allConcerns={(() => {
                // OCCs: pull from Edit MPI concerns state only
                const seenOccTitles = new Set();
                const occs = concerns.filter(c => c.type === "occ").filter(c => {
                  if (seenOccTitles.has(c.title)) return false;
                  seenOccTitles.add(c.title); return true;
                });
                // ASCs: only include OTHER fail-marked (type === "asc_m") concerns — not the current concern.
                // "Link to an additional service concern" only appears when another ASC already exists.
                const seenIds = new Set(recConcerns.map(c => c.id));
                const failAscIds = new Set(concerns.filter(c => c.type === "asc_m").map(c => c.id));
                const currentConcernId = modal.targetConcernId;
                const ascs = [
                  ...recConcerns.filter(c => failAscIds.has(c.id) && c.id !== currentConcernId),
                  ...concerns.filter(c => c.type === "asc_m" && !seenIds.has(c.id) && c.id !== currentConcernId),
                ].filter(c => c.recs.some(r => r.status != null));
                const base = [...occs, ...ascs];
                const standaloneEntry = { id: "__unlinked__", type: "unlinked", title: "Keep rec by itself" };

                // Form item (lockedConcern): OCC options first, then OTHER ASCs with fails (not the form item's own concern), standalone last
                if (modal.lockedConcern) {
                  const otherAscs = ascs.filter(c => c.id !== modal.defaultConcern);
                  return [...occs, ...otherAscs, standaloneEntry];
                }

                // New custom rec: standalone first (it's the default), then existing concerns
                if (modal.isNewRec) {
                  return [{ id: "__unlinked__", type: "unlinked", title: "Add a custom concern" }, ...base];
                }

                // Editing existing rec (preLinked): inject the original concern as a "return to" option if not already in the list, standalone last
                let baseWithDefault = base;
                if (modal.defaultConcern && !base.find(c => c.id === modal.defaultConcern)) {
                  const realC = concerns.find(c => c.id === modal.defaultConcern) || recConcerns.find(c => c.id === modal.defaultConcern);
                  const formConcernEntry = realC
                    ? { ...realC, _formReturn: true }
                    : { id: modal.defaultConcern, type: "asc_m", title: modal.inspectionPoint || "Original form concern", recs: [], _formReturn: true };
                  baseWithDefault = [formConcernEntry, ...base];
                }
                return [...baseWithDefault, standaloneEntry];
              })()}
              formItems={allFormItems}
              onTireReading={updateTireReading}
              showPriorDecline={!modal.isNewRec && !modal.editingRecId && (modal.inspectionPoint.toLowerCase().includes("brake") || modal.inspectionPoint.toLowerCase().includes("pad"))}
              externalConcernId={modal.externalConcernId}
              onSave={handleSave}
              onDelete={modal.editingRecId ? (() => {
                setRecConcerns(prev => prev.map(c => ({ ...c, recs: c.recs.filter(r => r.id !== modal.editingRecId) })));
                setModal(null); setModalLive(null);
              }) : undefined}
              onPreviewChange={setModalLive}
              onClose={() => { setModal(null); setModalLive(null); }}
              jumpTarget={pendingRecJump}
              onJumpConfirmed={performJump}
              onJumpCancelled={() => setPendingRecJump(null)}
            />
          </div>
        </div>
      )}

      {custPreview && (
        <CustomerPreviewModal
          recConcerns={recConcerns}
          onClose={() => setCustPreview(false)}
          onDecisionsApplied={(decisions) => {
            setRecApprovals(prev => {
              const next = new Map(prev);
              Object.entries(decisions).forEach(([id, val]) => { if (val != null) next.set(id, val); });
              return next;
            });
          }}
        />
      )}

      {toast && (
        <div style={{
          position: "fixed", bottom: 80, left: "50%",
          transform: "translateX(-50%)",
          background: "#02679b", color: "#fff",
          borderRadius: 8,
          fontSize: 14, fontWeight: 500,
          boxShadow: "0 16px 40px rgba(2,103,155,0.35)",
          zIndex: 200,
          animation: "toastIn 220ms cubic-bezier(.2,.8,.2,1)",
          overflow: "hidden",
          minWidth: 260,
        }}>
          {/* Progress bar — top */}
          <div style={{ height: 5, background: "rgba(255,255,255,0.18)", position: "relative" }}>
            <div style={{
              position: "absolute", left: 0, top: 0, width: "100%", height: "100%",
              background: "rgba(255,255,255,0.75)",
              transformOrigin: "left center",
              animation: `toastProgress ${toast.duration || 2400}ms linear forwards`,
            }} />
          </div>
          {/* Main row */}
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 18px" }}>
            <span style={{
              width: 18, height: 18, borderRadius: 999,
              background: "rgba(255,255,255,0.25)",
              display: "grid", placeItems: "center", flexShrink: 0,
            }}><IconCheck size={11} strokeWidth={2.6} /></span>
            <span style={{ flex: 1 }}>{toast.msg || toast}</span>
            {toast.onView && (
              <button
                onClick={() => { toast.onView(); setToast(null); }}
                style={{ marginLeft: 6, padding: "2px 10px", height: 24, background: "rgba(255,255,255,0.18)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 4, color: "#fff", fontSize: 12.5, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}
                onMouseEnter={e => e.currentTarget.style.background = "rgba(255,255,255,0.3)"}
                onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.18)"}
              >View</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

if (typeof document !== "undefined" && !document.getElementById("mpi-keyframes")) {
  const s = document.createElement("style");
  s.id = "mpi-keyframes";
  s.textContent = `
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.985); } to { opacity: 1; transform: none; } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes toastProgress { from { transform-origin: right; transform: scaleX(1); } to { transform-origin: right; transform: scaleX(0); } }
    @keyframes placementGlow { 0% { box-shadow: 0 0 0 0 rgba(2,103,155,0.0); } 50% { box-shadow: 0 0 0 6px rgba(2,103,155,0.45); } 100% { box-shadow: 0 0 0 0 rgba(2,103,155,0.0); } }
    @keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes panelIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes onboardingPulse { 0%,100% { outline-color: var(--blue-500); } 50% { outline-color: var(--blue-300); } }
    @keyframes coachGlow { 0%,100% { box-shadow: 0 0 0 3px rgba(2,103,155,0.18), 0 0 0 6px rgba(2,103,155,0.06); } 50% { box-shadow: 0 0 0 3px rgba(2,103,155,0.45), 0 0 0 10px rgba(2,103,155,0.12); } }
    @keyframes coachIn { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes coachProgress { from { transform-origin: left; transform: scaleX(1); } to { transform-origin: left; transform: scaleX(0); } }
  `;
  document.head.appendChild(s);
}

ReactDOM.createRoot(document.getElementById("root")).render(<MPIPage />);
</script>
</body>
</html>
