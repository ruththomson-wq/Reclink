            </div>
          </div>
        </div>
        {all.map(c => {
          const letter = c.type === "occ" ? String.fromCharCode(65 + occIdx++) : null;
          return <MediaConcernCard key={c.id} concern={c} letter={letter} />;
        })}
      </div>
    </div>
  );
};

// ── Phase 2: Organize & Group view ──────────────────────────────────────────
const Phase2View = ({ items, setItems, onRecClick }) => {
  const [dragState, setDragState] = React.useState(null); // { recId, fromConcernId }
  const [dragOver, setDragOver] = React.useState(null);   // concernId being hovered

  const ocr = items.filter(c => c.section === "ocr");
  const mpi = items.filter(c => c.section !== "ocr");

  const moveRec = (recId, fromId, toId) => {
    if (fromId === toId) return;
    setItems(prev => {
      const from = prev.find(c => c.id === fromId);
      const rec = from?.recs.find(r => r.id === recId);
      if (!rec) return prev;
      return prev
        .map(c => {
          if (c.id === fromId) return { ...c, recs: c.recs.filter(r => r.id !== recId) };
          if (c.id === toId)   return { ...c, recs: [...c.recs, rec] };
          return c;
        })
        .filter(c => c.type === "occ" || c.recs.length > 0);
    });
  };

  const renderConcern = (concern, letter) => {
    const p = concernPalette[concern.type] || concernPalette.asc_m;
    const isDropTarget = dragOver === concern.id && dragState && dragState.fromConcernId !== concern.id;
    return (
      <div
        key={concern.id}
        onDragOver={e => { e.preventDefault(); setDragOver(concern.id); }}
        onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
        onDrop={e => { e.preventDefault(); if (dragState) moveRec(dragState.recId, dragState.fromConcernId, concern.id); setDragOver(null); setDragState(null); }}
        style={{ border: `1px solid ${isDropTarget ? "var(--blue-500)" : "var(--b-2)"}`, borderLeft: `3px solid ${p.divBd}`, borderRadius: 8, background: isDropTarget ? "var(--blue-50)" : "var(--bg-white)", boxShadow: "var(--shadow-card)", marginBottom: 8, overflow: "hidden", transition: "border-color 120ms, background 120ms" }}
      >
        {/* Concern header */}
        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", borderBottom: "1px solid var(--b-2)" }}>
          {letter
            ? <ConcernTypePill label={"OCC · " + letter} color={p.pillT} combined />
            : <ConcernTypePill label={p.label} bg={p.pillBg} color={p.pillT} border={p.pillBorder} />
          }
          <span style={{ flex: 1, fontSize: 14, fontWeight: 700, color: "var(--t-1)", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", textTransform: concern.type === "occ" ? "uppercase" : "none" }}>{concern.title}</span>
          {concern.preApproved && (() => {
            const t = (concern.preApproved.labor || 0) + (concern.preApproved.parts || 0) + (concern.preApproved.misc || 0);
            return t > 0 ? <span style={{ fontSize: 14, fontWeight: 600, color: "var(--t-4)", whiteSpace: "nowrap", flexShrink: 0 }}>Pre-Approved · ${t.toFixed(0)}</span> : null;
          })()}
        </div>
        {/* Rec rows */}
        {concern.recs.length === 0 && (
          <div style={{ padding: "12px 14px", fontSize: 14, color: isDropTarget ? "var(--blue-600)" : "var(--t-5)", fontStyle: isDropTarget ? "normal" : "italic", fontWeight: isDropTarget ? 600 : 400, textAlign: isDropTarget ? "center" : "left", transition: "color 100ms" }}>
            {isDropTarget ? "Drop here to move" : "No recommendations — drop one here"}
          </div>
        )}
        {concern.recs.map(rec => {
          const statusKind = typeof rec.status === "string" ? rec.status : rec.status?.kind;
          const isDragging = dragState?.recId === rec.id;
          return (
            <div
              key={rec.id}
              draggable
              onDragStart={e => { e.dataTransfer.effectAllowed = "move"; setDragState({ recId: rec.id, fromConcernId: concern.id }); }}
              onDragEnd={() => { setDragState(null); setDragOver(null); }}
              onClick={() => onRecClick && onRecClick(rec, concern.id)}
              style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px 9px 10px", borderTop: "1px solid var(--b-2)", background: isDragging ? "var(--blue-50)" : "var(--bg-white)", cursor: "pointer", opacity: isDragging ? 0.45 : 1, userSelect: "none", transition: "opacity 120ms" }}
              onMouseEnter={e => { if (!isDragging) e.currentTarget.style.background = "var(--bg-cream)"; }}
              onMouseLeave={e => { e.currentTarget.style.background = isDragging ? "var(--blue-50)" : "var(--bg-white)"; }}
            >
              <span style={{ flexShrink: 0, color: "var(--t-5)", cursor: "grab", lineHeight: 0 }} onMouseDown={e => e.stopPropagation()}><IconMove size={14} /></span>
              {statusKind && (statusKind === "fail" || statusKind === "caution") && (
                <span style={{ flexShrink: 0, fontSize: 10, fontWeight: 800, letterSpacing: "0.04em", textTransform: "uppercase", padding: "1px 5px", borderRadius: 3, background: statusKind === "fail" ? "var(--red-600)" : "#F2B91A", color: statusKind === "fail" ? "#fff" : "#3D2A00" }}>{statusKind}</span>
              )}
              <span style={{ flex: 1, minWidth: 0, fontSize: 14, color: rec.recommendation ? "var(--t-1)" : "var(--t-5)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{rec.recommendation || rec.text || "No recommendation added"}</span>
              {rec.total != null && <span style={{ flexShrink: 0, fontSize: 12, fontWeight: 600, color: "var(--t-3)", fontVariantNumeric: "tabular-nums" }}>${Number(rec.total).toFixed(0)}</span>}
            </div>
          );
        })}
      </div>
    );
  };

  return (
    <div style={{ background: "var(--bg-canvas)", flex: 1, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "10px 16px", background: "var(--bg-white)", borderBottom: "1px solid var(--b-1)" }}>
        <span style={{ fontSize: 14, color: "var(--t-3)" }}>Drag recommendations between groups to organize them for the customer presentation.</span>
      </div>
      <div style={{ padding: "16px 16px 24px", flex: 1, overflowY: "auto" }}>
        <div style={{ maxWidth: 1200, margin: "0 auto" }}>
          {ocr.length > 0 && (
            <>
              <div style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--t-3)", paddingLeft: 2, paddingBottom: 8 }}>Original Customer Concerns</div>
              {ocr.map((c, i) => renderConcern(c, String.fromCharCode(65 + i)))}
            </>
          )}
          {mpi.length > 0 && (
            <>
              <div style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--t-3)", paddingLeft: 2, paddingBottom: 8, marginTop: ocr.length > 0 ? 20 : 0 }}>Additional Service Concerns</div>
              {mpi.map(c => renderConcern(c, null))}
            </>
          )}
        </div>
      </div>
    </div>
  );
};

// ────────────────────────────────────────────────────────────
// Customer Preview Modal
// ────────────────────────────────────────────────────────────
const CustomerPreviewModal = ({ recConcerns, onClose, onDecisionsApplied }) => {
  const [decisions, setDecisions] = React.useState({});

  const decide = (recId, dec) =>
    setDecisions(d => ({ ...d, [recId]: d[recId] === dec ? null : dec }));

  const occs = recConcerns.filter(c => c.type === "occ");
  const ascs = recConcerns.filter(c => c.type !== "occ");

  const preApprovedTotal = recConcerns.reduce((s, c) => {
    if (!c.preApproved) return s;
    return s + (c.preApproved.labor || 0) + (c.preApproved.parts || 0) + (c.preApproved.misc || 0);
  }, 0);

  const allCustomerRecs = recConcerns.flatMap(c =>
    c.recs.filter(r => (r.shownToCustomer ?? 0) > 0 && r.recommendation)
  );
  const pendingTotal = allCustomerRecs.reduce((s, r) => s + (r.shownToCustomer || 0), 0);

  const getUrgency = (concern) => {
    const statuses = concern.recs.map(r => r.status).filter(Boolean);
    if (statuses.includes("fail")) return {
      label: "ACTION NEEDED SOON · SAFETY",
      hasIcon: true,
      textColor: "var(--red-600)",
      bg: "var(--red-50)",
      borderColor: "var(--red-100)",
      accentColor: "var(--red-500)",
    };
    if (statuses.includes("caution")) return {
      label: "RECOMMENDED",
      hasIcon: false,
      textColor: "var(--yellow-700)",
      bg: "var(--yellow-25)",
      borderColor: "var(--yellow-100)",
      accentColor: "var(--yellow-600)",
    };
    return {
      label: "RECOMMENDED",
      hasIcon: false,
      textColor: "var(--t-4)",
      bg: "#fff",
      borderColor: "var(--b-1)",
      accentColor: "var(--b-3)",
    };
  };

  // Single rec row — defined as a plain function to avoid inner-component remount issues
  const renderRec = (rec, isFirst) => {
    const decision = decisions[rec.id];
    const custPrice = rec.shownToCustomer;
    const isFree = custPrice === 0 && (rec.total || 0) > 0;
    const needsEstimate = rec.recommendation === null && rec.total === null;
    const isApproved = decision === "approved";
    const isDeclined = decision === "declined";

    if (needsEstimate) {
      return (
        <div key={rec.id} style={{ padding: "10px 0", borderTop: isFirst ? "none" : "1px solid var(--b-1)" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <span style={{ fontSize: 14, color: "var(--t-3)" }}>Estimate available on request</span>
            <button style={{ padding: "6px 14px", borderRadius: 7, border: "1.5px solid var(--blue-600)", background: "transparent", color: "var(--blue-600)", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
              Request estimate
            </button>
          </div>
        </div>
      );
    }

    if (!rec.recommendation) return null;

    return (
      <div key={rec.id} style={{ padding: "10px 0", borderTop: isFirst ? "none" : "1px solid var(--b-1)" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, marginBottom: custPrice > 0 ? 10 : 0 }}>
          <span style={{ fontSize: 14.5, fontWeight: 500, color: "var(--t-1)", flex: 1, lineHeight: 1.4 }}>{rec.recommendation}</span>
          {custPrice > 0 && (
            <span style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)", whiteSpace: "nowrap" }}>
              ${Number(custPrice).toFixed(2)}
            </span>
          )}
          {isFree && (
            <span style={{ fontSize: 14, color: "var(--green-600)", fontWeight: 600, whiteSpace: "nowrap" }}>Included · $0</span>
          )}
        </div>
        {rec.media && rec.media.photos > 0 && (
          <div style={{ fontSize: 14, color: "var(--blue-600)", marginBottom: 8, display: "flex", alignItems: "center", gap: 5 }}>
            <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            {rec.media.photos} photo{rec.media.photos !== 1 ? "s" : ""}
            {rec.media.videos > 0 ? ` · ${rec.media.videos} video${rec.media.videos !== 1 ? "s" : ""}` : ""} attached
          </div>
        )}
        {custPrice > 0 && (
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={() => decide(rec.id, "declined")}
              style={{
                flex: 1, height: 40,
                border: `1.5px solid ${isDeclined ? "var(--red-500)" : "var(--b-2)"}`,
                borderRadius: 8,
                background: isDeclined ? "var(--red-50)" : "#fff",
                color: isDeclined ? "var(--red-600)" : "var(--t-2)",
                fontWeight: 700, fontSize: 14, cursor: "pointer",
              }}>
              {isDeclined ? "Declined" : "Decline"}
            </button>
            <button
              onClick={() => decide(rec.id, "approved")}
              style={{
                flex: 1, height: 40, border: "none", borderRadius: 8,
                background: isApproved ? "var(--green-600)" : "var(--blue-600)",
                color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer",
              }}>
              {isApproved ? `✓ Approved` : `Approve $${Number(custPrice).toFixed(0)}`}
            </button>
          </div>
        )}
      </div>
    );
  };

  const renderOccCard = (concern) => {
    const paTotal = concern.preApproved
      ? (concern.preApproved.labor || 0) + (concern.preApproved.parts || 0) + (concern.preApproved.misc || 0)
      : 0;
    const pendableRecs = concern.recs.filter(r => (r.shownToCustomer ?? 0) > 0 && r.recommendation);
    const totalPendable = pendableRecs.reduce((s, r) => s + r.shownToCustomer, 0);
    const noneDecided = pendableRecs.length > 1 && pendableRecs.every(r => !decisions[r.id]);

    return (
      <div key={concern.id} style={{
        background: "#fff", borderRadius: 10,
        border: "1.5px solid var(--blue-100)",
        marginBottom: 10, overflow: "hidden",
        boxShadow: "var(--shadow-card)",
      }}>
        {/* "YOUR CONCERN" header */}
        <div style={{ padding: "7px 14px 6px", background: "var(--blue-25)", borderBottom: "1px solid var(--blue-100)" }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.07, textTransform: "uppercase", color: "var(--blue-600)" }}>
            Your concern
          </span>
        </div>
        <div style={{ padding: "12px 14px 10px" }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: "var(--t-1)", lineHeight: 1.3, marginBottom: paTotal > 0 ? 10 : 4, textTransform: "uppercase" }}>
            {concern.title}
          </div>
          {/* Pre-approved row */}
          {paTotal > 0 && (
            <div style={{
              display: "flex", alignItems: "center", gap: 8,
              padding: "7px 10px", background: "var(--green-50)",
              borderRadius: 7, marginBottom: 6,
            }}>
              <span style={{
                fontSize: 11, fontWeight: 700, letterSpacing: 0.05, textTransform: "uppercase",
                padding: "2px 6px", borderRadius: 4,
                background: "var(--green-100)", color: "var(--green-700)",
                flexShrink: 0,
              }}>Pre-approved</span>
              <span style={{ flex: 1, fontSize: 14, color: "var(--t-3)" }}>Already approved on check-in</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: "var(--green-700)" }}>${paTotal.toFixed(2)}</span>
            </div>
          )}
          {/* Recs */}
          {concern.recs.map((r, i) => renderRec(r, i === 0 && paTotal === 0))}
          {/* Approve all / save the trip CTA */}
          {noneDecided && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 10, marginTop: 2 }}>
              <button
                onClick={() => pendableRecs.forEach(r => decide(r.id, "approved"))}
                style={{ fontSize: 14, fontWeight: 700, color: "var(--blue-600)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
                Approve all (${totalPendable.toFixed(0)})
              </button>
              <button
                onClick={() => pendableRecs.forEach(r => decide(r.id, "declined"))}
                style={{ fontSize: 14, color: "var(--t-4)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
                Save the trip back
              </button>
            </div>
          )}
        </div>
      </div>
    );
  };

  const renderAscCard = (concern) => {
    const urg = getUrgency(concern);
    const pendableRecs = concern.recs.filter(r => (r.shownToCustomer ?? 0) > 0 && r.recommendation);
    const totalPendable = pendableRecs.reduce((s, r) => s + r.shownToCustomer, 0);
    const noneDecided = pendableRecs.length > 1 && pendableRecs.every(r => !decisions[r.id]);

    return (
      <div key={concern.id} style={{
        background: urg.bg, borderRadius: 10,
        border: `1.5px solid ${urg.borderColor}`,
        borderLeft: `4px solid ${urg.accentColor}`,
        marginBottom: 10, overflow: "hidden",
        boxShadow: "var(--shadow-card)",
      }}>
        {/* Urgency header */}
        <div style={{ padding: "7px 14px 0", display: "flex", alignItems: "center", gap: 6 }}>
          {urg.hasIcon && (
            <span style={{
              width: 10, height: 10, borderRadius: "50%",
              background: "var(--red-600)", flexShrink: 0, display: "inline-block",
            }} />
          )}
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 0.07, textTransform: "uppercase", color: urg.textColor }}>
            {urg.label}
          </span>
        </div>
        <div style={{ padding: "6px 14px 12px" }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: "var(--t-1)", lineHeight: 1.3, marginBottom: 4, textTransform: "uppercase" }}>
            {concern.title}
          </div>
          {/* Safety subtitle from first failing rec */}
          {urg.hasIcon && concern.recs.some(r => r.status === "fail" && r.recommendation) && (
            <div style={{ fontSize: 14, color: "var(--red-600)", marginBottom: 6, lineHeight: 1.4 }}>
              {concern.recs.find(r => r.status === "fail" && r.recommendation).recommendation.split("—")[0].trim()}
            </div>
          )}
          {concern.recs.map((r, i) => renderRec(r, i === 0))}
          {noneDecided && (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 10, marginTop: 2 }}>
              <button
                onClick={() => pendableRecs.forEach(r => decide(r.id, "approved"))}
                style={{ fontSize: 14, fontWeight: 700, color: "var(--blue-600)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
                Approve both (${totalPendable.toFixed(0)})
              </button>
              <button
                onClick={() => pendableRecs.forEach(r => decide(r.id, "declined"))}
                style={{ fontSize: 14, color: "var(--t-4)", background: "none", border: "none", cursor: "pointer", padding: 0 }}>
                Save the trip back
              </button>
            </div>
          )}
        </div>
      </div>
    );
  };

  return (
    <div
      style={{
        position: "fixed", inset: 0,
        background: "rgba(10,13,18,0.65)",
        zIndex: 500,
        display: "flex", justifyContent: "center", alignItems: "flex-start",
        overflowY: "auto",
