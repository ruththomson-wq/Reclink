/* Reclink design tokens — aligned to the myKaarma Design System.
   Neutral gray ladder (no beige); brand teal-blue as the single primary. */

:root {
  /* surface — myKaarma grays */
  --bg-canvas: #F5F5F5;       /* gray-100 */
  --bg-cream: #F5F5F5;        /* gray-100 (legacy name, now gray) */
  --bg-cream-soft: #FAFAFA;   /* gray-50 */
  --bg-white: #FFFFFF;        /* surface */
  --bg-gray: #F5F5F5;         /* gray-100 */

  /* text — myKaarma gray ladder */
  --t-1: #101828;  /* gray-900 */
  --t-2: #414651;  /* gray-700 */
  --t-3: #535862;  /* gray-600 */
  --t-4: #717680;  /* gray-500 */
  --t-5: #A4A7AE;  /* gray-400 */

  /* borders — myKaarma grays */
  --b-1: #E9EAEB;  /* gray-200 */
  --b-2: #D5D7DA;  /* gray-300 */
  --b-3: #A4A7AE;  /* gray-400 */

  /* primary — myKaarma brand teal-blue (#02679B) */
  --blue-700: #01476E;  /* brand-800 */
  --blue-600: #02679B;  /* brand-600 — THE primary */
  --blue-500: #0377B3;  /* brand-500 */
  --blue-400: #60A5FA;
  --blue-200: #BDD6EA;  /* brand-200 */
  --blue-100: #D3E4F1;  /* brand-100 */
  --blue-50:  #E9F1F8;  /* brand-50 */
  --blue-25:  #F4F8FC;  /* brand-25 */

  /* concern types */
  --occ-text: #01476E;
  --occ-bg:   #D3E4F1;
  --occ-strong:#02679B;

  --custom-text: #B0480A;
  --custom-bg:   #FBE0CB;

  --form-text: #1F6F4B;
  --form-bg:   #DCEEDD;

  --asc-cos-text: #535862;
  --asc-cos-bg:   #F0F1F3;

  /* status */
  --red-700: #9C2222;
  --red-600: #BE2C2C;
  --red-500: #D33B3B;
  --red-100: #FAE0E0;
  --red-50:  #FCEDED;

  --green-700: #1F6E2A;
  --green-600: #2A8736;
  --green-100: #DDEFDD;
  --green-50:  #ECF6EC;

  --yellow-700: #8A6D00;
  --yellow-600: #B68B00;
  --yellow-100: #FBEAB0;
  --yellow-50:  #FCF3D6;
  --yellow-25:  #FBF7E5;

  /* shadows — myKaarma neutral */
  --shadow-card: 0px 1px 2px 0px rgba(10, 13, 18, 0.05);
  --shadow-modal: 0px 12px 16px -4px rgba(16, 24, 40, 0.10), 0px 4px 6px -2px rgba(16, 24, 40, 0.05);

  /* type — myKaarma uses Lato as the sole UI face */
  --font-sans: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "SF Mono", ui-monospace, "Menlo", "Consolas", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: var(--font-sans); color: var(--t-1); scrollbar-gutter: stable; }
button { font-family: inherit; text-transform: uppercase; }
input, select, textarea { font-family: inherit; color: inherit; }

/* shared utilities */
.caps { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t-3); }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  padding: 2px 7px; border-radius: 4px; line-height: 1.45;
}
.pill.occ    { background: var(--occ-bg); color: var(--occ-text); border: none; }
.pill.custom { background: var(--custom-bg); color: var(--custom-text); }
.pill.form   { background: var(--form-bg);   color: var(--form-text); }
.pill.asc-cos{ background: var(--asc-cos-bg); color: var(--asc-cos-text); }
.pill.ungrouped { background: #F0F1F3; color: #535862; }
.pill.preapproved { background: var(--blue-100); color: var(--blue-700); text-transform: none; letter-spacing: 0.01em; font-weight: 600; font-size: 11px; padding: 3px 8px; border-radius: 999px; }
.pill.urgent { background: var(--red-100); color: var(--red-700); text-transform: none; letter-spacing: 0.01em; font-weight: 600; font-size: 11px; padding: 3px 8px; border-radius: 999px; }

/* form input */
.input, .select {
  width: 100%;
  height: 34px;
  background: var(--bg-white);
  border: 1px solid #D5D7DA;
  border-radius: 8px;
  padding: 0 10px;
  font-size: 13.5px;
  color: var(--t-1);
  outline: none;
  transition: border-color 120ms, box-shadow 120ms;
}
.input:focus, .select:focus {
  border-color: var(--blue-500);
  box-shadow: 0 0 0 4px rgba(2, 103, 155, 0.20);
}
.input.compact, .select.compact { height: 28px; padding: 0 8px; font-size: 12.5px; border-radius: 8px; }

.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--t-3);
  margin-bottom: 3px;
}

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 14px;
  border-radius: 6px;
  font-size: 14px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: background 100ms, border-color 100ms, color 100ms, transform 80ms;
  user-select: none;
}
.btn-link { text-transform: none; letter-spacing: 0; }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: var(--blue-600); color: #fff; border-color: var(--blue-600);
  /* Button/Reg spec for all primary CTAs */
  font-family: "Lato", sans-serif; font-size: 14px; font-style: normal; font-weight: 400;
  line-height: 20px; letter-spacing: 1.12px; text-transform: uppercase;
}
.btn-primary:hover { background: var(--blue-700); border-color: var(--blue-700); }
.btn-secondary { background: var(--bg-white); color: var(--t-1); border-color: var(--b-2); }
.btn-secondary:hover { background: var(--bg-cream); border-color: var(--b-3); }
.btn-danger-outline { background: var(--bg-white); color: var(--red-600); border-color: var(--red-500); }
.btn-danger-outline:hover { background: var(--red-50); }
.btn-ghost { background: transparent; color: var(--t-2); }
.btn-ghost:hover { background: var(--bg-gray); }
.btn-link { background: transparent; color: var(--blue-600); height: auto; padding: 0; border: none; outline: none; }
.btn-link:hover { text-decoration: underline; }
.btn-link:focus, .btn-link:focus-visible { outline: none; box-shadow: none; }

.checkbox {
  appearance: none;
  width: 18px; height: 18px;
  border: 1.5px solid #D5D7DA;
  border-radius: 4px;
  background: var(--bg-white);
  display: inline-grid; place-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 100ms, border-color 100ms;
}
.checkbox:checked {
  background: var(--blue-600);
  border-color: var(--blue-600);
}
.checkbox:checked::after {
  content: "";
  width: 10px; height: 6px;
  border-left: 2px solid #fff;
  border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translate(1px, -1px);
}

.radio {
  appearance: none;
  width: 18px; height: 18px;

/* scrollbars (subtle) */
.scrollable::-webkit-scrollbar { width: 10px; height: 10px; }

});
window.addEventListener('unhandledrejection', function(e) {

});
</script>

const IconInfoFilled = ({ size = 14, style = {}, title: tipText, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ flexShrink: 0, cursor: "help", ...style }} {...rest}>

  </svg>
);
const InfoTooltip = ({ tip, size = 13, style = {}, align = "center" }) => {
  const [visible, setVisible] = React.useState(false);
  const [below, setBelow] = React.useState(false);
  const ref = React.useRef(null);
  const handleEnter = () => {
    if (ref.current) {
      const rect = ref.current.getBoundingClientRect();
      setBelow(rect.top < window.innerHeight / 2);
    }
    setVisible(true);
  };
  // "right" anchors the tooltip's right edge to the icon instead of centering it — for an icon
  // that sits near the right edge of a narrow, clipped (overflow: hidden) container, centering
  // would push the tooltip past that edge and get cut off.
  const horizontal = align === "right"
    ? { right: 0, left: "auto", transform: "none" }
    : { left: "50%", transform: "translateX(-50%)" };
  const arrowHorizontal = align === "right"
    ? { right: 10, left: "auto", transform: "none" }
    : { left: "50%", transform: "translateX(-50%)" };
  return (
    <span ref={ref} style={{ position: "relative", display: "inline-flex", alignItems: "center", flexShrink: 0, ...style }}
      onMouseEnter={handleEnter} onMouseLeave={() => setVisible(false)}>
      <IconInfoFilled size={size} style={{ color: "var(--t-4)" }} />
      {visible && (
        <span style={{
          position: "absolute",
          ...(below
            ? { top: "calc(100% + 6px)", bottom: "auto" }
            : { bottom: "calc(100% + 6px)", top: "auto" }),
          ...horizontal,
          background: "#101828", color: "#fff",
          fontSize: 14, lineHeight: 1.5, fontWeight: 400,
          padding: "7px 10px", borderRadius: 6,
          boxShadow: "0 4px 16px rgba(0,0,0,0.22)",
          width: 230, whiteSpace: "normal",
          zIndex: 9999, pointerEvents: "none",
        }}>
          {tip}
          {/* Arrow pointing toward the icon */}
          <span style={{
            position: "absolute",
            ...(below
              ? { bottom: "100%", top: "auto", borderBottom: "5px solid #101828", borderTop: "none" }
              : { top: "100%", bottom: "auto", borderTop: "5px solid #101828", borderBottom: "none" }),
            ...arrowHorizontal,
            width: 0, height: 0,
            borderLeft: "5px solid transparent", borderRight: "5px solid transparent",
          }} />
        </span>
      )}
    </span>
  );
};

// Cell that morphs between previous/new amount with a soft strike-through transition
const PriceCell = ({ amount, positive, negative }) => {
  const prevRef = React.useRef(amount);
  const [showPrev, setShowPrev] = React.useState(false);
  const [prev, setPrev] = React.useState(amount);

  React.useEffect(() => {
    if (amount !== prevRef.current) {
      setPrev(prevRef.current);
      setShowPrev(true);
      const t = setTimeout(() => setShowPrev(false), 380);
      prevRef.current = amount;
      return () => clearTimeout(t);
    }
  }, [amount]);

  const color = amount === 0
    ? "var(--t-4)"
    : positive
      ? "var(--t-1)"
      : "var(--green-700)";

  const sign = negative && amount > 0 ? "−" : "";

  return (
    <div style={{ textAlign: "right", fontVariantNumeric: "tabular-nums", position: "relative" }}>
      {showPrev && (
        <span style={{
          position: "absolute",
          right: 0, top: -14,
          fontSize: 14,
          color: "var(--t-4)",
          textDecoration: "line-through",
          opacity: 0.7,
          animation: "tfFadeOut 380ms forwards",
        }}>
          {prev > 0 ? `${negative ? "−" : ""}$${prev.toFixed(2)}` : "—"}
        </span>
      )}
      <span style={{ fontSize: 14, fontWeight: amount > 0 ? 600 : 500, color }}>
        {amount > 0 ? `${sign}$${amount.toFixed(2)}` : "—"}
      </span>
    </div>
  );
};

// ── Auto-growing textarea that also keeps a manual drag-resize handle.
// Grows to fit content; if the user drags the corner handle taller, that
// height is respected as a floor on subsequent edits.
const AutoGrowTextarea = ({ value, onChange, minHeight = 34, ...rest }) => {
  const ref = React.useRef(null);
  const manualH = React.useRef(0);

  const grow = React.useCallback(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = Math.max(el.scrollHeight, manualH.current, minHeight) + "px";
  }, [minHeight]);

  React.useLayoutEffect(() => { grow(); }, [value, grow]);

  return (
    <textarea
      ref={ref}
      value={value}
      onChange={(e) => { onChange(e); grow(); }}
      onInput={grow}
      onMouseUp={(e) => {
        // capture a manual drag-resize as the new floor
        const h = e.currentTarget.offsetHeight;
        if (h > manualH.current) manualH.current = h;
      }}
      rows={1}
      style={{
        width: "100%", minHeight, boxSizing: "border-box",
        border: "1px solid #D5D7DA", borderRadius: 8,
        padding: "7px 8px", fontSize: 14, fontFamily: "inherit", lineHeight: 1.4,
        resize: "vertical", overflow: "hidden", outline: "none",
        background: "var(--bg-white)",
        ...rest.style,
      }}
      {...(() => { const { style, ...r } = rest; return r; })()}
    />
  );
};

// Default grade mapping (matches the tire-tread example: 0–3 fail, 4 caution, 5+ pass)
const defaultGradeOf = (n) => (n == null ? null : n <= 3 ? "fail" : n === 4 ? "caution" : "pass");

const NumericGradeScale = ({ value, onPick, max = 10, gradeOf = defaultGradeOf }) => {
  const nums = [...Array(max).keys()]; // 0..max-1
  const cell = (n, label) => {
    const g = gradeOf(n);
    const p = gradePalette[g] || gradePalette.na;
    const active = value === n;
    return (
      <button
        key={n}
        onClick={() => onPick(n)}
        style={{
          height: 30, padding: "0 6px",
          background: active ? p.activeBg : p.idleBg,
          color: active ? p.activeC : p.idleC,
          border: `1.5px solid ${active ? p.activeBg : p.border}`,
          borderRadius: 5, fontSize: 14, fontWeight: 700,
          fontFamily: "var(--font-mono)", fontVariantNumeric: "tabular-nums",
          cursor: "pointer", transition: "background 100ms, color 100ms, border-color 100ms",
        }}
      >{label}</button>
    );
  };
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(38px, 1fr))", gap: 6 }}>
      {nums.map((n) => cell(n, String(n)))}
      {cell(max, `${max}+`)}

};

  const grades = TIRE_POSITIONS
    .map((p) => readings[p.key])

  if (!grades.length) return null;
  if (grades.includes("fail")) return "fail";

};

// ── Search field that queries form/inspection items by name.
// Shows full list on focus; filters as you type; highlights matching letters.
// linkedLabel: if provided, shows a "Use linked concern" shortcut at the top.
const FormItemSearchField = ({ value = "", onChange, formItems = [], placeholder = "Search for a concern", linkedLabel = "", autoOpen = false, keepQueryOnCustom = false }) => {
  const [query, setQuery] = React.useState(value);
  const [open, setOpen] = React.useState(autoOpen);
  const wrapRef = React.useRef(null);
  const inputRef = React.useRef(null);
  React.useEffect(() => { if (autoOpen) inputRef.current?.focus(); }, []);

  React.useEffect(() => { setQuery(value); }, [value]);

  React.useEffect(() => {
    const handler = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const filtered = React.useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return formItems;
    return formItems.filter(item => item.name.toLowerCase().includes(q));
  }, [query, formItems]);

  // Wrap matching substring in a highlight span
  const highlight = (text, q) => {
    if (!q.trim()) return <span>{text}</span>;
    const idx = text.toLowerCase().indexOf(q.toLowerCase().trim());
    if (idx === -1) return <span>{text}</span>;
    const len = q.trim().length;
    return (
      <span>
        {text.slice(0, idx)}
        <mark style={{ background: "var(--yellow-100)", color: "var(--yellow-700)", borderRadius: 2, padding: "0 1px", fontWeight: 700 }}>{text.slice(idx, idx + len)}</mark>
        {text.slice(idx + len)}
      </span>
    );
  };

  const statusColors = {
    fail:    { bg: "var(--red-600)",    t: "#fff",              label: "Fail" },
    caution: { bg: "#F2B91A",           t: "#3D2A00",           label: "Caution" },
    pass:    { bg: "var(--green-100)",  t: "var(--green-700)",  label: "Pass" },
  };

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <div style={{ position: "relative" }}>
        <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)", color: "var(--t-4)", pointerEvents: "none", display: "flex" }}>
          <IconSearch size={14} />
        </span>
        <input
          ref={inputRef}
          className="input"
          value={query}
          placeholder={placeholder}
          onFocus={() => setOpen(true)}
          onChange={e => { setQuery(e.target.value); onChange && onChange(e.target.value, null); }}
          style={{ paddingLeft: 32, height: 36 }}
        />
      </div>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 400,
          background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 7,
          boxShadow: "var(--shadow-modal)", display: "flex", flexDirection: "column",
        }}>
          {/* Scrollable inspection items */}
          <div style={{ maxHeight: 200, overflowY: "auto" }} className="scrollable">
            {filtered.length === 0 ? (
              <div style={{ padding: "12px 14px", fontSize: 14, color: "var(--t-4)" }}>No matches</div>
            ) : filtered.map(item => (
              <div
                key={item.id}
                onMouseDown={e => { e.preventDefault(); setQuery(item.name); onChange && onChange(item.name, item); setOpen(false); }}
                style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "9px 12px", cursor: "pointer", borderBottom: "1px solid var(--b-1)" }}
                onMouseEnter={e => e.currentTarget.style.background = "var(--bg-cream)"}
                onMouseLeave={e => e.currentTarget.style.background = ""}
              >
                <span style={{ fontSize: 14, color: "var(--t-1)" }}>{highlight(item.name, query)}</span>
                {item.status && statusColors[item.status] && (
                  <span className="pill" style={{ background: statusColors[item.status].bg, color: statusColors[item.status].t, textTransform: "none", letterSpacing: 0.02, flexShrink: 0 }}>{statusColors[item.status].label}</span>
                )}
              </div>
            ))}
          </div>
          {/* "Keep custom" — always pinned at bottom */}
          <div
            onMouseDown={e => { e.preventDefault(); if (!keepQueryOnCustom) setQuery(""); onChange && onChange(keepQueryOnCustom ? query : "", { id: "__custom__", name: keepQueryOnCustom ? query : "" }); setOpen(false); }}
            style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px", cursor: "pointer", borderTop: "1px solid var(--b-2)", background: "var(--blue-25)", flexShrink: 0 }}
            onMouseEnter={e => e.currentTarget.style.background = "var(--blue-50)"}
            onMouseLeave={e => e.currentTarget.style.background = "var(--blue-25)"}
          >
            <IconX size={13} style={{ color: "var(--blue-500)", flexShrink: 0 }} />
            <span style={{ fontSize: 14, fontWeight: 600, color: "var(--blue-600)" }}>{query.trim() ? `Keep "${query.trim()}" — not an inspection question` : "Keep custom — not an inspection question"}</span>
          </div>
        </div>
      )}
    </div>
  );
};

              </div>
              <select className="select compact" value={row.eta} onChange={e=>up(row.id,{eta:e.target.value})} style={{ width: 98, flexShrink: 0, fontSize: 14 }}>
                <option>Later today</option><option>Tomorrow</option><option>2 days</option><option>3+ days</option>
              </select>
              <div style={{ width: 52, flexShrink: 0, textAlign: "right", fontSize: 13, fontWeight: 600, color: tot?"var(--t-1)":"var(--t-4)", fontVariantNumeric: "tabular-nums" }}>${tot.toFixed(2)}</div>
              <button onClick={()=>del(row.id)} style={{ width: 24, height: 24, flexShrink: 0, background: "transparent", border: "none", color: "var(--t-4)", cursor: "pointer", display: "grid", placeItems: "center", borderRadius: 4, padding: 0 }}
                onMouseEnter={e=>e.currentTarget.style.color="var(--red-500)"} onMouseLeave={e=>e.currentTarget.style.color="var(--t-4)"}
              ><IconTrash size={13} /></button>
            </div>
            {row.checked && (
              <div style={{ paddingLeft: 38, paddingBottom: 5, display: "flex", alignItems: "center", gap: 6 }}>
                <input type="checkbox" className="checkbox" checked={!!row.coreChecked} onChange={e=>up(row.id,{coreChecked:e.target.checked})} style={{ width: 13, height: 13 }} />
                <span style={{ fontSize: 14, color: "var(--t-2)", fontWeight: 500 }}>Core charge</span>
                <InfoTooltip tip="A refundable deposit for a returnable part core." size={12} />
              </div>
            )}
            {row.dmsWarning && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px 6px 38px", background: "#FFFBEB", borderTop: "1px solid #F3DDA1" }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D97706" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <span style={{ fontSize: 14, color: "#92400E", lineHeight: 1.4 }}>DMS connection intermittent. Showing last used price and parts details for this part.</span>
              </div>
            )}
          </div>
        );
      })}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 10px", background: "var(--bg-cream-soft)" }}>
        <button className="btn btn-ghost" style={{ height: 28, padding: "0 10px", color: "var(--blue-600)", fontWeight: 700, fontSize: 13, display: "inline-flex", alignItems: "center", gap: 5 }} onClick={add}>
          <IconPlus size={13} /> ADD PART
        </button>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
          <span style={{ color: "var(--t-3)", fontSize: 13, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }}>Repair Estimate Subtotal</span>
          <span style={{ fontSize: 15, fontWeight: 700 }}>${sub.toFixed(2)}</span>
        </div>
      </div>
    </div>
  );
};

const RecEditorModal = ({
  initialSection = null,
  inspectionPoint = "Inspect brakes",
  inspectionDetail = "1mm front",
  inspectionResult = "failed",
  defaultConcern = "current",
  concernOptions = null,
  lockedConcern = false,
  lockedConcernLabel = "",
  defaults = {},
  showPriorDecline = true,
  variant = "modal",
  tire = null,
  mpiPoints = [],
  preLinked = false,
  isNewRec = false,
  sourceType = null,
  sourceConcernTitle = "",
  ownConcernTitle = null,
  allConcerns = [],
  formItems = [],
  inspectionMedia = null,
  onTireReading,
  onSave,
  onClose,
  onDelete,
  onPreviewChange,
  externalConcernId = null,
  phase = 1,
  isPreApproved = false,
  jumpTarget = null,
  onJumpConfirmed,
  onJumpCancelled,
}) => {
  const isPanel = variant === "panel";
  const [dirty, setDirty] = React.useState(false);
  const [confirmClose, setConfirmClose] = React.useState(false);
  const [pendingJump, setPendingJump] = React.useState(null);
  const handleClose = () => { if (dirty) { setConfirmClose(true); } else { onClose(); } };
  // Jump-to-another-recommendation (from the live preview panel), without closing this modal.
  // If there are unsaved changes, ask first — otherwise switch immediately.
  React.useEffect(() => {
    if (!jumpTarget) return;
    if (dirty) { setPendingJump(jumpTarget); }
    else { onJumpConfirmed && onJumpConfirmed(jumpTarget); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [jumpTarget]);
  // Shared payload builder — used by both the Save button and "Save & Switch".
  const buildSavePayload = () => ({
    concern: (preLinked || lockedConcern || isNewRec) ? currentPlacementId : ((concernManuallyLinked && linkedConcernId) ? linkedConcernId : concern),
    customConcernName, whatNeedsDone, opCode, laborType, hours, labor, parts, misc, total, hidePrice,
    tireReadings: (isTire || copyFieldsIsTire) ? tireReadings : null,
    status,
    media: inspectionMedia,
    formItemPointId: formItemCommittedId,
    partsList: itemized.map((r) => ({ name: r.desc || r.partNo || "Part", qty: Number(r.qty) || 1, price: Number(r.sell) || 0 })),
    partsRows: itemized,
  });
  const [onboardingDone, setOnboardingDone] = React.useState(false);
  const [onboardingDismissed, setOnboardingDismissed] = React.useState(false);
  const showOnboarding = !onboardingDone && !onboardingDismissed;

  // isFirstView: true only on the very first modal open per page load — controls NEW badge only
  // sessionStorage persists across React mounts/unmounts but clears on page reload
  const [isFirstView] = React.useState(() => sessionStorage.getItem('_mpiObShown') !== '1');
  React.useEffect(() => { sessionStorage.setItem('_mpiObShown', '1'); }, []);


  // ── Progressive disclosure for isNewRec (+Custom toolbar) flow
  // Fields reveal automatically once the user picks an existing concern OR starts typing a name.
  const [concernStepDone, setConcernStepDone] = React.useState(false);
  const recFieldsVisible = true;
  React.useEffect(() => {
    if (isNewRec && recFieldsVisible) {
      setTimeout(() => { document.getElementById("rec-whatneedsdone")?.focus(); }, 80);
    }
  }, [recFieldsVisible]);

  // ── New placement-section state (used when preLinked || lockedConcern)
  const [newBannerDismissed, setNewBannerDismissed] = React.useState(false);
  const [userPickedConcern, setUserPickedConcern] = React.useState(preLinked);
  const [autoConcernLocked, setAutoConcernLocked] = React.useState(false);
  const [changingPlacement, setChangingPlacement] = React.useState(false);
  const [placementDropdownOpen, setPlacementDropdownOpen] = React.useState(false);
  const [placementSearch, setPlacementSearch] = React.useState("");
  const placementDropdownRef = React.useRef(null);
  const placementSearchRef = React.useRef(null);
  // For a locked-concern (fail/caution) rec, defaultConcern is the point's own synthetic
  // "mpi:<id>" concern — but the toggle should default to "Keep rec by itself", same as a
  // brand-new +Custom rec, rather than pre-selecting "Link to a concern". Saving with
  // "__unlinked__" already resolves to a standalone concern named after the inspection point
  // (see the onSave handler), so this doesn't lose the point-name binding.
  const [currentPlacementId, setCurrentPlacementId] = React.useState(lockedConcern ? "__unlinked__" : defaultConcern);
  // Shared with the isNewRec/lockedConcern placement toggle further below, and with the
  // "concern name" section of the unified inspection-result box: true once the "Link to a
  // concern" segment is active (a concern is chosen, or its dropdown is open).
  const underMode = currentPlacementId !== "__unlinked__" || placementDropdownOpen;
  // Sync external concern changes (e.g. dragging "Current rec" or clicking "New concern" in preview)
  React.useEffect(() => {
    if (externalConcernId) {
      setCurrentPlacementId(externalConcernId);
      setUserPickedConcern(externalConcernId !== "__unlinked__");
      setAutoConcernLocked(false);
      setChangingPlacement(false);
    }
  }, [externalConcernId]);
  const [customConcernName, setCustomConcernName] = React.useState("");
  const [formItemQuery, setFormItemQuery] = React.useState(lockedConcern ? (inspectionPoint || "") : "");
  // Derive display info for the PLACEMENT dropdown — computed here (rather than further below)
  // because formItemCommitted's initial value depends on placementTitle; referencing it before
  // this declaration silently evaluated to undefined (no start-committed state for preLinked recs).
  // Never match the generic "__unlinked__" standalone entry itself here — its title ("Keep rec by
  // itself") is only meant for the dropdown row, not for what the top bar displays when a
  // lockedConcern rec is sitting at its own natural placement. Excluding it here means
  // placementTitle correctly falls through to sourceConcernTitle/inspectionPoint (the MPI point's
  // own name) instead.
  const placementConcernObj = allConcerns.find(c => c.id === currentPlacementId && c.id !== "__unlinked__");
  const placementTypeStr = placementConcernObj ? (placementConcernObj.type === "occ" ? "occ" : "asc") : (sourceType || "asc");
  const placementTypeLabel = placementTypeStr === "occ" ? "OCC" : "ASC";
  const placementTitle = placementConcernObj ? placementConcernObj.title : (sourceConcernTitle || inspectionPoint || "");
  // A brand-new rec (from +Custom or +Concern) that hasn't been placed under an existing concern
  // yet — the "Concern name" field the user is typing into IS what it'll show under once saved,
  // so the bar should preview that live instead of reading "Unlinked" the whole time.
  const isBrandNewUnlinked = isNewRec && !lockedConcern && currentPlacementId === "__unlinked__";
  // True whenever the bar has something concrete to show under: an actual linked/relinked concern,
  // a lockedConcern rec sitting at its own natural inspection point (never really "unlinked"), or
  // a brand-new rec (which will always land under a new ASC concern once saved, even before a
  // name's been typed — so the bar previews that from the start instead of reading "Unlinked").
  const showsUnderSomething = currentPlacementId !== "__unlinked__" || lockedConcern || isBrandNewUnlinked;
  const displayPlacementTypeLabel = isBrandNewUnlinked ? "ASC" : placementTypeLabel;
  const displayPlacementTitle = isBrandNewUnlinked ? (customConcernName.trim() || "New concern") : placementTitle;
  // Pull-inspection-question only starts pre-committed for the true lockedConcern flow (the rec
  // IS a specific MPI point). preLinked (already grouped under a concern) does NOT imply a
  // question was ever pulled — that field should start blank/interactive so the user can
  // optionally search, same as the reference behavior.
  const [formItemCommitted, setFormItemCommitted] = React.useState(
    (lockedConcern && inspectionPoint) ? inspectionPoint : null
  );
  const [formItemCommittedId, setFormItemCommittedId] = React.useState(null);
  const [formSearchKey, setFormSearchKey] = React.useState(0);
  const [keepCustom, setKeepCustom] = React.useState(false);

  const [linkTourDismissed, setLinkTourDismissed] = React.useState(() => {
    try { return localStorage.getItem("reclink_link_tour_seen") === "1"; } catch (e) { return false; }
  });
  // The coach-mark tour targets the older "Link to existing concern" panel used when editing a
  // freely-linked rec — it doesn't apply to the simpler Keep-rec-by-itself/Link-to-a-concern
  // toggle (used for both the brand-new +Custom flow and locked-concern fail/caution recs), and
  // (since that toggle doesn't render the tour's zIndex-102 spotlight/backdrop callout) leaving it
  // active there would let the full-body dim backdrop silently swallow the toggle's first click
  // instead of dismissing.
  const linkTourActive = phase === 2 && !linkTourDismissed && !isNewRec && !lockedConcern && !isPreApproved;
  const dismissLinkTour = () => {
    setLinkTourDismissed(true);
    try { localStorage.setItem("reclink_link_tour_seen", "1"); } catch (e) {}
  };

  // Close placement dropdown on outside click
  React.useEffect(() => {
    const handler = (e) => { if (placementDropdownRef.current && !placementDropdownRef.current.contains(e.target)) { setPlacementDropdownOpen(false); setPlacementSearch(""); setChangingPlacement(false); } };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);
  // Focus search input when dropdown opens
  React.useEffect(() => {
    if (placementDropdownOpen) setTimeout(() => placementSearchRef.current?.focus(), 30);
    else setPlacementSearch("");
  }, [placementDropdownOpen]);

  // When preLinked: show search bar (inputMode) + AddedToTag below with UNLINK
  const [concern, setConcern] = React.useState(preLinked ? "new-form-concern" : defaultConcern);
  const [concernManuallyLinked, setConcernManuallyLinked] = React.useState(preLinked);
  const [linkedConcernId, setLinkedConcernId] = React.useState(preLinked ? defaultConcern : null);
  const [showLinkPicker, setShowLinkPicker] = React.useState(false);
  // Derive a display title from the selected concern option
  const allOptions = (concernOptions || []).flatMap((g) => g.items || []);
  const selectedOption = allOptions.find((o) => o.id === concern);
  const displayTitle = (selectedOption && selectedOption.type !== "ungrouped" ? selectedOption.title.replace(" (current)", "") : null) || inspectionPoint || "New recommendation";
  // When an MPI inspection point is chosen, mirror its result UI (tire grid vs status).
  const linkedPoint = (typeof concern === "string" && concern.indexOf("mpi:") === 0)
    ? mpiPoints.find((p) => ("mpi:" + p.id) === concern) || null : null;
  // Also check the form item selected via "Copy fields from inspection"
  const formLinkedPoint = formItemCommittedId
    ? (formItems || []).find(p => p.id === formItemCommittedId) || null
    : null;
  const isTire = linkedPoint ? linkedPoint.type === "tire" : !!tire;
  // Separate flag: tire point selected via "Copy fields" (grid lives inside the top box, not below)
  const copyFieldsIsTire = !!formLinkedPoint && formLinkedPoint.type === "tire";
  const [whatNeedsDone, setWhatNeedsDone] = React.useState(defaults.whatNeedsDone ?? "");
  const [opCode, setOpCode] = React.useState(defaults.opCode ?? "BRK-PAD-FR");
  const [laborType, setLaborType] = React.useState(defaults.laborType ?? "C20");
  const [hours, setHours] = React.useState(defaults.hours ?? "1.5");
  const [labor, setLabor] = React.useState(defaults.labor ?? "200");
  const [parts, setParts] = React.useState(defaults.parts ?? "125");
  const [misc, setMisc] = React.useState(defaults.misc ?? "0");
  const [hidePrice, setHidePrice] = React.useState(defaults.hidePrice ?? false);
  const [itemized, setItemized] = React.useState(defaults.partsRows ?? []);
  const partsSubtotal = itemized.reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.sell) || 0), 0);
  // When itemized parts exist, the Parts $ total tracks their subtotal.
  React.useEffect(() => { if (itemized.length) setParts(partsSubtotal.toFixed(2)); }, [partsSubtotal, itemized.length]);
  const [notes, setNotes] = React.useState(defaults.notes ?? "");
  const [decline, setDecline] = React.useState(showPriorDecline);
  const [status, setStatus] = React.useState(
    isNewRec ? (inspectionResult === "failed" ? "fail" : inspectionResult || null) : (defaults.status ?? (inspectionResult === "failed" ? "fail" : inspectionResult))
  );
  const [tireReadings, setTireReadings] = React.useState(tire?.readings ?? {});
  React.useEffect(() => { if (tire?.readings) setTireReadings(tire.readings); }, [tire]);
  // Mirror the chosen inspection point's existing result into the editor.
  React.useEffect(() => {
    if (!linkedPoint) return;
    if (linkedPoint.type === "tire") setTireReadings(linkedPoint.readings || {});
    else if (linkedPoint.status) setStatus(linkedPoint.status);
  }, [concern]);
  // Mirror the "Copy fields from inspection" selected point.
  React.useEffect(() => {
    if (!formLinkedPoint) return;
    if (formLinkedPoint.type === "tire") setTireReadings(formLinkedPoint.readings || {});
    else if (formLinkedPoint.status) setStatus(formLinkedPoint.status);
  }, [formItemCommittedId]);
  const handleTire = (pos, n) => {
    setTireReadings((r) => ({ ...r, [pos]: n }));
    onTireReading && onTireReading(pos, n);
  };
  const effStatus = (isTire || copyFieldsIsTire) ? tireWorstGrade(tireReadings) : status;

  const total = (Number(labor) || 0) + (Number(parts) || 0) + (Number(misc) || 0);

  // Live preview — notify parent whenever concern selection or rec text changes.
  // The modal has two concern-selection paths:
  //   NEW flow (preLinked / lockedConcern / isNewRec): uses currentPlacementId
  //   OLD flow (standalone toolbar): uses concern / linkedConcernId / concernManuallyLinked
  React.useEffect(() => {
    if (!onPreviewChange) return;
    let effectiveId;
    if (preLinked || lockedConcern || isNewRec || currentPlacementId || autoConcernLocked) {
      // New placement system — currentPlacementId is the source of truth.
      // autoConcernLocked covers form-item clicks where the concern name is known
      // but currentPlacementId hasn't been set yet (no existing concern to link to).
      effectiveId = currentPlacementId || "__unlinked__";
    } else {

      effectiveId = ((preLinked || concernManuallyLinked) && linkedConcernId) ? linkedConcernId : concern;
    }
    const isNew = typeof effectiveId === "string" && effectiveId.startsWith("new:");
    // For locked MPI concerns the effectiveId is "mpi:xxx" — not in concerns or recConcerns.

    const customNameForPreview = isNew ? effectiveId.slice(4)

    onPreviewChange({
      concernId: isNew ? "__new_custom__" : effectiveId,
      customName: customNameForPreview,
      recText: whatNeedsDone,
      status,
    });
  }, [concern, linkedConcernId, concernManuallyLinked, currentPlacementId, autoConcernLocked, whatNeedsDone, customConcernName, status, lockedConcernLabel]);

  const statusColor = {
    fail:    { bg: "var(--red-600)",    t: "#fff",              label: "fail" },
    caution: { bg: "#F2B91A",           t: "#3D2A00",           label: "caution" },
    pass:    { bg: "var(--green-100)",  t: "var(--green-700)",  label: "pass" },
    na:      { bg: "var(--bg-cream)",   t: "var(--t-3)",        label: "N/A" },
    ni:      { bg: "var(--bg-cream)",   t: "var(--t-4)",        label: "not inspected" },
  }[status] || { bg: "var(--red-100)", t: "var(--red-700)", label: status };
  const headStatus = {
    fail:    { bg: "var(--red-600)",    t: "#fff",              label: "fail" },
    caution: { bg: "#F2B91A",           t: "#3D2A00",           label: "caution" },
    pass:    { bg: "var(--green-100)",  t: "var(--green-700)",  label: "pass" },
    na:      { bg: "var(--bg-cream)",   t: "var(--t-3)",        label: "N/A" },
    ni:      { bg: "var(--bg-cream)",   t: "var(--t-4)",        label: "not inspected" },
  }[effStatus] || statusColor;

  return (
    <div style={{
      width: "100%",
      maxWidth: isPanel ? "none" : 880,
      margin: isPanel ? 0 : "0 auto",
      height: isPanel ? "100vh" : "auto",
      maxHeight: isPanel ? "100vh" : "90vh",
      display: "flex", flexDirection: "column",
      background: "var(--bg-white)",
      borderRadius: isPanel ? 0 : 12,
      boxShadow: "var(--shadow-modal)",
      overflow: "hidden",
      border: isPanel ? "none" : "1px solid var(--b-1)",
      borderLeft: isPanel ? "1px solid var(--b-1)" : undefined,
    }}>
      {/* Header + placement bar — combined into one cohesive section at the top: the title row

      <div style={{ flexShrink: 0, borderBottom: "1px solid var(--b-1)" }}>
        <div style={{
          display: "flex", alignItems: "center", gap: 12,
          padding: phase === 2 ? "16px 28px 4px" : "18px 28px",
        }}>
          <div style={{
            width: 30, height: 30, borderRadius: 999, flexShrink: 0,
            background: "var(--blue-50)",
            color: "var(--blue-600)",

          }}>
            <IconPencil size={16} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)", letterSpacing: 0.01 }}>{isPreApproved ? (sourceConcernTitle || "Pre-Approved") : (lockedConcern ? inspectionPoint : (preLinked ? (formItemCommitted || ownConcernTitle || sourceConcernTitle || "Recommendation") : (formItemCommitted || (currentPlacementId !== "__unlinked__" ? placementTitle : (inspectionPoint === "Custom recommendation" ? "Custom Recommendation" : "Recommendation")))))}</span>
            </div>
          </div>
          <button onClick={handleClose} style={{
            width: 26, height: 26, borderRadius: 5,
            background: "transparent", border: "none", cursor: "pointer",
            color: "var(--t-3)",
            display: "grid", placeItems: "center",
          }}>
            <IconX size={16} />
          </button>
        </div>

        {/* Placement sub-row — shown directly under the title for every editable rec, unconditionally
            (pre-approved recs get a plain read-only version, no Change button, since they're

            picked (whether that's the rec's natural home concern or one it was manually relinked
            to — "shows under" reads correctly either way), or "Unlinked" otherwise. Clicking Change
            opens the concern picker inline; the outside-click handler above resets both
            placementDropdownOpen and changingPlacement so clicking away always reverts cleanly back
            to this bar instead of leaving nothing shown. */}
        {phase === 2 && (isPreApproved ? (
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 28px 14px" }}>

            <span className={`pill ${placementTypeStr === "occ" ? "occ" : "asc-cos"}`} style={{ flexShrink: 0 }}>{placementTypeLabel}</span>

            <span style={{ fontSize: 14, fontWeight: 500, color: "var(--t-1)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{placementTitle}</span>
          </div>
        ) : (
          <div ref={placementDropdownRef} style={{ position: "relative" }}>

                  <span style={{ fontSize: 14, fontWeight: 500, color: "var(--t-1)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, minWidth: 0 }}>{displayPlacementTitle}</span>
                  <button

              ) : (
                <>
                  <span style={{ fontSize: 14, fontWeight: 500, color: "var(--t-4)", flexShrink: 0 }}>Unlinked</span>
                  <span style={{ flex: 1 }} />
                  <button
                    className="btn btn-secondary"
                    onClick={() => { setChangingPlacement(showsUnderSomething); setPlacementDropdownOpen(o => !o); }}

            {placementDropdownOpen && (

              position: "absolute", top: "100%", left: 28, right: 28, zIndex: 50,
              background: "var(--bg-white)", border: "1px solid var(--b-2)", borderRadius: 8,
              boxShadow: "0 8px 24px rgba(0,0,0,0.14)", maxHeight: 260, overflowY: "auto",
            }} className="scrollable">
              <div style={{ padding: "8px 10px 4px" }}>
                <input
                  ref={placementSearchRef}
                  value={placementSearch}
                  onChange={e => setPlacementSearch(e.target.value)}
                  placeholder="Search concerns..."
                  style={{ width: "100%", height: 32, padding: "0 10px", border: "1px solid #D5D7DA", borderRadius: 8, fontSize: 14, outline: "none", background: "var(--bg-cream-soft)" }}
                />
              </div>
              {(() => {
                const q = placementSearch.trim().toLowerCase();
                const matchesQ = (title) => !q || title.toLowerCase().includes(q);
                const occItems = allConcerns.filter(c => c.type === "occ" && matchesQ(c.title));
                const ascItems = allConcerns.filter(c => c.type !== "occ" && c.id !== "__unlinked__" && matchesQ(c.title));
                const standaloneEntry = allConcerns.find(c => c.id === "__unlinked__");
                const genericStandaloneLabels = ["Keep rec by itself", "Keep by itself", "Keep standalone", "Keep standalone (no concern)", "Add a custom concern", "Unlinked"];
                const standaloneTitle = (standaloneEntry && standaloneEntry.title && !genericStandaloneLabels.includes(standaloneEntry.title))
                  ? standaloneEntry.title
                  : "Unlinked";
                const standaloneMatches = matchesQ(standaloneTitle);
                const sectionHeader = (label) => (
                  <div key={`h-${label}`} style={{ padding: "10px 12px 4px", fontSize: 11, fontWeight: 600, letterSpacing: 0.08, textTransform: "uppercase", color: "var(--t-4)" }}>{label}</div>
                );
                const row = ({ id, pillType, pillLabel, title, onPick }) => {
                  const isSelected = currentPlacementId === id;
                  return (
                    <div
                      key={id}
                      onClick={onPick}
                      style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", cursor: "pointer", background: isSelected ? "var(--blue-50)" : "transparent", borderLeft: isSelected ? "3px solid var(--blue-500)" : "3px solid transparent" }}
                      onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = "var(--bg-cream)"; }}
                      onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = "transparent"; }}
                    >
                      {pillType && <span className={`pill ${pillType}`}>{pillLabel}</span>}
                      <span style={{ fontSize: 14, color: "var(--t-1)", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</span>
                      {isSelected && (
                        <span style={{ flexShrink: 0, fontSize: 10, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", color: "var(--blue-700)", background: "var(--blue-50)", border: "1px solid var(--blue-200)", borderRadius: 4, padding: "2px 6px" }}>Current</span>
                      )}
                    </div>
                  );
                };
                const pick = (id) => {
                  setCurrentPlacementId(id); setDirty(true); setPlacementDropdownOpen(false); dismissLinkTour();
                  setChangingPlacement(false); setUserPickedConcern(id !== "__unlinked__"); setAutoConcernLocked(false);
                };
                if (!occItems.length && !ascItems.length && !standaloneMatches) {
                  return <div style={{ padding: "14px", fontSize: 14, color: "var(--t-3)" }}>No matching concerns</div>;
                }
                return (
                  <React.Fragment>
                    {occItems.length > 0 && (
                      <React.Fragment>
                        {sectionHeader("Show under an original customer concern")}
                        {occItems.map(c => row({ id: c.id, pillType: "occ", pillLabel: "OCC", title: c.title, onPick: () => pick(c.id) }))}
                      </React.Fragment>
                    )}
                    {ascItems.length > 0 && (
                      <React.Fragment>
                        {sectionHeader("Show under an additional service concern")}
                        {ascItems.map(c => row({ id: c.id, pillType: "asc-cos", pillLabel: "ASC", title: c.title, onPick: () => pick(c.id) }))}
                      </React.Fragment>
                    )}
                    {standaloneMatches && (
                      <React.Fragment>
                        {sectionHeader(lockedConcern ? "Keep under original concern" : "Keep unlinked")}
                        {row({ id: "__unlinked__", pillType: null, pillLabel: "", title: standaloneTitle, onPick: () => pick("__unlinked__") })}
                      </React.Fragment>
                    )}
                  </React.Fragment>
                );
              })()}
            </div>
          )}
        </div>
      ))}
      </div>

      {/* Body */}
      <div className="scrollable" style={{ flex: 1, minHeight: 0, overflowY: "auto", padding: "12px 28px 22px 28px", display: "flex", flexDirection: "column", gap: 16, position: "relative" }}>

        {/* Details — now a collapsible accordion like the sections below it (Itemized Parts,
            Photos & Video, Tax & Fee Overrides), so it shares the same header chrome (icon,
            title, chevron on the right) and toggle behavior. */}
        <RecAccordion icon={IconPencil} title="Recommendation Details" defaultOpen={true} noTopBorder={true} headerAction={
          <button className="btn btn-secondary" style={{ height: 26, padding: "0 10px", fontSize: 12, fontWeight: 700, letterSpacing: 0.03, display: "inline-flex", alignItems: "center", gap: 6 }}><IconPrint size={13} strokeWidth={2} />Print Estimates</button>
        }>

        {/* Coach mark backdrop — dims the modal body so the link section spotlights */}
        {linkTourActive && (
          <div onClick={dismissLinkTour} style={{ position: "absolute", inset: 0, background: "rgba(16,24,40,0.72)", zIndex: 101, cursor: "pointer", borderRadius: "0 0 16px 16px" }} />
        )}

        {/* Phase 2: LINK TO EXISTING CONCERN section — for a brand-new +Custom rec (isNewRec)
            this renders as a simpler "Where should this show on the RO?" By-itself/Under-a-concern
            toggle instead of the fuller existing-rec panel; both share the same dropdown-list and
            collapsed "Linked to X + Change" markup so the underlying state machine stays unified. */}
        {/* Unified: INSPECTION RESULT + CONCERN NAME — hidden entirely for a pre-approved rec: it's
            already tied to its OCC concern (shown via the placement toggle above) and has no
            fail/caution result of its own, so there's nothing left for this box to show. */}
        {!isPreApproved && (
        <div style={{ display: "flex", flexDirection: "column", ...((lockedConcern || preLinked) ? {} : { border: "1px solid var(--b-1)", borderRadius: 8, background: "var(--bg-cream-soft)" }) }}>
        {/* For a locked-concern (fail/caution) rec, the point name is already shown in the modal's
            own header ("<point> — Linked to <section>"), so the "Pull inspection question" label +
            read-only box here would just repeat it. Skip straight to the status buttons below — and
            since that's all this box holds in that case, drop the box chrome/padding entirely so the
            Fail/Caution/Pass row sits flush with the Recommendation field beneath it. Same idea for
            preLinked (existing rec): the concern-name column is hidden (already shown via the "Shows
            under" bar), so Inspection Result is this box's only content there too — same flush,
            label-less treatment. */}
        {!lockedConcern && (
        <div style={{ display: "flex", alignItems: "stretch" }}>
          {/* Left: Inspection result — hidden once a question is pulled in, since the bottom expansion
              below takes over showing the effective status/tire grid. Clicking "Change" clears the
              commitment and should fully revert to this default state, so this no longer also
              depends on formSearchKey (which only controls whether the search dropdown auto-opens). */}
          {!isPreApproved && !formItemCommitted && <div style={{ padding: preLinked ? "0" : "12px 16px", flexShrink: 0, borderRight: (preLinked || (isNewRec && underMode)) ? "none" : "1px solid var(--b-1)" }}>
            {!preLinked && <label className="field-label">Inspection result</label>}
            <div style={{ display: "flex", gap: 6, marginTop: preLinked ? 0 : 6 }}>
              <GradeStatusBtn kind="fail"    label="Fail"    active={status === "fail"}    onClick={() => { setStatus("fail");    setDirty(true); }} />
              <GradeStatusBtn kind="caution" label="Caution" active={status === "caution"} onClick={() => { setStatus("caution"); setDirty(true); }} />
            </div>
          </div>}
          {/* Concern name / pull-inspection-question column — shown alongside Inspection Result for
              brand-new recs (naming a new standalone concern or optionally pulling in an inspection

              concern it belongs to is already decided and shown via the "Shows under X / Change" bar

          {!preLinked && <div style={{ flex: 1, padding: "12px 16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 6 }}>
              {isNewRec ? (
                <label className="field-label" style={{ margin: 0 }}>Concern name</label>
              ) : phase === 2 ? (
                <label className="field-label" style={{ margin: 0 }}>Pull inspection question <span style={{ fontWeight: 400, textTransform: "none", letterSpacing: 0 }}>(optional)</span></label>
              ) : (
                <label className="field-label" style={{ margin: 0 }}>Concern name</label>
              )}
              <InfoTooltip tip={isNewRec ? "Link to an existing inspection question to pre-fill data and group results." : phase === 2 ? "Search for an inspection question to pre-fill inspection fields and pull in additional data." : "Link to an existing inspection question to pre-fill data and group results."} />
            </div>
            {lockedConcern ? (
              <div style={{ height: 36, padding: "0 12px", border: "1px solid var(--b-2)", borderRadius: 6, background: "var(--bg-cream-soft)", display: "flex", alignItems: "center", fontSize: 14, color: "var(--t-2)", fontWeight: 500, overflow: "hidden" }}>
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{inspectionPoint || lockedConcernLabel || "—"}</span>
              </div>
            ) : formItemCommitted ? (
              /* An inspection question has been pulled in — show it as committed with a way to change it. */
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ flex: 1, display: "flex", alignItems: "center", height: 36, padding: "0 12px", border: "1px solid var(--b-2)", borderRadius: 6, background: "var(--bg-white)", minWidth: 0 }}>
                  <span style={{ fontSize: 14, color: "var(--t-1)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{formItemCommitted}</span>
                </div>
                <button
                  onClick={() => {
                    setFormItemCommitted(null); setFormItemQuery(""); setFormItemCommittedId(null); setFormSearchKey(k => k + 1);
                    setCurrentPlacementId("__unlinked__"); setUserPickedConcern(false); setAutoConcernLocked(false);
                    setCustomConcernName(""); setKeepCustom(false); setDirty(true);
                  }}
                  style={{ flexShrink: 0, height: 36, padding: "0 12px", background: "transparent", border: "1px solid var(--b-2)", borderRadius: 6, fontSize: 13, fontWeight: 600, color: "var(--blue-600)", cursor: "pointer", whiteSpace: "nowrap" }}
                  onMouseEnter={e => { e.currentTarget.style.background = "var(--blue-25)"; e.currentTarget.style.borderColor = "var(--blue-200)"; }}
                  onMouseLeave={e => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.borderColor = "var(--b-2)"; }}
                >Change</button>
              </div>
            ) : keepCustom ? (
              /* User explicitly kept a custom concern name instead of linking an inspection question. */
              <div style={{ display: "inline-flex", alignItems: "center", gap: 7, height: 36, padding: "0 12px", border: "1px solid var(--blue-200)", borderRadius: 6, background: "var(--blue-25)" }}>
                <button
                  onClick={() => { setKeepCustom(false); setFormItemQuery(""); setFormSearchKey(k => k + 1); }}
                  style={{ display: "flex", alignItems: "center", background: "none", border: "none", padding: 0, cursor: "pointer", color: "var(--blue-500)" }}
                  title="Clear"
                ><IconX size={13} /></button>
                <span style={{ fontSize: 14, fontWeight: 600, color: "var(--blue-600)", whiteSpace: "nowrap" }}>Keep custom</span>
                <button
                  onClick={() => { setKeepCustom(false); setFormItemQuery(""); setFormSearchKey(k => k + 1); }}
                  style={{ marginLeft: 4, flexShrink: 0, height: 22, padding: "0 8px", background: "transparent", border: "1px solid var(--blue-200)", borderRadius: 4, fontSize: 12, fontWeight: 600, color: "var(--blue-600)", cursor: "pointer" }}
                  onMouseEnter={e => { e.currentTarget.style.background = "var(--blue-50)"; }}
                  onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}
                >Search instead</button>
              </div>
            ) : (
              <FormItemSearchField
                key={formSearchKey}
                autoOpen={formSearchKey > 0}
                value={isNewRec ? customConcernName : formItemQuery}
                keepQueryOnCustom={true}
                onChange={(v, item) => {
                  if (isNewRec) {
                    setCustomConcernName(v); setDirty(true);
                    if (item && item.id !== "__custom__") { setFormItemCommitted(v); setFormItemCommittedId(item.id); }
                  } else {
                    setFormItemQuery(v); setDirty(true);
                    if (item) {
                      if (item.id === "__custom__") {
                        setFormItemCommitted(null); setFormItemCommittedId(null); setAutoConcernLocked(false);
                        setCustomConcernName(""); setCurrentPlacementId("__unlinked__"); setUserPickedConcern(false); setKeepCustom(true);
                      } else {
                        setFormItemCommitted(item.id === "__new_concern__" ? (v || "New concern") : v);
                        setFormItemCommittedId(item.id !== "__new_concern__" ? item.id : null);
                        if (item.id !== "__new_concern__") {
                          setCustomConcernName(v); setAutoConcernLocked(true); setUserPickedConcern(false);
                          if (item.concernId) setCurrentPlacementId(item.concernId);
                        }
                      }
                    }
                  }
                }}
                formItems={formItems}
                placeholder={isNewRec ? "Search for an inspection question or add custom concern" : phase === 2 ? "Search for an inspection question" : "Search for an inspection question or add custom concern"}
              />
            )}
          </div>}
        </div>
        )}
        {/* Bottom expansion — once a question is pulled in, show its effective inspection result:
            the tire tread grid if the pulled question is a tire point, otherwise Fail/Caution. This
            is what actually reflects the pulled-in data (readings/status) back to the user. */}
        {formItemCommitted && (
          <div style={{ borderTop: lockedConcern ? "none" : "1px solid var(--b-1)", padding: lockedConcern ? "0" : "10px 16px" }}>
            {copyFieldsIsTire ? (
              <TireTreadSection readings={tireReadings} onChange={handleTire} unit={formLinkedPoint?.unit || "mm"} naked />
            ) : (
              <InspectionResultSection status={status} onStatus={(s) => { setStatus(s); setDirty(true); }} naked />
            )}
          </div>
        )}
        </div>
        )}
        {isTire && (
          <TireTreadSection readings={tireReadings} onChange={handleTire} unit={(linkedPoint && linkedPoint.unit) || (tire && tire.unit) || "mm"} />
        )}

        {/* What needs done + Op code — hidden until concern step is complete, and hidden for pre-approved */}
        {recFieldsVisible && <div style={{ display: "grid", gridTemplateColumns: "1fr 160px", gap: 16, alignItems: "start" }}>
          <div>
            <label className="field-label">Recommendation</label>
            <AutoGrowTextarea id="rec-whatneedsdone" value={whatNeedsDone} onChange={(e) => { setWhatNeedsDone(e.target.value); setDirty(true); }} />
          </div>
          <div>
            <label className="field-label">Op code</label>
            <input className="input compact" value={opCode} onChange={(e) => { setOpCode(e.target.value); setDirty(true); }} style={{ fontFamily: "var(--font-mono)", fontSize: 14 }} />
          </div>
        </div>}

        {recFieldsVisible && <div style={{ display: "grid", gridTemplateColumns: "1.4fr 0.7fr 1fr 1fr 1fr", gap: 12 }}>
          <div>
            <label className="field-label">Labor type</label>
            <select className="select compact" value={laborType} onChange={(e) => { setLaborType(e.target.value); setDirty(true); }}>
              <option value="C20">C20</option>
              <option value="CP">CP — Customer pay</option>
              <option value="WP">WP — Warranty</option>
              <option value="IP">IP — Internal pay</option>
            </select>
          </div>
          <div>
            <label className="field-label">Hours</label>
            <input className="input compact" value={hours} onChange={(e) => { setHours(e.target.value); setDirty(true); }} />
          </div>
          <div>
            <label className="field-label">Labor $</label>
            <input className="input compact" value={labor === "" ? "" : `$${labor}`} placeholder="No input" onChange={(e) => { setLabor(e.target.value.replace(/^\$/, "")); setDirty(true); }} />
          </div>
          <div>
            <label className="field-label">Parts $</label>
            <input className="input compact" value={parts === "" ? "" : `$${parts}`} placeholder="No input" onChange={(e) => { setParts(e.target.value.replace(/^\$/, "")); setDirty(true); }} />
          </div>
          <div>
            <label className="field-label">Misc $</label>
            <input className="input compact" value={`$${misc}`} onChange={(e) => { setMisc(e.target.value.replace(/^\$/, "")); setDirty(true); }} />
          </div>
        </div>}

        {/* Internal parts notes — integrated directly into the fields section above (no divider,
            no accordion collapse) rather than living as its own separate accordion item below. */}
        {recFieldsVisible && (
          <div style={{ padding: "9px 12px", borderRadius: 8, background: "#FFF0DB", border: "1px solid #F3DDA1" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 3 }}>
              <IconDoc size={13} style={{ color: "#B45309" }} />
              <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.07em", textTransform: "uppercase", color: "#B45309" }}>Internal Parts Notes</span>
            </div>
            <textarea
              value={notes}
              onChange={(e) => { setNotes(e.target.value); setDirty(true); }}
              rows={2}
              placeholder="Enter the list of parts needed for the estimate. Drag & drop or paste media here to attach internal media (customers will not see these)."
              style={{
                width: "100%", minHeight: 56,
                border: "1px solid #D5D7DA", borderRadius: 8,
                padding: "7px 8px", fontSize: 14, fontFamily: "inherit", lineHeight: 1.35,
                resize: "vertical", outline: "none",
                background: "var(--bg-white)", boxSizing: "border-box",
              }}
            />
          </div>
        )}

        {/* Prior decline */}
        {decline && recFieldsVisible && (
          <PriorDeclineBanner
            onDismiss={() => setDecline(false)}
            onPrefill={() => {
              setLabor("200"); setParts("110"); setMisc("0");
              setWhatNeedsDone("Replace front brake pads (previously declined 03/14)");
            }}
          />
        )}
        </RecAccordion>

        {/* Bundle removed — bundling hidden per design */}

        {/* Accordions — hidden until concern step is complete */}
        {recFieldsVisible && <div style={{ display: "flex", flexDirection: "column", marginTop: -8 }}>
          <RecAccordion icon={IconWrench}  title="Itemized Parts"        subtitle={itemized.length ? `${itemized.length} part${itemized.length !== 1 ? "s" : ""} · $${partsSubtotal.toFixed(2)} subtotal` : ""} defaultOpen={initialSection === "parts"}>
            <EnhancedPartsTable parts={itemized} onChange={(p) => { setItemized(p); setDirty(true); }} />
          </RecAccordion>
          <RecAccordion icon={IconImage}   title="Photos & Video"        badge="2 photos · 1 video" defaultOpen={initialSection === "media"}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <MediaUploadArea internal={false} />
              <MediaUploadArea internal={true} />
            </div>
          </RecAccordion>
          <RecAccordion icon={IconDollar}  title="Tax & Fee Overrides"   badge="1 override active" defaultOpen={initialSection ? initialSection === "tax" : false}>
            <TaxFeeTable baseLabor={Number(labor)} baseParts={Number(parts)} baseMisc={Number(misc)} onHidePriceChange={setHidePrice} />
          </RecAccordion>
        </div>}
      </div>

      {/* Footer */}
      <div style={{
        flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "18px 28px",
        background: "var(--bg-cream-soft)",
        borderTop: "1px solid var(--b-1)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          {onDelete && (
            <button
              style={{ height: 30, fontSize: 13, padding: "0 10px", background: "transparent", border: "1px solid #F0B6B6", color: "var(--red-600)", borderRadius: 6, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6 }}
              onMouseEnter={e => { e.currentTarget.style.background = "var(--red-50)"; }}
              onMouseLeave={e => { e.currentTarget.style.background = "transparent"; }}
              onClick={() => { onDelete(); onClose(); }}
            >
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              Delete
            </button>
          )}
          <div>
          <div className="caps" style={{ color: "var(--t-3)", marginBottom: 0, fontSize: 14 }}>Total · shown to customer</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>

            <div style={{ fontSize: 14, color: "var(--t-3)" }}>

          </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="btn btn-secondary" style={{ height: 30, fontSize: 14, padding: "0 11px" }} onClick={handleClose}>Cancel</button>
          <button className="btn btn-primary" style={{ height: 30, fontSize: 14, padding: "0 13px" }} onClick={() => { onSave && onSave(buildSavePayload()); }}>Save</button>
        </div>
      </div>

      {/* Jump-to-another-recommendation confirmation — shown only when the user has unsaved
          changes and clicks a different rec in the live preview panel. */}
      {pendingJump && (
        <div style={{
          position: "absolute", inset: 0,
          background: "rgba(16,24,40,0.45)",
          zIndex: 21,
          display: "flex", alignItems: "center", justifyContent: "center",
          borderRadius: isPanel ? 0 : 12,
        }}>
          <div style={{
            background: "var(--bg-white)",
            border: "1px solid var(--b-1)",
            borderRadius: 10,
            boxShadow: "var(--shadow-modal)",
            padding: "24px 24px 20px",
            width: 340,
            display: "flex", flexDirection: "column", gap: 14,
          }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "var(--t-1)", marginBottom: 6 }}>Save changes before switching?</div>
              <div style={{ fontSize: 14, color: "var(--t-3)", lineHeight: 1.5 }}>You have unsaved changes to this recommendation. Save them before jumping to another one, or cancel to keep editing here.</div>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button className="btn btn-secondary" style={{ height: 30, fontSize: 14, padding: "0 12px" }} onClick={() => { setPendingJump(null); onJumpCancelled && onJumpCancelled(); }}>Cancel</button>
              <button className="btn btn-primary" style={{ height: 30, fontSize: 14, padding: "0 13px" }} onClick={() => {
                onSave && onSave(buildSavePayload());
                const t = pendingJump; setPendingJump(null);
                onJumpConfirmed && onJumpConfirmed(t);
              }}>Save &amp; Switch</button>
            </div>
          </div>
        </div>
      )}

      {/* Unsaved changes confirmation */}
      {confirmClose && (
        <div style={{
          position: "absolute", inset: 0,
          background: "rgba(16,24,40,0.45)",
          zIndex: 20,
          display: "flex", alignItems: "center", justifyContent: "center",
          borderRadius: isPanel ? 0 : 12,
        }}>
          <div style={{
            background: "var(--bg-white)",
            border: "1px solid var(--b-1)",
            borderRadius: 10,
            boxShadow: "var(--shadow-modal)",
            padding: "24px 24px 20px",
            width: 340,
            display: "flex", flexDirection: "column", gap: 14,
          }}>

// Click-to-open "move" menu — replaces the old drag handle. Lists every other
// concern as a destination, plus an option to spin up a new concern.
const MoveMenu = ({ concerns, currentConcernId, linkedConcernId, onSelect, onCreateNew, onDragStart, onDragEnd, onDropAtRec, arrow, standaloneName }) => {
  const [open, setOpen] = React.useState(false);
  const [menuPos, setMenuPos] = React.useState({ top: 0, left: 0 });
  const ref = React.useRef(null);
  const btnRef = React.useRef(null);
  // Custom pointer-drag: a click (no movement) opens the menu; a press-and-drag
  // past a small threshold picks the item up and drops it on another concern card.
  // We avoid native HTML5 DnD because it's unreliable here; instead we hit-test
  // with elementFromPoint against [data-concern-drop] cards and reuse onSelect to
  // perform the actual move.
  const dragRef = React.useRef(null);
  const justDraggedRef = React.useRef(false);

  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  const targets = concerns.filter((c) => c.id !== currentConcernId);
  const isDraggable = !!onDragStart;

  const clearHot = (st) => {
    if (!st) return;
    if (st.hotEl) {
      st.hotEl.style.outline = "";
      st.hotEl.style.outlineOffset = "";
      st.hotEl.style.background = st.hotPrevBg || "";
      st.hotEl = null; st.hotPrevBg = null;
    }
    if (st.line) { st.line.remove(); st.line = null; }
    st.mode = null; st.dropConcernId = null; st.dropRecId = null; st.dropBefore = false;
  };

  const onPointerDown = (e) => {
    if (!isDraggable || e.button !== 0) return;
    justDraggedRef.current = false;
    const st = { startX: e.clientX, startY: e.clientY, dragging: false, ghost: null, line: null, hotEl: null, hotPrevBg: null, mode: null, dropConcernId: null, dropRecId: null, dropBefore: false };
    dragRef.current = st;

    const move = (ev) => {
      const dx = ev.clientX - st.startX, dy = ev.clientY - st.startY;
      if (!st.dragging) {
        if (Math.hypot(dx, dy) < 5) return;
        st.dragging = true;
        setOpen(false);
        onDragStart && onDragStart();
        const g = document.createElement("div");
        g.textContent = onDropAtRec ? "Drag to reorder or move" : "Drop on a concern to move";
        g.style.cssText = "position:fixed;z-index:9999;pointer-events:none;left:0;top:0;padding:6px 10px;border-radius:6px;background:#02679B;color:#fff;font:600 12px/1 Lato,system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);white-space:nowrap;";
        document.body.appendChild(g);
        st.ghost = g;
        document.body.style.cursor = "grabbing";
        document.body.style.userSelect = "none";
      }
      st.ghost.style.transform = `translate(${ev.clientX + 14}px, ${ev.clientY + 14}px)`;
      st.ghost.style.display = "none";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      st.ghost.style.display = "block";
      const closest = (sel) => (under && under.closest ? under.closest(sel) : null);
      const newZone = closest("[data-concern-new]");
      const recRow = (!newZone && onDropAtRec) ? closest("[data-rec-id]") : null;
      const card = (!newZone && !recRow) ? closest("[data-concern-drop]") : null;
      clearHot(st);
      if (newZone) {
        st.mode = "new";
        st.hotEl = newZone; st.hotPrevBg = newZone.style.background;
        newZone.style.outline = "2px solid var(--blue-500)"; newZone.style.outlineOffset = "-2px";
      } else if (recRow) {
        const rect = recRow.getBoundingClientRect();
        const before = ev.clientY < rect.top + rect.height / 2;
        st.mode = "rec";
        st.dropConcernId = recRow.getAttribute("data-rec-concern");
        st.dropRecId = recRow.getAttribute("data-rec-id");
        st.dropBefore = before;
        const line = document.createElement("div");
        line.style.cssText = "position:fixed;z-index:9998;pointer-events:none;height:2.5px;border-radius:2px;background:#02679B;box-shadow:0 0 0 1px rgba(2,103,155,.2);";
        line.style.left = rect.left + "px";
        line.style.width = rect.width + "px";
        line.style.top = ((before ? rect.top : rect.bottom) - 1) + "px";
        document.body.appendChild(line);
        st.line = line;
      } else if (card) {
        const cid = card.getAttribute("data-concern-drop");
        if (cid !== currentConcernId) {
          st.mode = "card"; st.dropConcernId = cid;
          st.hotEl = card; st.hotPrevBg = card.style.background;
          card.style.outline = "2px solid var(--blue-500)"; card.style.outlineOffset = "-2px";
          card.style.background = "var(--blue-50)";
        }
      }
    };

    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
      if (st.ghost) st.ghost.remove();
      const mode = st.mode, dc = st.dropConcernId, dr = st.dropRecId, db = st.dropBefore;
      clearHot(st);
      if (st.dragging) {
        justDraggedRef.current = true;
        onDragEnd && onDragEnd();
        if (mode === "new") onCreateNew && onCreateNew();
        else if (mode === "rec" && onDropAtRec) onDropAtRec(dc, dr, db);
        else if (mode === "card" && dc) onSelect(dc);
      }
      dragRef.current = null;
    };

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  };

  return (
    <div ref={ref} style={{ position: "relative", flexShrink: 0 }} onClick={(e) => e.stopPropagation()}>
      {/* Press-and-drag to move between concerns; plain click opens the menu. */}
      <div
        role="button"
        tabIndex={0}
        ref={btnRef}
        onPointerDown={isDraggable ? onPointerDown : undefined}
        onClick={(e) => { e.stopPropagation(); if (justDraggedRef.current) { justDraggedRef.current = false; return; } if (!open && btnRef.current) { const r = btnRef.current.getBoundingClientRect(); setMenuPos({ top: r.bottom + 6, left: r.left }); } setOpen((o) => !o); }}
        onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen((o) => !o); } }}
        title={arrow ? "Move to a concern" : (isDraggable ? "Click to pick a concern, or drag to another concern" : "Move to another concern")}
        style={{
          width: 24, height: 24, borderRadius: 5,
          background: open ? "var(--bg-cream)" : "transparent",
          border: `1px solid ${open ? "var(--b-3)" : "var(--b-2)"}`,
          color: "var(--t-3)", cursor: isDraggable ? "grab" : "pointer",
          display: "grid", placeItems: "center", touchAction: "none",
        }}
        onMouseEnter={(e) => { if (!open) { e.currentTarget.style.background = "var(--bg-cream)"; e.currentTarget.style.borderColor = "var(--b-3)"; } }}
        onMouseLeave={(e) => { if (!open) { e.currentTarget.style.background = "transparent"; e.currentTarget.style.borderColor = "var(--b-2)"; } }}
      >
        {arrow ? <IconSubdirectory size={15} /> : <IconMove size={15} />}
      </div>

      {open && (
        <div style={{
          position: "fixed", left: menuPos.left, top: menuPos.top,
